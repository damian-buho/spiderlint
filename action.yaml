name: 'Spiderlint'
description: 'Crawl a site and lint its SEO tags, security headers, TLS and links'
author: 'Damián Búho'
branding:
  icon: globe
  color: green
inputs:
  urls:
    description: 'Newline-separated seed URLs. Empty takes the targets from the config file.'
    required: false
    default: ''
  config_file:
    description: 'Projectfile or plain YAML carrying the org.spiderlint subtree, relative to the workspace.'
    required: false
    default: ''
  site:
    description: 'One org.spiderlint.sites name to audit; a config declaring several needs one step per site.'
    required: false
    default: ''
  rules:
    description: 'Comma-separated rulesets replacing every group’s rules (e.g. recommended,axe).'
    required: false
    default: ''
  args:
    description: 'More audit flags, one per line with its value after a space (e.g. --max-pages 200).'
    required: false
    default: ''
  fail_on:
    description: 'Severity that fails the job: error | warning | info | never'
    required: false
    default: 'error'
  upload_sarif:
    description: 'Upload the SARIF report to code scanning; needs the security-events: write permission.'
    required: false
    default: 'false'
  cache:
    description: 'Keep the crawl store in the forge cache, so an unchanged site is re-audited with 304s.'
    required: false
    default: 'true'
  version:
    description: 'Image tag to pull (e.g. latest, 1.2.3). Empty follows the action’s own version tag, else latest.'
    required: false
    default: ''
  image:
    description: 'Full image reference. Takes precedence over `version`.'
    required: false
    default: ''
outputs:
  exit_code:
    description: 'spiderlint’s exit code: 0 clean, 1 findings at or above fail_on'
    value: ${{ steps.audit.outputs.exit_code }}
  report_json:
    description: 'Path on the runner to the JSON report'
    value: ${{ steps.audit.outputs.report_json }}
  sarif_path:
    description: 'Path on the runner to the SARIF report'
    value: ${{ steps.audit.outputs.sarif_path }}
runs:
  using: composite
  steps:
    - name: Restore the store
      if: ${{ inputs.cache == 'true' }}
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ runner.temp }}/spiderlint-cache
        key: spiderlint-${{ github.job }}-${{ inputs.site }}-${{ github.run_id }}
        restore-keys: spiderlint-${{ github.job }}-${{ inputs.site }}-
    - name: Audit
      id: audit
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        VERSION: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
        URLS: ${{ inputs.urls }}
        CONFIG_FILE: ${{ inputs.config_file }}
        SITE: ${{ inputs.site }}
        RULES: ${{ inputs.rules }}
        EXTRA_ARGS: ${{ inputs.args }}
        FAIL_ON: ${{ inputs.fail_on }}
      run: ${{ github.action_path }}/.scripts/action/audit.sh
    - name: Save the store
      if: ${{ always() && inputs.cache == 'true' }}
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ runner.temp }}/spiderlint-cache
        key: spiderlint-${{ github.job }}-${{ inputs.site }}-${{ github.run_id }}
    - name: Upload SARIF
      if: ${{ inputs.upload_sarif == 'true' && steps.audit.outputs.sarif_path != '' }}
      uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      with:
        sarif_file: ${{ steps.audit.outputs.sarif_path }}
        category: ${{ inputs.site && format('spiderlint-{0}', inputs.site) || 'spiderlint' }}
    - name: Apply fail_on
      if: ${{ steps.audit.outputs.exit_code == '1' }}
      shell: bash
      env:
        FAIL_ON: ${{ inputs.fail_on }}
      run: |
        echo "::error::spiderlint found issues at or above ${FAIL_ON}"
        exit 1
