---
redis: redis://spiderlint-valkey:6379/0
retention: 1d
workers: 2
allow-private: true
page:
  directory: /etc/spiderlint/page
clients:
  rate: false
  trusted-proxies: [172.16.0.0/12]
policies:
  - name: ru
    hosts: [ru, su, рф]
    ban: Scans of these hosts are disabled on this instance
  - name: dev
    hosts: ["*"]
    repeat: 5m
    caps: {max-pages: 50, scan-timeout: 5m}
    fetch: [http, browser, auto, adaptive]
