---
name: ${M6E_COMPOSE_PROJECT_NAME}
services:
  spiderlint:
    container_name: ${M6E_CONTAINER_INSTANCE}
    image: ${M6E_IMAGE_FULLNAME}
    depends_on:
      spiderlint-valkey:
        condition: service_healthy
    # Preset: large (2.0c, 4g) — CI build/test container. Bounded so it can't starve the shared host.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4g
    networks:
      - dev-network
    environment:
      - LANG
      - TZ
      - SPIDERLINT_TEST_VALKEY=spiderlint-valkey:6379
    volumes:
      - spiderlint-browsers:/app/.cache/ms-playwright
    secrets:
      - o9s.vlky.password
  spiderlint-valkey:
    container_name: ${M6E_CONTAINER_INSTANCE}-valkey
    image: ${O9S_VALKEY_IMAGE}
    # Preset: tiny (½c, 512m).
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
    networks:
      - dev-network
    environment:
      - LANG
      - TZ
      - O9S_VLKY_SAVE=
    secrets:
      - o9s.vlky.password
volumes:
  spiderlint-browsers:
    name: spiderlint-browsers
secrets:
  o9s.vlky.password:
    file: ../.secrets/o9s/vlky/password
networks:
  dev-network:
    name: ${M6E_COMPOSE_PROJECT_NAME}-network
