# SPDX-License-Identifier: MIT
$schema: https://projectfile.org/schema/v1.json
identity:
  created: "2026-09-19"
  name: spiderlint
  namespace: me.dbuho
  summary:
    en: Site-wide linter for SEO tags, security headers, TLS and links
    es: Linter de sitio completo para etiquetas SEO, cabeceras de seguridad, TLS y enlaces
    uk: Лінтер усього сайту для SEO-тегів, заголовків безпеки, TLS і посилань
  title: Spiderlint
  description:
    en: Spiderlint crawls every page a site serves, collects facts about each request (HTML, headers, TLS, timings, sizes) and lints them against rulesets scoped by URL group, so a template missing a heading is one finding rather than one per page. Built on Node and Crawlee.
    es: Spiderlint rastrea cada página que sirve un sitio, recoge datos de cada petición (HTML, cabeceras, TLS, tiempos, tamaños) y los valida contra conjuntos de reglas por grupo de URL, de modo que una plantilla sin encabezado es un solo hallazgo y no uno por página. Construido sobre Node y Crawlee.
    uk: Spiderlint обходить кожну сторінку сайту, збирає факти про кожен запит (HTML, заголовки, TLS, таймінги, розміри) і перевіряє їх за наборами правил для груп URL, тож шаблон без заголовка — це один результат, а не по одному на сторінку. Побудовано на Node і Crawlee.
  version: 0.137.0
  released: "2026-10-03"
includes:
  - .makefile/b19/ci.yaml
  - .makefile/b19/images/node.yaml
  - .makefile/container/traits/readme-tool-image.yaml
  - .makefile/core/traits/github-action.yaml
  - .makefile/library/images/valkey.yaml
  - .makefile/library/languages/node.yaml
  - .makefile/library/vulnerabilities/npm/stream-json.yaml
  - .projectfile/vulnerabilities.yaml
  - https://kiota.ch/damian-buho/metadata/raw/branch/main/include.yaml
  - https://kiota.ch/damian-buho/metadata/raw/branch/main/traits/personal-image.yaml
keywords:
  - spiderlint
  - linter
  - crawler
  - seo
  - security-headers
  - sarif
kind: SoftwareSourceCode
license:
  covers: project
  spdx: MIT
links:
  - label:
      en: Spiderlint on dbuho.me
      es: Spiderlint en dbuho.me
      uk: Spiderlint на dbuho.me
    priority: 20
    type: homepage
    url: https://dbuho.me/project/spiderlint/
  - label:
      en: Spiderlint on kiota.ch
      es: Spiderlint en kiota.ch
      uk: Spiderlint на kiota.ch
    preferred: true
    priority: 10
    type: source-code
    url: https://kiota.ch/damian-buho/spiderlint
org:
  projectfile:
    architecture:
      - amd64
    artifacts:
      npm-package:
        command: ${identity.name}
        help: ["", audit, crawl, lint, show-report, show-facts, export-facts, list-groups, list-rules, list-presets, explain-rule, show-cache, purge-cache, warm-cache]
    build:
      args:
        B19_NODE_SERIES: 26
        PF_CLI_IMAGE: ""
    ci:
      env:
        O9S_VALKEY_IMAGE: ""
      secrets:
        o9s.vlky.password:
          docker:
            run: m6e-secret-random
    conventions:
      fragments:
        parents:
          - url: ssh://git@kiota.ch/b19/ubuntu.git
    ignores:
      git:
        include:
          - storage/
    operating-system:
      - linux
    status: experimental
  spiderlint: {}
repositories:
  - branch: main
    role: origin
    type: git
    url: ssh://git@kiota.ch/damian-buho/spiderlint.git
technologies:
  - node
  - typescript
requirements:
  runtime:
    node: '>=26'
