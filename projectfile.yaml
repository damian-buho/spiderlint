org:
  projectfile:
    architecture:
      - amd64
    artifacts:
      npm-package:
        command: ${identity.name}
        executable: bin/spiderlint.js
        subcommands: [audit, crawl, lint, show-report, show-facts, export-facts, list-groups, list-rules, list-presets, explain-rule, show-cache, purge-cache, warm-cache]
    build:
      args:
        B19_NODE_SERIES: 26
        PF_CLI_IMAGE: ""
    ci:
      env:
        O9S_VALKEY_IMAGE: ""
      secrets:
        o9s.vlky.password:
          docker:
            run: m6e-secret-random
      nodes:
        source-is-tested:
          needs:
            usage-check: true
        source-passes-lint:
          needs:
            npm-format-check: true
      tools:
        npm-format-check:
          image: NODE_TOOL_IMAGE
          run: npm run format:check
          description: Check the source is formatted by prettier
          guard: package.json
          fuse: lint
          tags: [node]
        npm-test:
          set-env:
            PLAYWRIGHT_BROWSERS_PATH: /app/.cache/host-playwright
          mounts:
            - from: /home/buho/.cache/ms-playwright
              to: /app/.cache/host-playwright
    conventions:
      fragments:
        parents:
          - url: ssh://git@kiota.ch/b19/ubuntu.git
    ignores:
      git:
        include:
          - storage/
          - '*.tmp.*'
    operating-system:
      - linux
    status: experimental
  spiderlint: {}
repositories:
  - branch: main
    role: origin
    type: git
    url: ssh://git@kiota.ch/damian-buho/spiderlint.git
  - role: mirror
    type: git
    url: git@github.com:damian-buho/spiderlint.git
  - role: mirror
    type: git
    url: git@codeberg.org:damian-buho/spiderlint.git
requirements:
  runtime:
    node: '>=26'
technologies:
  - node
  - typescript
