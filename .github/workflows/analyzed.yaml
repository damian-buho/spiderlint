            ci-cache-npm-
      - name: npm-install
        if: vars.CI_SKIP_DEPENDENCIES_ARE_INSTALLED != 'true' && vars.CI_SKIP_NPM_INSTALL != 'true'
        uses: projectfile-org/actions/run-tool@b0da59497e5cc94a601334e6b4d9e376000012b7 # v1
        with:
          image: ${{ vars.NODE_TOOL_IMAGE || format('{0}/b19/node', vars.SOURCE_DOCKER_REGISTRY || 'ghcr.io/damian-buho') }}
          version: ${{ vars.M6E_BASE_IMAGE_VARIANT_PREFIX }}n${{ vars.B19_NODE_SERIES || '26' }}
          run: npm ci
