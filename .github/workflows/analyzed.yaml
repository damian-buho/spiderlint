jobs:
  analyzed:
    runs-on: ubuntu-26.04
    needs: ["image-is-analyzed"]
    if: ${{ !cancelled() && needs.image-is-analyzed.result == 'success' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
          persist-credentials: false
