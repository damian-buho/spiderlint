---
description: Redirect chain length and permanent redirects
rules:
  redirects/chain-length:
    fact: http.redirects
    expect: {type: array, maxItems: 2}
    severity: warning
    score: 4.8
    message: "takes more than 2 redirects to land ({got})"
    fix: "Collapse the redirect chain so the final URL is reached in one or two hops."
    docs: https://developers.google.com/search/docs/crawling-indexing/301-redirects
  redirects/permanent:
    fact: http.redirects
    expect: {type: array, items: {properties: {status: {enum: [301, 308]}}}}
    when: {http.status: {minimum: 200, maximum: 299}}
    severity: info
    score: 2.4
    message: "reached through a temporary redirect ({got})"
    fix: "Answer a moved page with 301 or 308, not 302, 303 or 307."
    docs: https://developers.google.com/search/docs/crawling-indexing/301-redirects#permanent-server-side
