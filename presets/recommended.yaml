---
description: The default ruleset of every group — all presets except browser
extends:
  - spiderlint:seo
  - spiderlint:security-headers
  - spiderlint:performance
  - spiderlint:links
  - spiderlint:tls
  - spiderlint:cookies
  - spiderlint:redirects
  - spiderlint:sitemap
  - spiderlint:robots
  - spiderlint:resources
  - spiderlint:origin
  - spiderlint:crawlers
  - spiderlint:dns:recommended
  - spiderlint:mail:recommended
  - spiderlint:sshfp
  - spiderlint:network
  - spiderlint:images
  - spiderlint:icons
  - spiderlint:insights
rules:
  http/host/inconsistent:
    severity: info
    score: 2.8
  icons/favicon/missing: warning
  icons/apple-touch/missing: warning
  icons/declared-size/mismatch: warning
  icons/svg/invalid: off
  icons/mask-icon/invalid: off
  icons/ms-tile/unreachable: off
  manifest/document/invalid:
    severity: error
    score: 7.2
  origin/www/unreachable: info
  http/date/mismatch:
    severity: warning
    score: [[-3600, 6.8], [-60, 3.4], [60, 3.4], [3600, 6.8]]
  http/content-length/invalid:
    severity: warning
    score: 5.4
  http/date/missing:
    fact: http.headers.date
    expect: {type: [string, array]}
    severity: warning
    score: 4.2
    message: "no Date header"
    title: "The response has no Date header"
    rationale: "Without Date, caches cannot work out how old a response is, so they may serve stale content or cache it badly. Clients that compare clocks lose a reference too."
    docs: https://www.rfc-editor.org/rfc/rfc9110#section-5.6.7
    fix: "Send Date in IMF-fixdate form, as Sun, 06 Nov 1994 08:49:37 GMT."
  http/date/invalid:
    fact: http.headers.date
    expect: {type: string, pattern: "^(Mon|Tue|Wed|Thu|Fri|Sat|Sun), \\d{2} (Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) \\d{4} \\d{2}:\\d{2}:\\d{2} GMT$"}
    when: {http.headers.date: {type: [string, array]}}
    severity: warning
    score: 4.2
    message: "Date should be an IMF-fixdate"
    title: "The Date header is not in the standard date format"
    rationale: "Caches and clients that cannot parse Date fall back to guessing the response’s age, which breaks freshness calculations. HTTP requires the fixed GMT form, such as Sun, 06 Nov 1994 08:49:37 GMT. Only responses that send Date are checked."
    fix: "Send Date in IMF-fixdate form, as Sun, 06 Nov 1994 08:49:37 GMT."
    docs: https://www.rfc-editor.org/rfc/rfc9110#section-5.6.7
