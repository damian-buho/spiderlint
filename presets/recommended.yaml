---
description: The default ruleset of every group — all presets except browser
extends:
  - spiderlint:seo
  - spiderlint:security-headers
  - spiderlint:performance
  - spiderlint:links
  - spiderlint:tls
  - spiderlint:cookies
  - spiderlint:redirects
  - spiderlint:sitemap
  - spiderlint:robots
  - spiderlint:resources
  - spiderlint:origin
  - spiderlint:dns:core
  - spiderlint:images
rules:
  http/consistent-origin: info
  http/clock-skew: warning
  http/date:
    fact: http.headers.date
    expect: {type: string, pattern: "^(Mon|Tue|Wed|Thu|Fri|Sat|Sun), \\d{2} (Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) \\d{4} \\d{2}:\\d{2}:\\d{2} GMT$"}
    severity: warning
    message: "Date should be an IMF-fixdate, found {got}"
    fix: "Send Date in IMF-fixdate form, as Sun, 06 Nov 1994 08:49:37 GMT."
    docs: https://www.rfc-editor.org/rfc/rfc9110#section-5.6.7
