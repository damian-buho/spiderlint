---
description: Titles, descriptions, headings, canonical, Open Graph and alt text
when:
  http.status: {minimum: 200, maximum: 299}
rules:
  html/lang:
    fact: html.lang
    expect: {type: string, pattern: "^[A-Za-z]{2,3}(-[A-Za-z0-9]{1,8})*$"}
    severity: error
    score: 8.2
    message: "<html lang> should be a BCP 47 language tag, found {got}"
    docs: https://developer.mozilla.org/docs/Web/HTML/Global_attributes/lang
    fix: "Set <html lang> to a BCP 47 language tag."
  html/viewport:
    fact: html.meta.viewport
    expect: {type: string, pattern: "^(?!.*(?i:user-scalable)\\s*=\\s*(?i:no|0)\\b)(?!.*(?i:maximum-scale)\\s*=\\s*1(\\.0+)?(?![\\d.]))(?=.*(?i:width\\s*=\\s*device-width))"}
    severity: warning
    score: 5.3
    message: "meta viewport should set width=device-width and allow zoom, found {got}"
    docs: https://developer.mozilla.org/docs/Web/HTML/Viewport_meta_tag
    fix: "Set <meta name=viewport content=\"width=device-width\"> and allow zoom."
  html/viewport-syntax:
    severity: info
    score: 1.3
  html/theme-color:
    fact: html.meta.theme-color
    expect: {type: string, minLength: 1}
    severity: warning
    score: 3.3
    message: "no meta theme-color"
    docs: https://developer.mozilla.org/docs/Web/HTML/Element/meta/name/theme-color
    fix: "Add <meta name=theme-color> with a color value."
  html/theme-color-syntax:
    severity: warning
    score: 3.3
  html/color-scheme:
    fact: html.meta.color-scheme
    expect: {type: string, pattern: "^\\s*(?:(?i:normal)|(?:(?i:only)\\s+)?(?!(?i:normal|only)\\b)[A-Za-z_-][\\w-]*(?:\\s+(?!(?i:normal|only)\\b)[A-Za-z_-][\\w-]*)*(?:\\s+(?i:only))?)\\s*$"}
    severity: info
    score: 1.4
    message: "meta color-scheme should be normal, or scheme names such as light dark, found {got}"
    docs: https://developer.mozilla.org/docs/Web/HTML/Element/meta/name/color-scheme
    fix: "Add <meta name=color-scheme content=\"light dark\">."
  html/theme-color-schemes:
    when: {html.meta.color-scheme: {type: string, allOf: [{pattern: "(?i:\\blight\\b)"}, {pattern: "(?i:\\bdark\\b)"}]}}
    fact: html.metas
    expect:
      allOf:
        - {contains: {properties: {name: {const: theme-color}}, required: [name]}, minContains: 2}
        - {contains: {properties: {name: {const: theme-color}, media: {pattern: "(?i:prefers-color-scheme)"}}, required: [name, media]}}
    severity: warning
    score: 3.4
    message: "color-scheme names light and dark, but no theme-color pair carries a prefers-color-scheme media"
    fix: "Add <meta name=theme-color media=\"(prefers-color-scheme: dark)\"> beside the light one."
    docs: https://developer.mozilla.org/docs/Web/HTML/Element/meta/name/theme-color#media
  html/noindex-listed:
    fact: robots.noindex
    expect: {const: false}
    when: {sitemap.listed: true, url.twin: {not: {type: string}}, site.role: production}
    severity: error
    score: 8.0
    message: "a page the sitemap lists says noindex, in <meta name=robots> or X-Robots-Tag"
    docs: https://developers.google.com/search/docs/crawling-indexing/block-indexing
    fix: "Remove noindex from <meta name=robots> or X-Robots-Tag, or unlist the page from the sitemap."
  html/dir-rtl:
    fact: html.dir
    expect: {const: rtl}
    when: {html.lang: {type: string, pattern: "^(?i:ar|arc|ckb|dv|fa|he|ps|sd|ug|ur|yi)(-|$)"}}
    severity: warning
    score: 3.8
    message: "a right-to-left language should set <html dir=rtl>, found {got}"
    docs: https://www.w3.org/International/questions/qa-html-dir
    fix: "Add dir=rtl to the <html> element."
  html/charset:
    fact: html.charset
    expect: {type: object, required: [declared, offset], properties: {declared: {pattern: "^(?i:utf-?8)$"}, offset: {maximum: 1024}}}
    severity: warning
    score: 5.2
    message: "<meta charset> should declare UTF-8 within the first 1024 bytes, found {got}"
    docs: https://html.spec.whatwg.org/multipage/semantics.html#charset
    fix: "Add <meta charset=utf-8> as the first element of <head>."
  html/privacy-policy:
    fact: html.rels.privacy-policy
    expect: {type: array, minItems: 1}
    severity: info
    score: 1.6
    message: "no link with rel=privacy-policy"
    docs: https://html.spec.whatwg.org/multipage/links.html#link-type-privacy-policy
    fix: "Add <link rel=privacy-policy href=/privacy> to the head."
  html/favicon:
    fact: html.head.links
    expect: {contains: {required: [rel], properties: {rel: {pattern: "(?i:(^|\\s)icon(\\s|$))"}}}}
    severity: info
    score: 2.2
    message: "no <link rel=icon> in the head"
    docs: https://developer.mozilla.org/docs/Web/HTML/Attributes/rel#icon
    fix: "Add <link rel=icon href=/favicon.ico> to the head."
  html/hreflang-x-default:
    fact: html.hreflang
    expect: {contains: {required: [lang], properties: {lang: {const: x-default}}}}
    when: {html.hreflang: {minItems: 1}}
    severity: info
    score: 2.6
    message: "hreflang alternates should include x-default, found {got}"
    docs: https://developers.google.com/search/docs/specialty/international/localized-versions#xdefault
    fix: "Add <link rel=alternate hreflang=x-default> to the head."
  html/jsonld-parses:
    fact: html.jsonld
    expect: {items: {not: {required: ["@error"]}}}
    severity: warning
    score: 4.5
    message: "a JSON-LD block does not parse: {got}"
    docs: https://json-ld.org/spec/latest/json-ld/
    fix: "Fix the JSON-LD block so it is valid JSON."
  url/shape:
    fact: url.pathname
    expect: {type: string, pattern: "^(?!.*//)(%[0-9A-Fa-f]{2}|[^A-Z_%])*$"}
    severity: info
    score: 2.8
    message: "URL path should be lowercase, with hyphens and no empty segment, found {got}"
    docs: https://developers.google.com/search/docs/crawling-indexing/url-structure
    fix: "Rewrite the path to be lowercase, with hyphens and no empty segments."
  html/title:
    fact: html.title
    expect: {type: string}
    severity: error
    score: 7.8
    message: "no <title>"
    docs: https://developers.google.com/search/docs/appearance/title-link
    fix: "Add a <title> to the head."
  html/description:
    fact: html.meta.description
    expect: {type: string}
    severity: warning
    score: 6.0
    message: "no meta description"
    docs: https://developers.google.com/search/docs/appearance/snippet
    fix: "Add <meta name=description> with a summary to the head."
  html/title-length:
    when: {html.title: {type: string}}
    fact: html.title
    expect: {type: string, minLength: 30, maxLength: 60}
    severity: warning
    score: 5.7
    message: "<title> should be 30–60 characters, found {got}"
    docs: https://developers.google.com/search/docs/appearance/title-link
    fix: "Shorten or lengthen <title> to 30–60 characters."
  html/description-length:
    when: {html.meta.description: {type: string}}
    fact: html.meta.description
    expect: {type: string, minLength: 50, maxLength: 160}
    severity: warning
    score: 5.5
    message: "meta description should be 50–160 characters, found {got}"
    docs: https://developers.google.com/search/docs/appearance/snippet
    fix: "Shorten or lengthen the meta description to 50–160 characters."
  html/title-redundant:
    when: {html.title: {type: string}}
    fact: html.title
    expect: {type: string, pattern: "^(?!.*(.{2,120}?)\\s*[-|:–—·»]\\s*\\1$).*$"}
    severity: warning
    score: 4.8
    message: "<title> repeats itself around a separator: {got}"
    docs: https://developers.google.com/search/docs/appearance/title-link
    fix: "Remove the repeated suffix from <title>."
  html/description-redundant:
    when: {html.meta.description: {type: string}}
    fact: html.meta.description
    expect: {type: string, pattern: "^(?!.*(.{2,120}?)\\s*[-|:–—·»]\\s*\\1$).*$"}
    severity: warning
    score: 4.7
    message: "meta description repeats itself around a separator: {got}"
    docs: https://developers.google.com/search/docs/appearance/snippet
    fix: "Remove the repeated suffix from the meta description."
  html/one-h1:
    fact: html.h1
    expect: {type: array, minItems: 1, maxItems: 1}
    severity: error
    score: 7.4
    message: "should have exactly one <h1>, found {got}"
    docs: https://developer.mozilla.org/docs/Web/HTML/Reference/Elements/Heading_Elements
    fix: "Use exactly one <h1> per page."
  html/canonical:
    fact: html.canonical
    expect: {type: string, pattern: "^https?://"}
    severity: warning
    score: 5.4
    message: "canonical link should be an absolute URL, found {got}"
    docs: https://developers.google.com/search/docs/crawling-indexing/consolidate-duplicate-urls
    fix: "Make the canonical link an absolute URL."
  html/canonical-self:
    severity: warning
    score: 6.4
  html/og-url-self:
    severity: info
    score: 2.4
  html/img-alt:
    fact: html.images
    expect: {type: array, items: {required: [alt]}}
    severity: warning
    score: 5.0
    message: "an <img> has no alt attribute: {got}"
    docs: https://developers.google.com/search/docs/appearance/google-images
    fix: "Add an alt attribute to every <img>."
  html/og-title:
    fact: html.property.og:title
    expect: {type: string, minLength: 10, maxLength: 90}
    severity: warning
    score: 4.0
    message: "og:title should be 10–90 characters, found {got}"
    docs: https://ogp.me/#metadata
    fix: "Set og:title to 10–90 characters."
  html/og-description:
    fact: html.property.og:description
    expect: {type: string, minLength: 50, maxLength: 200}
    severity: warning
    score: 3.9
    message: "og:description should be 50–200 characters, found {got}"
    docs: https://ogp.me/#optional
    fix: "Set og:description to 50–200 characters."
  html/og-image:
    fact: html.property.og:image
    expect: {type: string, format: uri, pattern: "^(?i:https?)://"}
    severity: warning
    score: 4.6
    message: "og:image should be an absolute http(s) URL, found {got}"
    docs: https://ogp.me/#metadata
    fix: "Make og:image an absolute URL."
  html/og-type:
    fact: html.property.og:type
    expect: {type: string, pattern: "^(?:website|article|book|profile|music\\.(?:song|album|playlist|radio_station)|video\\.(?:movie|episode|tv_show|other)|[a-z][\\w-]*:[\\w.-]+)$"}
    severity: info
    score: 1.1
    message: "og:type should be an Open Graph type or namespace:type, found {got}"
    docs: https://ogp.me/#types
    fix: "Set og:type to website, or article on a post."
  html/og-url:
    fact: html.property.og:url
    expect: {type: string, format: uri, pattern: "^(?i:https?)://"}
    severity: info
    score: 2.5
    message: "og:url should be an absolute http(s) URL, found {got}"
    docs: https://ogp.me/#metadata
    fix: "Make og:url an absolute URL of this page."
  html/author:
    fact: html.author
    expect: {type: string, minLength: 1}
    when: {html.property.og:type: article}
    severity: warning
    score: 3.7
    message: "an article names no author for its link preview"
    fix: "Add <meta name=author>, article:author, or a JSON-LD author to the article head."
    docs: https://github.com/mastodon/mastodon/blob/423d0ca875fccbcd02ed4201999cec1625dee9e6/app/lib/link_details_extractor.rb#L195-L197
  html/published-date:
    fact: html.published
    expect: {type: string, minLength: 1}
    when: {html.property.og:type: article}
    severity: warning
    score: 3.6
    message: "an article gives no publication date for its link preview"
    fix: "Add <meta property=article:published_time> or a JSON-LD datePublished in ISO 8601."
    docs: https://ogp.me/#type_article
  html/unique-title:
    unique: html.title
    scope: site
    severity: warning
    score: 5.9
    message: "pages share one <title>: {got}"
    docs: https://developers.google.com/search/docs/appearance/title-link
    fix: "Give each page a distinct <title>."
  html/unique-description:
    unique: html.meta.description
    scope: site
    severity: warning
    score: 5.6
    message: "pages share one meta description: {got}"
    docs: https://developers.google.com/search/docs/appearance/snippet
    fix: "Give each page a distinct meta description."
  html/unique-og-title:
    unique: html.property.og:title
    scope: site
    severity: warning
    score: 4.2
    message: "pages share one og:title: {got}"
    docs: https://ogp.me/#metadata
    fix: "Give each page a distinct og:title."
  html/unique-og-description:
    unique: html.property.og:description
    scope: site
    severity: warning
    score: 4.1
    message: "pages share one og:description: {got}"
    docs: https://ogp.me/#optional
    fix: "Give each page a distinct og:description."
  html/noindex-twin:
    fact: robots.noindex
    expect: {const: true}
    when: {url.twin: {type: string}}
    severity: info
    score: 3.0
    message: "a page served off the canonical origin is indexable; mark the staging twin noindex"
    fix: "Send X-Robots-Tag: noindex from every origin other than the canonical one."
    docs: https://developers.google.com/search/docs/crawling-indexing/block-indexing
  html/noindex-staging:
    fact: robots.noindex
    expect: {const: true}
    when: {site.role: {enum: [development, staging]}, url.twin: {not: {type: string}}}
    severity: warning
    score: 6.2
    message: "a page of a staging or development site is indexable"
    fix: "Send X-Robots-Tag: noindex from every non-production host."
    docs: https://developers.google.com/search/docs/crawling-indexing/block-indexing
  http/tdm-reservation:
    fact: http.headers.tdm-reservation
    expect: {type: string, pattern: "^\\s*[01]\\s*$"}
    when: {http.headers.tdm-reservation: {type: string}}
    severity: warning
    score: 3.5
    message: "tdm-reservation should be 0 or 1, found {got}"
    fix: "Send tdm-reservation: 1 to reserve text and data mining rights, 0 to waive them."
    docs: https://www.w3.org/community/reports/tdmrep/CG-FINAL-tdmrep-20240510/
  html/tdm-reservation:
    fact: html.meta.tdm-reservation
    expect: {type: string, pattern: "^\\s*[01]\\s*$"}
    when: {html.meta.tdm-reservation: {type: string}}
    severity: warning
    score: 3.5
    message: "<meta name=tdm-reservation> should be 0 or 1, found {got}"
    fix: "Set <meta name=tdm-reservation content=1> to reserve text and data mining rights, 0 to waive them."
    docs: https://www.w3.org/community/reports/tdmrep/CG-FINAL-tdmrep-20240510/
  url/length:
    fact: url.href
    expect: {type: string, maxLength: 100}
    severity: info
    score: 1.8
    message: "the URL is longer than 100 characters: {got}"
    fix: "Shorten the path to the few words that name the page."
    docs: https://developers.google.com/search/docs/crawling-indexing/url-structure
  url/uppercase:
    fact: url.pathname
    expect: {type: string, not: {pattern: "(?<!%)(?<!%[0-9A-Fa-f])[A-Z]"}}
    severity: warning
    score: 5.1
    message: "the path has uppercase letters, which a server may treat as another URL: {got}"
    fix: "Use lowercase paths, and redirect each mixed-case path to its lowercase form."
    docs: https://developers.google.com/search/docs/crawling-indexing/url-structure
  url/session-param:
    fact: url.href
    expect: {type: string, not: {pattern: "(?i:[?&;](sid|sessionid|jsessionid|phpsessid)=)"}}
    severity: warning
    score: 5.8
    message: "the URL carries a session ID: {got}"
    fix: "Keep the session in a cookie, never in the URL."
    docs: https://developers.google.com/search/docs/crawling-indexing/url-structure
  url/double-slash:
    fact: url.pathname
    expect: {type: string, not: {pattern: "//"}}
    severity: warning
    score: 4.9
    message: "the path has an empty segment: {got}"
    fix: "Remove the doubled slash from the links, and redirect the doubled path to the single one."
    docs: https://developers.google.com/search/docs/crawling-indexing/url-structure
  url/extension:
    fact: url.pathname
    expect: {type: string, not: {pattern: "(?i:\\.(php|aspx?|jsp|cgi|html?)$)"}}
    severity: hint
    score: 0.6
    message: "the path exposes the server technology in its extension: {got}"
    fix: "Serve the page at an extensionless path, and redirect the old one to it."
    docs: https://www.w3.org/Provider/Style/URI
  url/readable-slug: info
  url/separators:
    severity: warning
    score: 4.4
  url/trailing-slash:
    severity: warning
    score: 4.3
