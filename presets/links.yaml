---
description: Links that answer an error, internal links that redirect or carry nofollow, rel=me profiles that do not link back
rules:
  links/internal/unreachable:
    severity: error
    score: [[0, 8.4], [404, 7.4], [500, 8.4]]
  links/internal/redirected:
    severity: warning
    score: 4.6
  links/external/unreachable:
    severity: warning
    score: [[0, 6.0], [404, 4.6], [500, 6.0]]
  links/internal-nofollow/present:
    severity: warning
    score: 4.2
  links/external-rel/missing: off
  links/rel-me-backlink/missing:
    severity: info
    score: 2.2
