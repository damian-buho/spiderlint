---
description: Certificate validity, protocol version and expiry
when:
  url.protocol: "https:"
rules:
  tls/authorized:
    fact: tls.authorized
    expect: {const: true}
    severity: error
    message: "certificate is not trusted"
    fix: "Install the CA bundle the server needs, or request a certificate from a trusted CA."
    docs: https://developer.mozilla.org/docs/Web/Security/Transport_Layer_Security
  tls/protocol:
    fact: tls.protocol
    expect: {enum: [TLSv1.2, TLSv1.3]}
    severity: warning
    message: "TLS should be 1.2 or 1.3, found {got}"
    fix: "Disable TLS 1.0 and 1.1 in the server configuration; keep only TLS 1.2 and 1.3."
    docs: https://developer.mozilla.org/docs/Web/Security/Transport_Layer_Security
  tls/cert-expiry:
    fact: tls.cert.days-left
    expect: {type: integer, minimum: 14}
    when: {tls.cert.days-left: {minimum: 2}}
    severity: info
    message: "certificate expires within 14 days ({got} left)"
    fix: "check that certificate renewal is scheduled and has succeeded before"
    docs: https://developer.mozilla.org/docs/Web/Security/Transport_Layer_Security
  tls/cert-expiring:
    fact: tls.cert.days-left
    expect: {type: integer, minimum: 2}
    when: {tls.cert.days-left: {minimum: 0}}
    severity: warning
    message: "certificate expires within 2 days ({got} left)"
    fix: "renew the certificate now and find out why automatic renewal did not run"
    docs: https://developer.mozilla.org/docs/Web/Security/Transport_Layer_Security
  tls/cert-expired:
    fact: tls.cert.days-left
    expect: {type: integer, minimum: 0}
    severity: error
    message: "certificate has expired ({got} days left)"
    fix: "renew the certificate and reload the server that serves it"
    docs: https://developer.mozilla.org/docs/Web/Security/Transport_Layer_Security
