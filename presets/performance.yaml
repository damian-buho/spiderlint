---
description: Compression, caching, validators, protocol version and render-blocking HTML, no browser needed
rules:
  http/compression:
    fact: http.headers.content-encoding
    expect: {type: string, pattern: "^\\s*(br|gzip|zstd)\\s*$"}
    when:
      http.status: {minimum: 200, maximum: 299}
      http.contentType: {pattern: "^(text/|application/([\\w.-]+\\+)?(json|xml|javascript)\\b|image/svg\\+xml)"}
      http.size.decoded: {minimum: 1024}
    severity: warning
    message: "a text response over 1 KB should be sent br, gzip or zstd, found {got}"
    docs: https://developer.mozilla.org/docs/Web/HTTP/Compression
  http/vary-encoding:
    fact: http.headers.vary
    expect: {type: string, pattern: "(?i:accept-encoding)|^\\s*\\*\\s*$"}
    when: {http.headers.content-encoding: {type: string}}
    severity: warning
    message: "a compressed response should carry Vary: Accept-Encoding, found {got}"
    docs: https://developer.mozilla.org/docs/Web/HTTP/Headers/Vary
  http/vary-star:
    fact: http.headers.vary
    expect: {type: string, not: {pattern: "^\\s*\\*\\s*$"}}
    when: {http.headers.vary: {type: string}}
    severity: warning
    message: "Vary: * makes the response uncacheable, found {got}"
    docs: https://developer.mozilla.org/docs/Web/HTTP/Headers/Vary
  http/validator:
    fact: http.headers
    expect: {anyOf: [{required: [etag]}, {required: [last-modified]}]}
    when: {http.status: {minimum: 200, maximum: 299}}
    severity: info
    message: "no ETag or Last-Modified to revalidate against"
    docs: https://developer.mozilla.org/docs/Web/HTTP/Caching#validation
  http/html-cache-control:
    fact: http.headers.cache-control
    expect: {type: string, minLength: 1}
    when: {http.status: {minimum: 200, maximum: 299}, http.contentType: {pattern: "^text/html"}}
    severity: info
    message: "no Cache-Control header on an HTML page"
    docs: https://developer.mozilla.org/docs/Web/HTTP/Headers/Cache-Control
  http/no-store-bfcache:
    fact: http.headers.cache-control
    expect: {type: string, not: {pattern: "(?i:no-store)"}}
    when: {http.contentType: {pattern: "^text/html"}, http.headers.cache-control: {type: string}}
    severity: info
    message: "Cache-Control no-store keeps the page out of the back/forward cache, found {got}"
    docs: https://web.dev/articles/bfcache#minimize-use-of-cache-control-no-store
  http/version:
    fact: http.version
    expect: {type: string, pattern: "^[23]"}
    when: {http.version: {type: string}}
    severity: warning
    message: "the server should speak HTTP/2 or HTTP/3, found {got}"
    docs: https://developer.mozilla.org/docs/Glossary/HTTP_2
  http/alt-svc-h3:
    fact: http.headers.alt-svc
    expect: {type: string, pattern: "\\bh3="}
    when: {url.protocol: "https:"}
    severity: info
    message: "Alt-Svc should advertise h3, found {got}"
    docs: https://developer.mozilla.org/docs/Web/HTTP/Headers/Alt-Svc
  http/retry-after:
    fact: http.headers.retry-after
    expect: {type: string, minLength: 1}
    when: {http.status: 503}
    severity: warning
    message: "a 503 should say when to retry with Retry-After"
    docs: https://developer.mozilla.org/docs/Web/HTTP/Headers/Retry-After
  http/sunset-format:
    fact: http.headers.sunset
    expect: {type: string, pattern: "^(Mon|Tue|Wed|Thu|Fri|Sat|Sun), \\d{2} (Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) \\d{4} \\d{2}:\\d{2}:\\d{2} GMT$"}
    when: {http.headers.sunset: {type: string}}
    severity: warning
    message: "Sunset should be an HTTP-date, found {got}"
    docs: https://www.rfc-editor.org/rfc/rfc8594
  http/deprecation-format:
    fact: http.headers.deprecation
    expect: {type: string, pattern: "^@-?\\d+$"}
    when: {http.headers.deprecation: {type: string}}
    severity: warning
    message: "Deprecation should be @ and Unix seconds, found {got}"
    docs: https://www.rfc-editor.org/rfc/rfc9745
  html/render-blocking-script:
    fact: html.scripts
    expect: {items: {if: {required: [src], properties: {head: {const: true}, async: {const: false}, defer: {const: false}}}, then: {required: [type], properties: {type: {const: module}}}}}
    severity: info
    message: "a script in <head> without async, defer or type=module blocks rendering: {got}"
    docs: https://developer.mozilla.org/docs/Web/HTML/Element/script#defer
  html/img-dimensions:
    fact: html.images
    expect: {items: {required: [width, height]}}
    severity: info
    message: "an <img> without width and height shifts the layout as it loads: {got}"
    docs: https://web.dev/articles/optimize-cls#images-without-dimensions
