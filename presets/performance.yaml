---
description: Compression, caching, validators, protocol version and render-blocking HTML, no browser needed
rules:
  http/compression:
    fact: http.headers.content-encoding
    expect: {type: string, pattern: "^\\s*(br|gzip|zstd)\\s*$"}
    when:
      http.status: {minimum: 200, maximum: 299}
      http.content-type: {pattern: "^(text/|application/([\\w.-]+\\+)?(json|xml|javascript)\\b|image/svg\\+xml)"}
      http.size.decoded: {minimum: 1024}
    severity: warning
    score: 6.3
    message: "a text response over 1 KB should be sent br, zstd or gzip, found {got}"
    fix: "Compress text responses with br, zstd or gzip at the edge or in the server."
    docs: https://developer.mozilla.org/docs/Web/HTTP/Compression
  http/vary-encoding:
    fact: http.parsed.vary.value
    expect: {type: array, contains: {enum: [accept-encoding, "*"]}}
    when: {http.headers.content-encoding: {type: string}, http.parsed.vary.errors: {maxItems: 0}}
    severity: warning
    score: 5.4
    message: "a compressed response should carry Vary: Accept-Encoding, found {got}"
    fix: "Add Vary: Accept-Encoding to the response."
    docs: https://developer.mozilla.org/docs/Web/HTTP/Headers/Vary
  http/vary-star:
    fact: http.parsed.vary.value
    expect: {not: {contains: {const: "*"}}}
    when: {http.parsed.vary.value: {type: array}}
    severity: warning
    score: 5.6
    message: "Vary: * makes the response uncacheable, found {got}"
    fix: "Replace Vary: * with the specific header names the response varies by."
    docs: https://developer.mozilla.org/docs/Web/HTTP/Headers/Vary
  http/validator:
    fact: http.headers
    expect: {anyOf: [{required: [etag]}, {required: [last-modified]}]}
    when: {http.status: {minimum: 200, maximum: 299}}
    severity: info
    score: 2.6
    message: "no ETag or Last-Modified to revalidate against"
    fix: "Add an ETag or Last-Modified header to the response."
    docs: https://developer.mozilla.org/docs/Web/HTTP/Caching#validation
  http/html-cache-control:
    fact: http.parsed.cache-control.value
    expect: {type: object, minProperties: 1}
    when: {http.status: {minimum: 200, maximum: 299}, http.content-type: {pattern: "^text/html"}, http.parsed.cache-control.errors: {maxItems: 0}}
    severity: info
    score: 2.7
    message: "no Cache-Control directive on an HTML page, found {got}"
    fix: "Add a Cache-Control header, e.g. no-cache to revalidate, or public with a max-age."
    docs: https://developer.mozilla.org/docs/Web/HTTP/Headers/Cache-Control
  http/no-store-bfcache:
    fact: http.parsed.cache-control.value
    expect: {not: {required: [no-store]}}
    when: {http.content-type: {pattern: "^text/html"}, http.parsed.cache-control.value: {type: object}}
    severity: info
    score: 2.4
    message: "Cache-Control no-store keeps the page out of the back/forward cache, found {got}"
    fix: "Remove no-store from Cache-Control, or replace it with no-cache."
    docs: https://web.dev/articles/bfcache#minimize-use-of-cache-control-no-store
  caching/long-without-hash:
    severity: warning
  http/version:
    fact: http.version
    expect: {type: string, pattern: "^[23]"}
    when: {http.version: {type: string}}
    severity: warning
    score: 5.8
    message: "the server should speak HTTP/2 or HTTP/3, found {got}"
    fix: "Enable HTTP/2 or HTTP/3 on the server."
    docs: https://developer.mozilla.org/docs/Glossary/HTTP_2
  http/alt-svc-h3:
    fact: http.parsed.alt-svc.value
    expect: {type: array, contains: {properties: {protocol: {const: h3}}, required: [protocol]}}
    when: {url.protocol: "https:", http.version: {not: {const: "3.0"}}, http.parsed.alt-svc.errors: {maxItems: 0}}
    severity: warning
    score: 5.2
    message: "Alt-Svc should advertise h3, found {got}"
    fix: "Add h3 to the Alt-Svc header."
    docs: https://developer.mozilla.org/docs/Web/HTTP/Headers/Alt-Svc
  tls/ec-key:
    fact: tls.cert.key.type
    expect: {not: {const: RSA}}
    when: {url.protocol: "https:", tls.cert.key: {type: object}}
    severity: hint
    score: 0.6
    message: "the certificate carries an RSA key, where an EC key makes a smaller handshake"
    fix: "Issue the certificate for an EC P-256 key."
    docs: https://www.rfc-editor.org/rfc/rfc9325#section-4.5
  http/retry-after:
    fact: http.parsed.retry-after.value
    expect: {type: object}
    when: {http.status: 503, http.parsed.retry-after.errors: {maxItems: 0}}
    severity: warning
    score: 4.8
    message: "a 503 should say when to retry with Retry-After"
    fix: "Send Retry-After with a delay, or an HTTP-date for when to try again."
    docs: https://developer.mozilla.org/docs/Web/HTTP/Headers/Retry-After
  http/sunset-format:
    fact: http.headers.sunset
    expect: {type: string, pattern: "^(Mon|Tue|Wed|Thu|Fri|Sat|Sun), \\d{2} (Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) \\d{4} \\d{2}:\\d{2}:\\d{2} GMT$"}
    when: {http.headers.sunset: {type: string}}
    severity: warning
    score: 3.7
    message: "Sunset should be an HTTP-date, found {got}"
    fix: "Send Sunset as an HTTP-date, e.g. Sun, 01 Jan 2027 00:00:00 GMT."
    docs: https://www.rfc-editor.org/rfc/rfc8594
  http/deprecation-format:
    fact: http.headers.deprecation
    expect: {type: string, pattern: "^@-?\\d+$"}
    when: {http.headers.deprecation: {type: string}}
    severity: warning
    score: 3.6
    message: "Deprecation should be @ and Unix seconds, found {got}"
    fix: "Send Deprecation: @1704067200 with the Unix timestamp of the removal."
    docs: https://www.rfc-editor.org/rfc/rfc9745
  html/render-blocking-script:
    fact: html.scripts
    expect: {items: {if: {required: [src], properties: {head: {const: true}, async: {const: false}, defer: {const: false}}}, then: {required: [type], properties: {type: {const: module}}}}}
    severity: info
    score: 3.0
    message: "a script in <head> without async, defer or type=module blocks rendering: {got}"
    fix: "Add async, defer, or type=module to the script, or move it to the end of <body>."
    docs: https://developer.mozilla.org/docs/Web/HTML/Element/script#defer
  html/first-img-lazy:
    fact: html.images.0
    expect: {not: {type: object, required: [loading], properties: {loading: {pattern: "^(?i:lazy)$"}}}}
    severity: info
    score: 2.9
    message: "the first <img> is usually above the fold, and loading=lazy delays it: {got}"
    fix: "Remove loading=lazy from the first <img>, or set it to eager."
    docs: https://web.dev/articles/lcp-lazy-loading
  html/img-dimensions:
    fact: html.images
    expect: {items: {if: {not: {required: [noscript]}}, then: {required: [width, height]}}}
    severity: warning
    score: 6.0
    message: "an <img> without width and height shifts the layout as it loads: {got}"
    fix: "Add width and height attributes to the <img>."
    docs: https://web.dev/articles/optimize-cls#images-without-dimensions
  http/early-hints-preload:
    severity: info
    score: 1.8
  html/preconnect-unused:
    severity: info
    score: 1.4
  html/preconnect-missing:
    severity: info
    score: 2.2
  html/preconnect-crossorigin:
    severity: info
    score: 1.6
  http/link-syntax:
    fact: http.parsed.link.errors
    expect: {maxItems: 0}
    when: {http.parsed.link: {type: object}}
    severity: warning
    score: 4.6
    message: "Link breaks RFC 8288 §3, so clients drop the links they cannot read: {got}"
    fix: "Write each Link entry as <https://example.com/a>; rel=preload, separated by commas."
    docs: https://www.rfc-editor.org/rfc/rfc8288#section-3
  http/dictionary-format:
    fact: http.parsed.use-as-dictionary.value
    expect: {required: [match], properties: {match: {type: string}}}
    when: {http.parsed.use-as-dictionary.value: {type: object}}
    severity: warning
    score: 3.5
    message: "Use-As-Dictionary needs a match=\"<URL pattern>\" member, found {got}"
    fix: "Send Use-As-Dictionary: match=\"/assets/app-*.js\"."
    docs: https://www.rfc-editor.org/rfc/rfc9842#section-2.1
  html/render-blocking-css:
    fact: html.head.links
    expect: {minContains: 0, maxContains: 1, contains: {required: [rel], properties: {rel: {pattern: "^\\s*(?i:stylesheet)\\s*$"}, media: {pattern: "^\\s*(?i:all|screen)?\\s*$"}}}}
    severity: info
    score: 2.3
    message: "more than one stylesheet in <head> blocks rendering: {got}"
    fix: "Inline the critical CSS and load the rest with media=print onload, or merge the stylesheets into one."
    docs: https://web.dev/articles/defer-non-critical-css
  http/cache-control-syntax:
    fact: http.parsed.cache-control.errors
    expect: {maxItems: 0}
    when: {http.parsed.cache-control: {type: object}}
    severity: warning
    score: 5.0
    message: "Cache-Control breaks RFC 9111 §5.2, and caches ignore what they cannot read: {got}"
    fix: "Write Cache-Control with registered directives only, as in public, max-age=3600."
    docs: https://www.rfc-editor.org/rfc/rfc9111#section-5.2
  http/vary-syntax:
    fact: http.parsed.vary.errors
    expect: {maxItems: 0}
    when: {http.parsed.vary: {type: object}}
    severity: warning
    score: 4.2
    message: "Vary breaks RFC 9110 §12.5.5: {got}"
    fix: "List the request header names the response varies by, as in Vary: Accept-Encoding."
    docs: https://www.rfc-editor.org/rfc/rfc9110#section-12.5.5
  http/content-type-syntax:
    fact: http.parsed.content-type.errors
    expect: {maxItems: 0}
    when: {http.parsed.content-type: {type: object}}
    severity: warning
    score: 4.0
    message: "Content-Type breaks RFC 9110 §8.3.1: {got}"
    fix: "Send Content-Type as type/subtype with name=value parameters, as in text/html; charset=utf-8."
    docs: https://www.rfc-editor.org/rfc/rfc9110#section-8.3.1
  http/use-as-dictionary-syntax:
    fact: http.parsed.use-as-dictionary.errors
    expect: {maxItems: 0}
    when: {http.parsed.use-as-dictionary: {type: object}}
    severity: warning
    score: 3.4
    message: "Use-As-Dictionary breaks its structured-field grammar, so clients ignore it: {got}"
    fix: "Send Use-As-Dictionary: match=\"/assets/app-*.js\"."
    docs: https://www.rfc-editor.org/rfc/rfc9842#section-2.1
  http/accept-ch-syntax:
    fact: http.parsed.accept-ch.errors
    expect: {maxItems: 0}
    when: {http.parsed.accept-ch: {type: object}}
    severity: warning
    score: 3.9
    message: "Accept-CH breaks its structured-field grammar, so browsers ignore it: {got}"
    fix: "Send Accept-CH as a list of hint names, as in Accept-CH: Sec-CH-UA-Platform."
    docs: https://www.rfc-editor.org/rfc/rfc8942#section-3.1
  http/priority-syntax:
    fact: http.parsed.priority.errors
    expect: {maxItems: 0}
    when: {http.parsed.priority: {type: object}}
    severity: warning
    score: 3.8
    message: "Priority breaks its structured-field grammar, so clients ignore it: {got}"
    fix: "Send Priority as a dictionary, as in Priority: u=1, i."
    docs: https://www.rfc-editor.org/rfc/rfc9218#section-5
  http/cache-status-syntax:
    fact: http.parsed.cache-status.errors
    expect: {maxItems: 0}
    when: {http.parsed.cache-status: {type: object}}
    severity: warning
    score: 3.3
    message: "Cache-Status breaks its structured-field grammar: {got}"
    fix: "Send Cache-Status as a list of caches with parameters, as in Cache-Status: ExampleCache; hit."
    docs: https://www.rfc-editor.org/rfc/rfc9211#section-2
  http/retry-after-short:
    fact: http.parsed.retry-after.value.seconds
    expect: {minimum: 10}
    when: {http.status: {enum: [429, 503]}, http.parsed.retry-after.value: {type: object}}
    severity: info
    score: [[0, 3.0], [9, 1.2]]
    message: "Retry-After asks clients back in {got} seconds, which brings the load straight back to a server that is shedding it"
    fix: "Send Retry-After: 120, or as long as the server needs to recover."
    docs: https://www.rfc-editor.org/rfc/rfc9110#section-10.2.3
  http/retry-after-syntax:
    fact: http.parsed.retry-after.errors
    expect: {maxItems: 0}
    when: {http.parsed.retry-after: {type: object}}
    severity: warning
    score: 4.1
    message: "Retry-After breaks RFC 9110 §10.2.3, so clients cannot tell when to retry: {got}"
    fix: "Send Retry-After as a number of seconds, as in Retry-After: 120, or an IMF-fixdate."
    docs: https://www.rfc-editor.org/rfc/rfc9110#section-10.2.3
  http/alt-svc-syntax:
    fact: http.parsed.alt-svc.errors
    expect: {maxItems: 0}
    when: {http.parsed.alt-svc: {type: object}}
    severity: warning
    score: 4.4
    message: "Alt-Svc breaks RFC 7838 §3, so clients never try the alternative: {got}"
    fix: "Send Alt-Svc as h3=\":443\"; ma=86400."
    docs: https://www.rfc-editor.org/rfc/rfc7838#section-3
