---
description: Checks that need a rendered page — console errors and unused preloads
extends:
  - spiderlint:cookies:browser
when:
  http.status: {minimum: 200, maximum: 299}
rules:
  browser/console-errors:
    fact: browser.console.errors
    expect: {maxItems: 0}
    severity: warning
    score: 5.8
    message: "the browser console logged errors ({got})"
    docs: https://developer.mozilla.org/docs/Web/API/console/error_static
    fix: "Fix the JavaScript error logged to the console."
  browser/unused-preload:
    fact: browser.console.warnings
    expect: {not: {contains: {type: string, pattern: "preloaded using link preload but not used"}}}
    severity: info
    score: 1.8
    message: "a preloaded resource went unused ({got})"
    docs: https://developer.mozilla.org/docs/Web/HTML/Attributes/rel/preload
    fix: "Remove the preload link, or use the resource it points at."
