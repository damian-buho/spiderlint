---
description: What a site discloses about its footprint in carbon.txt, and what a view of each page emits
extends: [spiderlint:carbon-txt]
rules:
  green/page-co2/excessive:
    fact: co2.grams
    expect: {maximum: 0.209}
    when: {http.status: {minimum: 200, maximum: 299}}
    severity: info
    score: [[0.209, 1.4], [1.0, 2.6], [3.0, 3.2]]
    message: "one view emits too much CO2e by the Sustainable Web Design model, above the 0.209 g budget (rating C)"
    title: "One page view emits more CO2e than the 0.209 g budget"
    rationale: "At this size the page’s transfer carries a higher carbon cost for every visitor, and it loads more slowly on poor connections. The estimate follows the Sustainable Web Design model; only pages that answer 2xx are checked."
    fix: "Cut the page’s transfer size: compress and resize images, drop unused scripts and fonts."
    docs: https://developers.thegreenwebfoundation.org/co2js/explainer/methodologies-for-calculating-website-carbon/
