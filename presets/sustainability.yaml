---
description: What a site discloses about its footprint in carbon.txt, and what a view of each page emits
extends: [spiderlint:carbon-txt]
rules:
  green/page-weight-co2:
    fact: co2.grams
    expect: {maximum: 0.209}
    when: {http.status: {minimum: 200, maximum: 299}}
    severity: info
    message: "one view emits {got} g CO2e by the Sustainable Web Design model, above the 0.209 g budget (rating C)"
    fix: "Cut the page’s transfer size: compress and resize images, drop unused scripts and fonts."
    docs: https://developers.thegreenwebfoundation.org/co2js/explainer/methodologies-for-calculating-website-carbon/
