---
description: robots.txt shutting every crawler out, the AI crawlers it names, its Content Signals, crawler access and noai pages against them
rules:
  robots/root/blocked: {severity: warning, score: 6.3, when: {site.role: production}}
  robots/ai-crawlers/present:
    severity: info
    score: 1.6
  robots/content-signal/invalid:
    severity: warning
    score: 3.6
  robots/crawler-access/mismatch:
    severity: warning
    score: 4.4
  html/noai/present:
    fact: robots.noai
    expect: {const: false}
    when: {site.content-signals.ai-train: "yes"}
    severity: warning
    score: 3.4
    message: "a page says noai or noimageai while the content signals allow AI training"
    title: "A page says noai while the content signals allow AI training"
    rationale: "The site declares in its content signals that AI training is allowed, yet a page tells crawlers noai or noimageai. The mixed message leaves AI crawlers and the site owner’s intent in conflict. Only sites that declare ai-train as yes are checked."
    fix: "Remove noai and noimageai from <meta name=robots> and X-Robots-Tag, or declare ai-train as no."
    docs: https://contentsignals.org/
