            score: "9.5"
            scope: page
            rulesets:
              - tls
            references:
              - https://developer.mozilla.org/docs/Web/Security/Transport_Layer_Security
            rationale: Los navegadores muestran una advertencia a pantalla completa o bloquean la conexión, así que la mayoría de los visitantes se marcha y no puede estar seguro de llegar al sitio real. Solo en páginas HTTPS.
