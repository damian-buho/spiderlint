            score: "6.9"
            scope: page
            rulesets:
              - html-validate
              - html-validate:a11y
              - html-validate:standard
            references:
              - https://html-validate.org/rules/aria-label-misuse.html
          - id: html-validate/attr-case
            title: Attribute name must be in lowercase.
            severity: error
            score: "6.6"
            scope: page
            rulesets:
              - html-validate
            references:
              - https://html-validate.org/rules/attr-case.html
          - id: html-validate/attr-delimiter
            title: Attribute value must not be separated by whitespace.
            severity: error
            score: "6.6"
            scope: page
            rulesets:
              - html-validate
            references:
