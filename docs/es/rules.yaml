            rationale: Un protocolo, conjunto o extensión negociado expone la conexión a un ataque conocido, de modo que un atacante puede recuperar secretos como las cookies de sesión. Se omite detrás de Cloudflare.
            message: lo que el servidor negocia lo deja expuesto a {got}
          - id: tls/certificate/expired
