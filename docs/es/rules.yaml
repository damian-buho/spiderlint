            rationale: Los conjuntos NULL, RC4, 3DES y similares ofrecen poca o ninguna protección, así que un atacante en la ruta puede leer o alterar el tráfico. Se omite detrás de Cloudflare.
            message: "el servidor acepta suites rotas de plano: {got}"
          - id: tls-probe/cipher/weak
            title: El servidor acepta conjuntos de cifrado débiles
