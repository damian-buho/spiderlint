            rationale: El correo hacia un servidor sin STARTTLS viaja en texto plano, así que cualquiera en la ruta puede leerlo. Solo se comprueba cuando la comprobación STARTTLS está activada.
            message: un intercambiador no ofrece STARTTLS en el puerto 25, así que el correo hacia él viaja en claro ({got})
          - id: mail/tls-rpt/invalid
            title: El registro TLS-RPT incumple la sintaxis de TLS-RPT
            severity: warning
