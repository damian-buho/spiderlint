            severity: warning
            score: "6.0"
            scope: page
            rulesets:
              - markup
            references:
              - https://www.w3.org/WAI/media/av/captions/
            rationale: Las personas sordas o con dificultades auditivas, y cualquiera que vea el vídeo sin sonido, no pueden seguir el habla de un vídeo sin pista de texto. Los vídeos sin sonido y sin controles están exentos.
          - id: markup/input-type/mismatch
            title: El tipo de un campo no coincide con su campo de autocompletado
            severity: warning
            score: "4.4"
            scope: page
            rulesets:
              - markup
            references:
              - https://html.spec.whatwg.org/multipage/form-control-infrastructure.html#autofill-field
            rationale: Los teléfonos muestran el teclado equivocado y el autocompletado sugiere un valor erróneo cuando un campo de correo, teléfono o URL es un campo de texto simple.
          - id: markup/lang-switcher/mismatch
            title: Los enlaces del selector de idioma no declaran su idioma de destino
            severity: warning
            score: "4.8"
            scope: page
            rulesets:
              - markup
            references:
              - https://www.w3.org/International/questions/qa-link-lang
            rationale: Sin lang y hreflang un lector de pantalla pronuncia el enlace en el idioma equivocado, y ni los visitantes ni los buscadores saben a qué idioma lleva.
          - id: network/asn/single
            title: El sitio y sus servidores de nombres están en un solo sistema autónomo
            severity: hint
            score: "0.6"
            scope: site
            rulesets:
              - network
              - server
            references:
              - https://www.rfc-editor.org/rfc/rfc2182#section-3.1
            rationale: Una única caída de red tumba entonces a la vez el sitio y su DNS. No se señala cuando un operador DNS anycast anuncia la zona.
          - id: network/mail-fcrdns/mismatch
            title: Una dirección de servidor de correo no tiene un nombre DNS inverso coincidente
            severity: warning
            score: "5.8"
            scope: site
            rulesets:
              - network
              - server
            references:
              - https://www.rfc-editor.org/rfc/rfc1912#section-2.1
            rationale: Los grandes proveedores de correo rechazan o envían a spam el correo de una dirección sin registro PTR, o cuyo PTR no resuelve de vuelta a esa dirección, así que el correo del nombre se pierde.
            message: la dirección de un intercambiador de correo no tiene PTR, o su PTR no resuelve de vuelta a ella, así que los grandes proveedores de buzones rechazan su correo
          - id: network/rpki/invalid
            title: Una dirección está en una ruta que RPKI marca como inválida
            severity: error
            score: "9.0"
            scope: site
            rulesets:
              - network
              - server
            references:
              - https://www.rfc-editor.org/rfc/rfc6811
            rationale: Las redes que descartan rutas inválidas según RPKI no pueden llegar al sitio, y la discrepancia también puede indicar un secuestro de ruta.
            message: una dirección está en una ruta que RPKI marca como inválida, así que las redes que descartan rutas inválidas no pueden alcanzar el sitio
          - id: network/rpki/missing
            title: Una dirección está en un prefijo que ninguna autorización de ruta RPKI cubre
            severity: hint
            score: "0.7"
            scope: site
            rulesets:
              - network
              - server
            references:
              - https://www.rfc-editor.org/rfc/rfc6480
            rationale: Sin un ROA, un secuestro de la ruta no se distingue de la real, así que una red maliciosa puede atraer el tráfico del sitio.
            message: una dirección está en un prefijo que ningún ROA cubre, así que un secuestro de su ruta no se puede distinguir
          - id: origin/canonical-host/mismatch
            title: Las variantes de entrada no llevan todas a un único origen canónico
            severity: warning
            score: "5.6"
            scope: site
            rulesets:
              - origin
              - server
            references:
              - https://developers.google.com/search/docs/crawling-indexing/consolidate-duplicate-urls
            rationale: Cuando http, https, www y el dominio sin prefijo sirven el sitio por separado, los buscadores reparten el posicionamiento entre copias y los visitantes llegan a direcciones incoherentes. Se juzga una vez por origen.
          - id: origin/compression/missing
            title: La página de inicio no se ofrece en br, zstd y gzip
            severity: info
            score: "2.4"
            scope: site
            rulesets:
              - origin
              - server
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Headers/Accept-Encoding
            rationale: Sin compresión cada visitante descarga más bytes, lo que es más lento en conexiones móviles. Solo se juzga una página de texto de 1 KiB o más.
            message: / se sirve solo con {got}; ofrece br, zstd y gzip, cada uno a los clientes que lo piden
          - id: origin/cross-domain-policy/insecure
            title: Un archivo de política de dominios cruzados permite que cualquier origen lea el sitio
            severity: warning
            score: "5.2"
            scope: site
            rulesets:
              - origin
              - server
            references:
              - https://www.adobe.com/devnet-docs/acrobatetk/tools/AppSec/xdomain.html
            rationale: Una política con comodín permite que una página de cualquier otro sitio haga solicitudes de Flash o Silverlight como el visitante y lea las respuestas. Se juzga una vez por origen.
            message: "un archivo de política entre dominios deja que cualquier origen lea el sitio como su visitante: {got}"
          - id: origin/entry-redirect-path/missing
            title: Las redirecciones de entrada pierden la ruta o la consulta solicitadas
            severity: warning
            score: "5.4"
            scope: site
            rulesets:
              - origin
              - server
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Guides/Redirections
            rationale: Un visitante que sigue un enlace profundo o un marcador a través de http o www acaba en la página de inicio en lugar de en la página que quería. Se juzga una vez por origen.
            message: "las variantes de entrada pierden la ruta o la consulta pedida por el camino: {got}"
          - id: origin/entry-redirect/excessive
            title: Las variantes de entrada necesitan más de un salto de redirección
            severity: warning
            score: "4.8"
            scope: site
            rulesets:
              - origin
              - server
            references:
              - https://hstspreload.org/#deployment-recommendations
            rationale: Cada redirección adicional añade un viaje de ida y vuelta antes de que la página empiece a cargarse, y los buscadores pueden dejar de seguir una cadena larga. Se juzga una vez por origen.
            message: "las variantes de entrada tardan más de un salto, o dos que no empiezan de http a https en el mismo host: {got}"
          - id: origin/entry-redirect/insecure
            title: Una redirección envía a los visitantes de https de vuelta a http simple
            severity: error
            score: "9.0"
            scope: site
            rulesets:
              - origin
              - server
            references:
              - https://developer.mozilla.org/docs/Web/Security/Practical_implementation_guides/TLS#http_redirections
            rationale: La conexión del visitante pasa de cifrada a sin cifrar, así que cualquiera en la red puede leer o alterar la página. Se juzga una vez por origen.
            message: "las variantes de entrada se envían de https de vuelta a http simple: {got}"
          - id: origin/entry-redirect/temporary
            title: Las variantes de entrada redirigen con un estado temporal
            severity: warning
            score: "4.6"
            scope: site
            rulesets:
              - origin
              - server
            references:
              - https://developers.google.com/search/docs/crawling-indexing/301-redirects#permanent-server-side
            rationale: Un 302, un 307 o un meta refresh indica a los buscadores que el cambio no es permanente, así que siguen indexando la dirección antigua. Se juzga una vez por origen.
            message: "las variantes de entrada redirigen con un estado temporal o un meta refresh: {got}"
          - id: origin/error-page/disclosing
            title: La página de error 404 expone una traza de pila o la versión del servidor
            severity: warning
            score: "5.0"
            scope: site
            rulesets:
              - origin
              - server
            references:
              - https://owasp.org/www-community/Improper_Error_Handling
            rationale: Una traza de pila o un número de versión indica a los atacantes exactamente qué software y qué fallos atacar. Solo se juzga cuando la solicitud de página inexistente responde 404 o 410.
            message: la página de no encontrado no es HTML limpio, sin trazas de pila ni versiones del servidor ({got})
          - id: origin/favicon/invalid
            title: /favicon.ico no es una imagen
            severity: info
            score: "2.2"
            scope: site
            rulesets:
              - origin
              - server
            references:
              - https://developers.google.com/search/docs/appearance/favicon-in-search
            rationale: Los navegadores y rastreadores piden /favicon.ico por defecto, así que una página de error HTML ahí deja un icono ausente y desperdicia una solicitud.
            message: /favicon.ico no es una imagen ({got})
          - id: origin/https-redirect/missing
            title: http simple no redirige a https en un solo salto permanente
            severity: off
            score: "5.0"
            scope: site
            rulesets:
              - origin
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Guides/Redirections
            rationale: Los visitantes que escriben o siguen una dirección http siguen sin cifrado o dan un rodeo. Lo sustituye la comprobación del origen canónico y está desactivada por defecto.
            message: http simple no redirige a https en un salto permanente ({got}); obsoleto, véase origin/canonical-host/mismatch
          - id: origin/locale-redirect/present
            title: La página de inicio redirige según Accept-Language
            severity: warning
            score: "4.4"
            scope: site
            rulesets:
              - origin
              - server
            references:
              - https://developers.google.com/search/docs/specialty/international/locale-adaptive-pages
            rationale: Los visitantes y rastreadores que piden en idiomas distintos son enviados a URL distintas, así que los buscadores pueden ver solo una de ellas. Se juzga una vez por origen.
            message: / acaba en {got} URLs distintas según Accept-Language
          - id: origin/revalidation/broken
            title: Una solicitud condicional no se responde con 304 Not Modified
            severity: info
            score: "1.8"
            scope: site
            rulesets:
              - origin
              - server
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Guides/Conditional_requests
            rationale: Sin respuestas 304 cada visita repetida y cada rastreador vuelve a descargar la página entera. Solo se juzga cuando la página lleva un validador como un ETag.
            message: una petición condicional de la página inicial responde {got}, no 304 Not Modified
          - id: origin/slash-redirect/missing
            title: Una página responde con el mismo título con y sin barra final
            severity: warning
            score: "5.2"
            scope: site
            rulesets:
              - origin
            references:
              - https://developers.google.com/search/docs/crawling-indexing/consolidate-duplicate-urls
            rationale: Dos direcciones para una misma página reparten enlaces y posicionamiento entre ambas y crean contenido duplicado. Se juzga una vez por origen.
            message: "una página responde 2xx con el mismo título con y sin barra final: {got}"
          - id: origin/soft-404/present
            title: Las páginas inexistentes responden 200 en lugar de 404 o 410
            severity: warning
            score: "5.8"
            scope: site
            rulesets:
              - origin
              - server
            references:
              - https://developers.google.com/search/docs/crawling-indexing/http-network-errors#soft-404-errors
            rationale: Los buscadores indexan las páginas de error como contenido real, y ni los visitantes ni los rastreadores distinguen un enlace roto de una página viva. Se solicita una URL inexistente aleatoria una vez por origen.
            message: una página inexistente responde {got}, no 404 ni 410
          - id: origin/www/broken
            title: Un host que se resuelve en DNS no responde
            severity: warning
            score: "5.6"
            scope: site
            rulesets:
              - origin
              - server
            references:
              - https://developers.cloudflare.com/support/troubleshooting/http-status-codes/cloudflare-5xx-errors/
            rationale: Los visitantes y buscadores que llegan al host www o al dominio raíz reciben un error o un tiempo de espera, y los consejos de redirección no sirven hasta que el servidor responda. Se juzga una vez por origen.
          - id: origin/www/unreachable
            title: El host www o el dominio raíz no tiene respuesta DNS
            severity: info
            score: "1.0"
            scope: site
            rulesets:
              - origin
              - recommended
              - server
            references:
              - https://developers.google.com/search/docs/crawling-indexing/site-move-with-url-changes
            rationale: Los visitantes que escriben la dirección con o sin www reciben un error en lugar del sitio. Es solo una pista, porque una variante ausente puede ser deliberada.
            message: no hay respuesta DNS para el host de entrada {got}; asegúrate de que es deliberado
          - id: parity/canonical/mismatch
            title: El enlace canónico solo existe después de ejecutar JavaScript
            severity: warning
            score: "5.5"
            scope: page
            rulesets:
              - parity
            references:
              - https://developers.google.com/search/docs/crawling-indexing/javascript/javascript-seo-basics#properly-inject-canonical-links
            rationale: El HTML original no tiene enlace canónico, así que los rastreadores que no ejecutan scripts pueden indexar URL duplicadas de la misma página. El modo navegador compara el HTML original con la página renderizada y solo revisa las páginas que responden 2xx.
            message: el enlace canónico solo existe tras ejecutar JavaScript
          - id: parity/description/mismatch
            title: La meta description solo existe después de ejecutar JavaScript
            severity: info
            score: "2.6"
            scope: page
            rulesets:
              - parity
            references:
              - https://developers.google.com/search/docs/crawling-indexing/javascript/javascript-seo-basics
            rationale: El HTML original no tiene meta description, así que los buscadores y las vistas previas que no ejecutan scripts muestran un fragmento peor. El modo navegador compara el HTML original con la página renderizada y solo revisa las páginas que responden 2xx.
            message: la meta descripción solo existe tras ejecutar JavaScript
          - id: parity/h1/mismatch
            title: El encabezado principal solo existe después de ejecutar JavaScript
            severity: info
            score: "2.4"
            scope: page
            rulesets:
              - parity
            references:
              - https://developers.google.com/search/docs/crawling-indexing/javascript/javascript-seo-basics
            rationale: El HTML original no tiene h1, así que los rastreadores y lectores sin scripts no reciben encabezado principal. El modo navegador compara el HTML original con la página renderizada y solo revisa las páginas que responden 2xx.
            message: el h1 solo existe tras ejecutar JavaScript
          - id: parity/links/mismatch
            title: Los enlaces internos solo existen después de ejecutar JavaScript
            severity: warning
            score: "5.8"
            scope: page
            rulesets:
              - parity
            references:
              - https://developers.google.com/search/docs/crawling-indexing/links-crawlable
            rationale: El HTML original carece de los enlaces internos del sitio, así que los rastreadores que no ejecutan scripts no pueden seguirlos hacia las demás páginas. El modo navegador compara el HTML original con la página renderizada y solo revisa las páginas que responden 2xx.
            message: los enlaces internos solo existen tras ejecutar JavaScript
          - id: parity/text/mismatch
            title: La mayor parte del texto aparece solo después de ejecutar JavaScript
            severity: warning
            score: "5.2"
            scope: page
            rulesets:
              - parity
            references:
              - https://developer.mozilla.org/docs/Glossary/SSR
            rationale: Menos de la mitad del texto que muestra un navegador está en el HTML original, así que los rastreadores, lectores y herramientas sin scripts ven una página casi vacía. El modo navegador compara el HTML original con la página renderizada y solo juzga las páginas con al menos 200 caracteres renderizados.
            message: el HTML sin procesar lleva una proporción del texto que muestra la página renderizada
          - id: parity/title/mismatch
            title: El título solo existe después de ejecutar JavaScript
            severity: warning
            score: "6.0"
            scope: page
            rulesets:
              - parity
            references:
              - https://developers.google.com/search/docs/crawling-indexing/javascript/javascript-seo-basics
            rationale: El HTML original no tiene título, así que los rastreadores y las vistas previas de enlaces que no ejecutan scripts ven una página sin título. El modo navegador compara el HTML original con la página renderizada y solo revisa las páginas que responden 2xx.
            message: el título solo existe tras ejecutar JavaScript
          - id: redirects/chain/excessive
            title: Llegar a la página requiere más de 2 redirecciones
            severity: warning
            score: "4.8"
            scope: page
            rulesets:
              - redirects
            references:
              - https://developers.google.com/search/docs/crawling-indexing/301-redirects
            rationale: Cada redirección adicional añade un viaje de ida y vuelta antes de que la página empiece a cargar, lo que ralentiza a los visitantes, y los rastreadores pueden abandonar las cadenas largas.
            message: requiere más de 2 redirecciones para llegar
          - id: redirects/redirect-by/missing
            title: Una redirección no indica qué componente la envió
            severity: hint
            score: "0.1"
            scope: page
            rulesets:
              - suggestions
            references:
              - https://specification.website/spec/
            rationale: Sin Redirect-By, averiguar qué servidor, complemento o regla emitió una redirección inesperada es cuestión de adivinar. Es una ayuda opcional para quien depura el sitio.
            message: una redirección no dice qué componente la envió con Redirect-By
          - id: redirects/status/temporary
            title: Se llega a la página mediante una redirección temporal
            severity: info
            score: "2.4"
            scope: page
            rulesets:
              - redirects
            references:
              - https://developers.google.com/search/docs/crawling-indexing/301-redirects#permanent-server-side
            rationale: Un 302, 303 o 307 indica a los buscadores que el cambio puede revertirse, así que siguen indexando la URL antigua y pueden no transferir su posicionamiento a la nueva. Solo se revisan las páginas que responden 2xx tras redirigir.
            message: se llega mediante una redirección temporal
          - id: resources/a11y-overlay/present
            title: La página carga un script de superposición de accesibilidad
            severity: warning
            score: "5.2"
            scope: page
            rulesets:
              - resources
            references:
              - https://overlayfactsheet.com/
            rationale: Estos widgets afirman corregir la accesibilidad automáticamente, pero no reparan el marcado subyacente y a menudo estorban a los lectores de pantalla y a quienes usan el teclado. Además pueden exponer el sitio a reclamaciones de accesibilidad. La comprobación detecta los dominios de proveedores de superposiciones conocidos.
            message: carga una superposición de accesibilidad, que no arregla la página y estorba a las tecnologías de apoyo
          - id: resources/cache-control/weak
            title: Un recurso con huella se almacena en caché menos de un año
            severity: warning
            score: "4.8"
            scope: site
            rulesets:
              - resources
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Guides/Caching#cache_busting
            rationale: Un archivo cuyo nombre incluye un hash del contenido, o que está marcado como immutable, nunca queda obsoleto, así que una vida en caché más corta solo obliga a los visitantes recurrentes a descargarlo de nuevo. También se informa cuando la cabecera Cache-Control es incorrecta.
          - id: resources/compression/missing
            title: Un recurso de texto se envía sin comprimir
            severity: warning
            score: "4.4"
            scope: site
            rulesets:
              - resources
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Guides/Compression
            rationale: Los scripts, hojas de estilo, SVG y otros textos de más de 1 KB enviados sin br, gzip ni zstd cuestan a los visitantes más bytes y tiempo, sobre todo en redes móviles lentas. Solo se juzgan las respuestas correctas.
          - id: resources/integrity/missing
            title: Un script u hoja de estilo de otro origen no tiene hash de integridad
            severity: warning
            score: "6.5"
            scope: site
            rulesets:
              - resources
            references:
              - https://developer.mozilla.org/docs/Web/Security/Subresource_Integrity
            rationale: Si el servidor o la CDN del tercero se ve comprometido, se ejecuta código alterado en la página sin nada que lo detenga. Un hash de Subresource Integrity hace que el navegador rechace un archivo modificado.
          - id: resources/protocol/insecure
            title: Una página https carga un recurso por http sin cifrar
            severity: error
            score: "9.4"
            scope: site
            rulesets:
              - resources
            references:
              - https://developer.mozilla.org/docs/Web/Security/Mixed_content
            rationale: Los navegadores bloquean o advierten del contenido mixto, así que el recurso puede no cargar, y cualquiera en la red puede leer o alterar lo que sí carga. Se aplica a las páginas https que cargan URL http:.
          - id: resources/resource/unreachable
            title: Una página carga un recurso que falla o responde con un error
            severity: error
            score: "dynamic: 0 → 9.0, 404 → 7.6, 500 → 9.0"
            scope: site
            rulesets:
              - resources
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Reference/Status
            rationale: Las imágenes, scripts u hojas de estilo que no cargan dejan a los visitantes con diseños rotos o funciones ausentes. Se cuenta cuando un recurso responde fuera de 2xx o no responde; los adjuntos de feeds se excluyen.
          - id: robots/ai-crawlers/present
            title: robots.txt se dirige a rastreadores de IA
            severity: info
            score: "1.6"
            scope: site
            rulesets:
              - robots
              - server
            references:
              - https://www.rfc-editor.org/rfc/rfc9309#section-2.2.1
            rationale: Las reglas para los rastreadores que entrenan modelos o descargan páginas para respuestas de IA deciden si el contenido se usa allí. El hallazgo enumera cada rastreador nombrado y si se le cierra el paso, para que el propietario confirme que es lo deseado.
          - id: robots/content-signal/invalid
            title: Una línea Content-Signal de robots.txt está mal formada
            severity: warning
            score: "3.6"
            scope: site
            rulesets:
              - robots
              - server
            references:
              - https://contentsignals.org/
            rationale: Los rastreadores que leen Content-Signal pueden ignorar una línea con una señal desconocida o un valor distinto de yes o no, así que no se respetan los deseos del propietario sobre búsqueda, entrada de IA y entrenamiento de IA.
          - id: robots/crawler-access/mismatch
            title: El acceso en robots.txt contradice las señales de contenido declaradas
            severity: warning
            score: "4.4"
            scope: site
            rulesets:
              - robots
              - server
            references:
              - https://contentsignals.org/
            rationale: Se cierra el paso a un rastreador aunque las señales permiten su propósito, o se le deja pasar aunque dicen que no, de modo que el contenido falta en la búsqueda o se usa para IA contra los deseos declarados del propietario. Se omite cuando robots.txt no responde o falla con un error del servidor.
          - id: robots/root/blocked
            title: robots.txt bloquea a todos los rastreadores en todo el sitio
            severity: warning
            score: "6.3"
            scope: site
            rulesets:
              - robots
              - server
            references:
              - https://www.rfc-editor.org/rfc/rfc9309#section-2.2.2
            rationale: "User-agent: * con Disallow: / y sin ningún Allow indica a todos los rastreadores respetuosos que se mantengan fuera, así que los buscadores eliminan el sitio de sus resultados."
          - id: sitemap/document/unreadable
            title: No se puede leer un mapa del sitio
            severity: warning
            score: "dynamic: 0 → 5.8, 404 → 4.4, 500 → 5.8"
            scope: site
            rulesets:
              - server
              - sitemap
            references:
              - https://www.sitemaps.org/protocol.html
            rationale: Los buscadores que no pueden descargar o interpretar el mapa del sitio no conocen las páginas que enumera, así que las páginas nuevas o profundas se descubren más tarde o nunca. Se informa cuando un archivo de mapa del sitio no se descarga ni se interpreta, o no enumera ninguna URL.
          - id: sitemap/hreflang/mismatch
            title: Las alternativas del mapa del sitio y los enlaces hreflang no coinciden
            severity: warning
            score: "4.6"
            scope: page
            rulesets:
              - sitemap
            references:
              - https://developers.google.com/search/docs/specialty/international/localized-versions#sitemap
            rationale: Cuando el mapa del sitio y la página enumeran versiones de idioma distintas, los buscadores reciben señales contradictorias y pueden ignorar ambas, de modo que los visitantes pueden llegar al idioma equivocado. Solo se comparan las páginas que tienen ambos.
          - id: sitemap/media/unreachable
            title: El mapa del sitio enumera una imagen o un vídeo que no carga
            severity: warning
            score: "dynamic: 0 → 5.2, 404 → 4.0, 500 → 5.2"
            scope: site
            rulesets:
              - sitemap
            references:
              - https://developers.google.com/search/docs/crawling-indexing/sitemaps/image-sitemaps
            rationale: Los buscadores no pueden indexar el contenido multimedia que el mapa del sitio nombra pero el servidor no entrega, así que nunca aparece en la búsqueda de imágenes o de vídeos. Se cuenta cuando el archivo responde 4xx o 5xx, o no responde.
          - id: sitemap/page/orphaned
            title: Una página está en el sitemap, pero ninguna página rastreada enlaza a ella
            severity: warning
            score: "5.4"
            scope: page
            rulesets:
              - sitemap
            references:
              - https://developers.google.com/search/docs/crawling-indexing/links-crawlable
            rationale: Las páginas que solo revela el sitemap no forman parte de la navegación del sitio, así que los visitantes no pueden llegar a ellas y los buscadores las consideran poco enlazadas. Solo se revisan las páginas halladas mediante el sitemap, una vez terminado el rastreo.
            message: figura en el sitemap, pero ninguna página rastreada enlaza aquí
          - id: sitemap/page/unlisted
            title: Una página falta en el sitemap
            severity: info
            score: "2.0"
            scope: page
            rulesets:
              - sitemap
            references:
              - https://developers.google.com/search/docs/crawling-indexing/sitemaps/overview
            rationale: Los buscadores usan el sitemap para descubrir páginas y saber cuáles existen, así que una página omitida puede encontrarse tarde o nunca. Solo se revisan las páginas HTML que no están marcadas como noindex.
            message: falta en el sitemap
          - id: sshfp/algorithm/deprecated
            title: Un registro SSHFP usa DSA o solo un resumen SHA-1
            severity: hint
            score: "0.4"
            scope: site
            rulesets:
              - server
              - sshfp
            references:
              - https://www.rfc-editor.org/rfc/rfc6594#section-4.1
            rationale: Las claves DSA ya no están aprobadas para firmar y un resumen SHA-1 por sí solo es débil, así que el registro ofrece menos garantías a los clientes. Solo se comprueba donde existen registros SSHFP.
            message: un registro SSHFP nombra una clave DSA o lleva un resumen SHA-1 sin uno SHA-256 al lado ({got})
          - id: sshfp/record/mismatch
            title: Un registro SSHFP indica una clave de host que el servidor SSH no presenta
            severity: error
            score: "8.8"
            scope: site
            rulesets:
              - server
              - sshfp
            references:
              - https://www.rfc-editor.org/rfc/rfc4255#section-2.3
            rationale: Los clientes que confían en SSHFP rechazan la conexión o reciben una advertencia, porque el registro quedó obsoleto tras una rotación de claves o algo distinto respondió en lugar del servidor.
            message: un registro SSHFP nombra una clave de host que el servidor SSH no presenta, así que el registro quedó obsoleto tras rotar claves o la conexión fue interceptada ({got})
          - id: sshfp/record/missing
            title: El host responde por SSH pero no publica registro SSHFP
            severity: info
            score: "2.2"
            scope: site
            rulesets:
              - server
              - sshfp
            references:
              - https://www.rfc-editor.org/rfc/rfc4255#section-2.1
            rationale: Sin SSHFP, la primera conexión depende de que el usuario acepte una clave desconocida, así que un atacante que la intercepte puede hacerse pasar por el servidor.
            message: el host responde SSH pero no publica registro SSHFP, así que una primera conexión es de confianza en el primer uso
          - id: sshfp/zone/unsigned
            title: Los registros SSHFP no están autenticados por DNSSEC
            severity: warning
            score: "5.4"
            scope: site
            rulesets:
              - server
              - sshfp
            references:
              - https://www.rfc-editor.org/rfc/rfc4255#section-2.4
            rationale: Un cliente SSH no debe confiar en registros SSHFP que DNSSEC no ha autenticado, porque un atacante en la ruta podría falsificarlos. Solo se comprueba donde existen registros SSHFP.
            message: "los registros SSHFP no fueron autenticados por DNSSEC, así que un cliente SSH no debe confiar en ellos: la zona no está firmada o el resolvedor no valida"
          - id: structured-data/breadcrumb/unreachable
            title: Una miga de pan de los datos estructurados lleva a una página inexistente
            severity: warning
            score: "5.2"
            scope: site
            rulesets:
              - structured-data
            references:
              - https://developers.google.com/search/docs/appearance/structured-data/breadcrumb
            rationale: Los buscadores muestran la ruta de migas de pan en los resultados, así que un elemento que redirige o responde con error envía a los visitantes al sitio equivocado.
          - id: structured-data/date/invalid
            title: Las fechas de los datos estructurados son incorrectas o contradictorias
            severity: warning
            score: "4.6"
            scope: page
            rulesets:
              - structured-data
            references:
              - https://developers.google.com/search/docs/appearance/structured-data/article
            rationale: Las fechas que no son ISO 8601, una fecha de modificación anterior a la de publicación o una fecha de publicación distinta de article:published_time hacen que los buscadores muestren fechas erróneas o las ignoren.
          - id: structured-data/entity/inconsistent
            title: La misma entidad se describe de forma incoherente entre páginas
            severity: warning
            score: "5.0"
            scope: site
            rulesets:
              - structured-data
            references:
              - https://www.w3.org/TR/json-ld11/#node-identifiers
            rationale: Un mismo @id con tipos distintos, o una organización o persona con varios @id, divide lo que los buscadores saben de ella en entidades separadas.
          - id: structured-data/json-ld/invalid
            title: Hay bloques JSON-LD en la página que no se pueden interpretar
            severity: error
            score: "7.8"
            scope: page
            rulesets:
              - structured-data
            references:
              - https://json-ld.org/spec/latest/json-ld/
            rationale: Los buscadores omiten un bloque JSON-LD que no es JSON válido, así que la página pierde sus resultados enriquecidos. La causa habitual es una comilla o un salto de línea suelto en un valor de plantilla.
          - id: structured-data/property/missing
            title: Los datos estructurados carecen de propiedades que exige su resultado enriquecido
            severity: warning
            score: "5.8"
            scope: page
            rulesets:
              - structured-data
            references:
              - https://developers.google.com/search/docs/appearance/structured-data/search-gallery
            rationale: Google muestra un resultado enriquecido, como una tarjeta de producto o receta, solo si están las propiedades obligatorias, así que sin ellas la página no es elegible.
          - id: structured-data/reference/broken
            title: Los datos estructurados hacen referencia a un nodo que nunca se define
            severity: warning
            score: "4.8"
            scope: site
            rulesets:
              - structured-data
            references:
              - https://www.w3.org/TR/json-ld11/#node-identifiers
            rationale: Una referencia a un @id que ninguna página rastreada define no apunta a nada, así que los buscadores no pueden conectar las entidades y el enlace no aporta información.
          - id: structured-data/term/deprecated
            title: Los datos estructurados usan términos de schema.org obsoletos
