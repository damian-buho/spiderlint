            scope: page
            rulesets:
              - tls
            references:
              - https://developer.mozilla.org/docs/Web/Security/Transport_Layer_Security
            rationale: Los navegadores bloquean el sitio con una advertencia de seguridad, así que la mayoría de los visitantes no puede acceder a él. Solo en páginas HTTPS.
