            references:
              - https://www.w3.org/WAI/WCAG22/Understanding/link-purpose-in-context.html
            rationale: Quienes usan lectores de pantalla suelen recorrer una lista de enlaces fuera de contexto, donde «leer más» no dice nada, y los buscadores aprenden poco de esos textos. Solo se juzgan las páginas en inglés, español o ucraniano.
          - id: links/click-depth/excessive
            title: Una página está a más de 3 enlaces de la página de inicio
            severity: info
            score: "dynamic: 4 → 1.6, 10 → 3.0"
            scope: page
            rulesets:
              - graph
            references:
              - https://developers.google.com/search/docs/crawling-indexing/links-crawlable
            rationale: Las páginas enterradas en lo profundo del sitio son halladas tarde por los rastreadores y rara vez las alcanzan los visitantes. Los buscadores pueden considerarlas menos importantes. Solo se revisan las páginas HTML que responden 2xx y que el rastreo alcanzó.
            message: una página está a más de 3 enlaces de la página de inicio
          - id: links/external-rel/missing
            title: A los enlaces externos les faltan los tokens rel que exige la política
            severity: off
            score: "5.0"
            scope: page
            rulesets:
              - links
            references:
              - https://developers.google.com/search/docs/crawling-indexing/qualify-outbound-links
            rationale: Los buscadores piden marcar los enlaces de pago como sponsored y el contenido de usuarios como ugc, y un enlace sin los tokens declarados para su host puede interpretarse como transmisor de posicionamiento y arriesgar una penalización. Solo se comprueban los hosts que coinciden con la política configurada.
          - id: links/external/unreachable
            title: Un enlace externo lleva a una página que no carga
            severity: off
            score: "dynamic: 0 → 6.0, 404 → 4.6, 500 → 6.0"
            scope: site
            rulesets:
              - links
              - web-quick
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Reference/Status/404
            rationale: Los visitantes que siguen el enlace llegan a un error o a un sitio caído, lo que da a la página un aspecto descuidado. Solo cuentan los enlaces comprobados que responden 4xx o 5xx, o nada; los límites de peticiones, los muros anti-bots y los hosts excluidos no se juzgan.
          - id: links/incoming/weak
            title: A esta página enlazan pocas páginas del sitio
            severity: info
            score: "1.8"
            scope: page
            rulesets:
              - graph
            references:
              - https://developers.google.com/search/docs/crawling-indexing/links-crawlable
            rationale: Una página a la que enlazan pocas otras es difícil de encontrar y transmite poca importancia a los buscadores. Solo se revisan las páginas HTML que responden 2xx, sin contar la página de inicio ni las de una serie paginada.
            message: solo unas pocas páginas del sitio enlazan aquí
          - id: links/internal-nofollow/present
            title: Los enlaces internos llevan rel=nofollow
            severity: warning
            score: "4.2"
            scope: page
            rulesets:
              - links
            references:
              - https://developers.google.com/search/docs/crawling-indexing/qualify-outbound-links
            rationale: nofollow en los enlaces propios del sitio priva a sus páginas de señales de posicionamiento y dificulta que los rastreadores las descubran. Para mantener a los rastreadores fuera de una página, conviene usar robots.txt o noindex.
          - id: links/internal/redirected
            title: Un enlace interno apunta a una URL que redirige
            severity: warning
            score: "4.6"
            scope: site
            rulesets:
              - links
            references:
              - https://developers.google.com/search/docs/crawling-indexing/301-redirects
            rationale: Cada visitante y cada rastreador paga un viaje de ida y vuelta adicional antes de llegar a la página, lo que ralentiza la carga. Apuntar el enlace a la URL final evita ese salto.
          - id: links/internal/unreachable
            title: Un enlace interno lleva a una página que no carga
            severity: error
            score: "dynamic: 0 → 8.4, 404 → 7.4, 500 → 8.4"
            scope: site
            rulesets:
              - links
            references:
              - https://developers.google.com/search/docs/crawling-indexing/http-network-errors
            rationale: Los visitantes que siguen el enlace llegan a una página de error, y los buscadores pierden tiempo de rastreo en ella y pueden descartar la página. Se cuenta cada página rastreada que responde 4xx o 5xx, o que no responde.
          - id: links/outgoing/missing
            title: Una página no enlaza a ninguna otra página del sitio
            severity: info
            score: "1.6"
            scope: page
            rulesets:
              - graph
            references:
              - https://developers.google.com/search/docs/crawling-indexing/links-crawlable
            rationale: "Una página sin enlaces salientes es un callejón sin salida: los visitantes solo pueden volver atrás y los rastreadores no encuentran nada más a partir de ella. Solo se revisan las páginas HTML que responden 2xx."
            message: una página no enlaza a ninguna otra página del sitio
          - id: links/rel-me-backlink/missing
            title: El HTML de un perfil rel=me no enlaza de vuelta al sitio
            severity: info
            score: "2.2"
            scope: site
            rulesets:
              - links
            references:
              - https://microformats.org/wiki/rel-me
            rationale: Servicios como Mastodon solo verifican un perfil cuando enlaza de vuelta, así que el visitante no ve la insignia de verificación. El perfil se lee como HTML simple, por lo que no se ve un enlace que añada un script.
          - id: links/rel-me-rendered/missing
            title: Un perfil rel=me no enlaza de vuelta cuando se ejecutan sus scripts
            severity: info
            score: "2.2"
            scope: page
            rulesets:
              - rel-me
            references:
              - https://microformats.org/wiki/rel-me
            rationale: Servicios como Mastodon solo verifican un perfil cuando enlaza de vuelta, así que el visitante no ve la insignia de verificación. El perfil se carga en un navegador y solo se juzgan los perfiles que responden 2xx.
          - id: live/click-target/inaccessible
            title: Un div o span en el que se hace clic no tiene rol
            severity: warning
            score: "5.2"
            scope: page
            rulesets:
              - live
            references:
              - https://www.w3.org/WAI/ARIA/apg/practices/keyboard-interface/
            rationale: Un elemento simple que recibe clics no se alcanza con el teclado ni lo anuncia un lector de pantalla, así que esos visitantes no pueden usarlo. Solo se juzgan las páginas de la muestra, en un navegador.
          - id: live/contrast-enhanced/weak
            title: El texto sigue por debajo de 7:1 de contraste cuando se pide más contraste
            severity: warning
            score: "5.0"
            scope: page
            rulesets:
              - live
            references:
              - https://www.w3.org/WAI/WCAG22/Understanding/contrast-enhanced.html
            rationale: La página responde a la preferencia de más contraste, pero parte del texto sigue sin llegar a la proporción mejorada de 7:1, así que los visitantes con baja visión que la pidieron ganan poco. Solo se juzgan las páginas de la muestra, en un navegador.
          - id: live/contrast-more/weak
            title: Ningún estilo responde a la petición de más contraste
            severity: info
            score: "1.6"
            scope: page
            rulesets:
              - live
            references:
              - https://developer.mozilla.org/docs/Web/CSS/@media/prefers-contrast
            rationale: Los visitantes que configuran su sistema con más contraste, como las personas con baja visión, siguen viendo los colores pálidos por defecto. Solo se juzgan las páginas de la muestra, en un navegador.
          - id: live/dark-contrast/weak
            title: El texto es demasiado tenue para leerse en el esquema oscuro que la página dice admitir
            severity: warning
            score: "5.6"
            scope: page
            rulesets:
              - live
            references:
              - https://www.w3.org/WAI/WCAG22/Understanding/contrast-minimum.html
            rationale: La página declara compatibilidad con el modo oscuro, pero algunos elementos tienen poco contraste en él, así que los visitantes con modo oscuro no pueden leerlos. Solo se juzgan las páginas de la muestra, en un navegador.
          - id: live/forced-color-adjust/inaccessible
            title: Los elementos conservan sus propios colores de texto con colores forzados
            severity: info
            score: "2.4"
            scope: page
            rulesets:
              - live
            references:
              - https://developer.mozilla.org/docs/Web/CSS/forced-color-adjust
            rationale: El texto que se excluye de los colores forzados conserva su propia paleta, que puede ser ilegible sobre el fondo que eligió el visitante de alto contraste. Solo se juzgan las páginas de la muestra, en un navegador.
          - id: live/forced-colors-icon/inaccessible
            title: Los controles de icono no muestran nada con colores forzados
            severity: warning
            score: "5.4"
            scope: page
            rulesets:
              - live
            references:
              - https://developer.mozilla.org/docs/Web/CSS/@media/forced-colors
            rationale: Un botón cuyo único contenido es un icono con degradado o máscara queda en blanco en el modo de alto contraste de Windows, y esos visitantes no ven para qué sirve. Solo se juzgan las páginas de la muestra, en un navegador.
          - id: live/input-font-size/weak
            title: Los campos de formulario usan una fuente de menos de 16 px
            severity: info
            score: "2.6"
            scope: page
            rulesets:
              - live
            references:
              - https://developer.mozilla.org/docs/Web/HTML/Viewport_meta_tag
            rationale: iOS Safari amplía la página al enfocar un campo con una fuente menor, lo que desorienta a quienes usan el móvil. Se mide con una ventana de escritorio en las páginas de la muestra, en un navegador.
          - id: live/reduced-motion/missing
            title: Las animaciones y los vídeos ignoran la preferencia de movimiento reducido
            severity: warning
            score: "6.2"
            scope: page
            rulesets:
              - live
            references:
              - https://www.w3.org/WAI/WCAG22/Understanding/pause-stop-hide.html
            rationale: Los visitantes que piden a su sistema menos movimiento, a menudo porque el contenido en movimiento les causa mareo o náuseas, siguen recibiendo animaciones infinitas y reproducción automática. Solo se juzgan las páginas de la muestra, en un navegador.
          - id: live/webmcp/missing
            title: La página no registra herramientas WebMCP para agentes del navegador
            severity: hint
            score: "0.8"
            scope: page
            rulesets:
              - live
            references:
              - https://webmcp.org/
            rationale: Un agente del navegador solo puede entonces hacer clic y leer la interfaz, lo que es más lento y frágil que invocar las acciones de la página. Solo se comprueba donde el navegador admite WebMCP.
          - id: mail/bimi-dmarc/weak
            title: BIMI está publicado pero DMARC no aplica una política
            severity: warning
            score: "4.4"
            scope: site
            rulesets:
              - mail
            references:
              - https://datatracker.ietf.org/doc/draft-brand-indicators-for-message-identification/
            rationale: Los clientes de correo solo muestran el logotipo BIMI cuando DMARC pone en cuarentena o rechaza todo el correo, así que el logotipo publicado no se ve. Solo se comprueba en nombres con un registro BIMI.
            message: BIMI está publicado pero DMARC no pone en cuarentena ni rechaza todo el correo, así que ningún receptor muestra el logotipo
          - id: mail/bimi-logo/invalid
            title: El logotipo BIMI no carga o incumple el perfil SVG
            severity: warning
            score: "4.3"
            scope: site
            rulesets:
              - mail
            references:
              - https://datatracker.ietf.org/doc/draft-svg-tiny-ps-abrotman/
            rationale: Los receptores no muestran logotipo cuando falta el archivo o no es una imagen SVG Tiny PS, así que el registro BIMI no sirve de nada. Solo se comprueba en nombres con un registro BIMI que indica un logotipo.
            message: el logotipo BIMI no carga o incumple el perfil SVG Tiny PS, así que los receptores no muestran ninguno ({got})
          - id: mail/bimi-vmc/invalid
            title: El certificado de marca BIMI no carga o no es un archivo PEM
            severity: warning
            score: "4.2"
            scope: site
            rulesets:
              - mail
            references:
              - https://datatracker.ietf.org/doc/draft-brand-indicators-for-message-identification/
            rationale: Los receptores que exigen un certificado de marca verificado no muestran el logotipo sin uno válido. Solo se comprueba en nombres con un registro BIMI que indica un certificado.
            message: el certificado BIMI que nombra la etiqueta a= no carga o no es un certificado PEM
          - id: mail/bimi/invalid
            title: El registro BIMI incumple la sintaxis de BIMI
            severity: warning
            score: "4.5"
            scope: site
            rulesets:
              - mail
            references:
              - https://datatracker.ietf.org/doc/draft-brand-indicators-for-message-identification/
            rationale: Los clientes de correo ignoran un registro BIMI mal formado, así que el logotipo de la marca nunca aparece junto al correo del nombre. Solo se comprueba en nombres con un registro BIMI.
            message: el registro BIMI incumple su gramática ({got})
          - id: mail/dane/missing
            title: Un servidor de correo no tiene registro TLSA firmado con DNSSEC
            severity: hint
            score: "0.8"
            scope: site
            rulesets:
              - mail
            references:
              - https://www.rfc-editor.org/rfc/rfc7672
            rationale: Sin un registro TLSA firmado en _25._tcp, los remitentes no pueden autenticar el certificado del servidor y un atacante puede hacerse pasar por él. Solo se comprueba cuando la comprobación DANE está activada.
            message: un intercambiador no tiene registro TLSA firmado con DNSSEC en _25._tcp, así que los remitentes no pueden autenticar su certificado ({got})
          - id: mail/dkim-key/invalid
            title: Una clave RSA de DKIM tiene menos de 1024 bits
            severity: error
            score: "8.8"
            scope: site
            rulesets:
              - mail
            references:
              - https://www.rfc-editor.org/rfc/rfc8301#section-3.2
            rationale: La RFC 8301 exige al menos 1024 bits, así que los receptores tratan las firmas de esa clave como ausentes y el correo puede fallar en DMARC. Solo se comprueba en nombres que reciben o envían correo.
            message: una clave RSA de DKIM es más corta que los 1024 bits que exige la RFC 8301, así que los receptores tratan sus firmas como ausentes ({got})
          - id: mail/dkim-key/weak
            title: Una clave RSA de DKIM tiene menos de 2048 bits
            severity: warning
            score: "3.8"
            scope: site
            rulesets:
              - mail
            references:
              - https://www.rfc-editor.org/rfc/rfc8301#section-3.2
            rationale: La RFC 8301 recomienda 2048 bits, ya que una clave más corta está al alcance de un atacante que quiera falsificar correo firmado. Solo se comprueba en nombres que reciben o envían correo.
            message: una clave RSA de DKIM es más corta que los 2048 bits que recomienda la RFC 8301 ({got})
          - id: mail/dkim-revoked/present
            title: Un selector DKIM publica una clave vacía y revocada
            severity: info
            score: "1.6"
            scope: site
            rulesets:
              - mail
            references:
              - https://www.rfc-editor.org/rfc/rfc6376#section-3.6.1
            rationale: Una clave vacía revoca el selector, lo cual es correcto para uno retirado; si los servidores aún firman con él, todas las firmas fallan y el correo puede fallar en DMARC. Solo se comprueba en nombres que reciben o envían correo.
            message: un selector DKIM publica una clave vacía, lo que la revoca; bien para un selector retirado, no para uno en uso ({got})
          - id: mail/dkim-testing/present
            title: Una clave DKIM sigue marcada como de prueba
            severity: warning
            score: "3.9"
            scope: site
            rulesets:
              - mail
            references:
              - https://www.rfc-editor.org/rfc/rfc6376#section-3.6.1
            rationale: Con la marca t=y, los receptores pueden ignorar una firma fallida, de modo que el correo falsificado con una firma incorrecta no se detecta. Solo se comprueba en nombres que reciben o envían correo.
            message: una clave DKIM aún lleva la marca de prueba t=y, así que los receptores pueden ignorar las firmas fallidas ({got})
          - id: mail/dkim/invalid
            title: Un registro de clave DKIM incumple la sintaxis de DKIM
            severity: warning
            score: "4.0"
            scope: site
            rulesets:
              - mail
            references:
              - https://www.rfc-editor.org/rfc/rfc6376#section-3.6.1
            rationale: Las firmas hechas con una clave mal formada no superan la verificación, así que los receptores tratan el correo del nombre como no firmado y DMARC puede hacerlo fallar. Solo se comprueba en nombres que reciben o envían correo.
            message: un registro de clave DKIM incumple la gramática de la RFC 6376, así que las firmas bajo él fallan ({got})
          - id: mail/dkim/missing
            title: No se encuentra ninguna clave DKIM para el nombre
            severity: hint
            score: "0.7"
            scope: site
            rulesets:
              - mail
            references:
              - https://www.rfc-editor.org/rfc/rfc6376#section-3.6.2.1
            rationale: Sin una clave DKIM, los receptores no pueden verificar que el correo lo firmaron los servidores del nombre, y DMARC y los filtros de spam confían menos en él. La sonda solo prueba nombres de selector habituales, así que puede pasar por alto un selector propio.
            message: no se encontró clave DKIM bajo ningún selector común; la lista de sondeo no puede ser completa, así que revisa el selector de tu proveedor
          - id: mail/dmarc-external-auth/missing
            title: DMARC envía informes a un dominio que no los acepta
            severity: warning
            score: "5.3"
            scope: site
            rulesets:
              - mail
              - mail:recommended
              - server
            references:
              - https://www.rfc-editor.org/rfc/rfc9990#section-4
            rationale: Los receptores descartan los informes dirigidos a otro dominio que no ha aceptado recibirlos, así que el propietario no recibe ninguno. Solo se comprueba en nombres con un registro DMARC válido.
            message: DMARC envía informes a un dominio que no los acepta, así que los receptores los descartan ({got})
          - id: mail/dmarc-report-uri/invalid
            title: "Una dirección de informes DMARC no es una dirección mailto:"
            severity: warning
            score: "4.1"
            scope: site
            rulesets:
              - mail
              - mail:recommended
              - server
            references:
              - https://www.rfc-editor.org/rfc/rfc9990#section-3
            rationale: "Una dirección rua o ruf que no sea un URI mailto: no recibe informes, de modo que el propietario nunca sabe quién envía o falsifica correo con el nombre. Solo se comprueba en nombres con un registro DMARC válido."
            message: una dirección de informes DMARC no es un URI mailto:, así que ningún informe le llega ({got})
          - id: mail/dmarc-subdomain-policy/weak
            title: El registro DMARC no fija política para los subdominios
            severity: info
            score: "2.6"
            scope: site
            rulesets:
              - mail
            references:
              - https://www.rfc-editor.org/rfc/rfc9989#section-4.7
            rationale: Los subdominios heredan en silencio la política principal, así que un cambio en ella los afecta sin planearlo, y el correo falsificado desde un subdominio puede colarse. Solo se comprueba en el registro del propio dominio, cuando hay subdominios.
            message: el registro DMARC no fija política sp= aunque el dominio sirve subdominios, que entonces heredan p= en silencio
          - id: mail/dmarc-testing/present
            title: La política DMARC está en modo de prueba
            severity: info
            score: "2.4"
            scope: site
            rulesets:
              - mail
            references:
              - https://www.rfc-editor.org/rfc/rfc9989#section-4.7
            rationale: Con t=y o pct inferior a 100, los receptores aplican la política solo a parte del correo, así que algo del correo falsificado sigue llegando a las bandejas de entrada. Solo se comprueba en nombres con un registro DMARC válido.
            message: la política DMARC está en modo de prueba, t=y o pct por debajo de 100, así que los receptores no la aplican a todo el correo
          - id: mail/dmarc/duplicate
            title: El nombre publica más de un registro DMARC
            severity: warning
            score: "6.3"
            scope: site
            rulesets:
              - mail
              - mail:recommended
              - server
            references:
              - https://www.rfc-editor.org/rfc/rfc9989#section-4.10
            rationale: Los receptores descartan todos los registros DMARC cuando hay varios, de modo que el nombre queda sin política y el correo falsificado no se detiene. Solo se comprueba en nombres que reciben o envían correo.
            message: el nombre publica {got} registros DMARC, así que los receptores descartan todos
          - id: mail/dmarc/invalid
            title: El registro DMARC incumple la sintaxis de DMARC
            severity: warning
            score: "6.1"
            scope: site
            rulesets:
              - mail
              - mail:recommended
              - server
            references:
              - https://www.rfc-editor.org/rfc/rfc9989#section-4.7
            rationale: Los receptores ignoran un registro DMARC mal formado, de modo que el nombre queda sin política y el correo falsificado no se detiene. Solo se comprueba en nombres que reciben o envían correo.
            message: el registro DMARC incumple la gramática de la RFC 9989 ({got})
          - id: mail/mta-sts-max-age/weak
            title: La política MTA-STS se guarda en caché menos de un día
            severity: warning
            score: "4.7"
            scope: site
            rulesets:
              - mail
            references:
              - https://www.rfc-editor.org/rfc/rfc8461#section-3.2
            rationale: Un max_age inferior a un día hace que los remitentes olviden la política entre mensajes, así que la protección frente a la degradación rara vez se aplica. Solo se comprueba en nombres con una política MTA-STS legible.
            message: el max_age de MTA-STS es {got} segundos, menos de un día, así que los remitentes olvidan la política entre mensajes
          - id: mail/mta-sts-mode/weak
            title: La política MTA-STS no impone TLS
            severity: hint
            score: "0.6"
            scope: site
            rulesets:
              - mail
            references:
              - https://www.rfc-editor.org/rfc/rfc8461#section-5
            rationale: En modo testing o none, los remitentes entregan el correo aunque TLS falle, así que aún puede interceptarse. Solo se comprueba en nombres con una política MTA-STS legible.
            message: la política MTA-STS está en modo {got}, así que los remitentes entregan aunque falle TLS
          - id: mail/mta-sts-mx/mismatch
            title: La política MTA-STS no cubre todos los servidores de correo
            severity: warning
            score: "4.8"
            scope: site
            rulesets:
              - mail
            references:
              - https://www.rfc-editor.org/rfc/rfc8461#section-4.1
            rationale: Los remitentes que aplican la política se niegan a entregar a un servidor de correo que no figura en ella, así que el correo hacia ese servidor se pierde. Solo se comprueba en nombres con una política MTA-STS legible.
            message: "la política MTA-STS no cubre ningún patrón mx: para un intercambiador, así que los remitentes que la aplican se niegan a entregarle ({got})"
          - id: mail/mta-sts-policy/unreachable
            title: No se puede leer el archivo de política MTA-STS
            severity: warning
            score: "5.4"
            scope: site
            rulesets:
              - mail
            references:
              - https://www.rfc-editor.org/rfc/rfc8461#section-3.2
            rationale: Los remitentes ignoran la política cuando el archivo no responde 200 como texto plano o no se puede analizar, así que el correo no queda protegido frente a una degradación. Solo se comprueba en nombres con un registro MTA-STS.
            message: el archivo de política MTA-STS no responde 200 como text/plain o no se interpreta, así que los remitentes lo ignoran ({got})
          - id: mail/mta-sts/invalid
            title: El registro MTA-STS incumple la sintaxis de MTA-STS
            severity: warning
            score: "5.5"
            scope: site
            rulesets:
              - mail
            references:
              - https://www.rfc-editor.org/rfc/rfc8461#section-3.1
            rationale: Los remitentes ignoran un registro _mta-sts mal formado y su política, así que el correo no queda protegido frente a una degradación a texto plano. Solo se comprueba en nombres que reciben o envían correo.
            message: el registro _mta-sts incumple la gramática de la RFC 8461, así que los remitentes ignoran la política ({got})
          - id: mail/mta-sts/missing
            title: El nombre no tiene política MTA-STS
            severity: info
            score: "2.0"
            scope: site
            rulesets:
              - mail
            references:
              - https://www.rfc-editor.org/rfc/rfc8461
            rationale: Sin MTA-STS, los remitentes entregan sobre STARTTLS que un atacante en la ruta puede eliminar, de modo que el correo puede leerse o alterarse en tránsito. Solo se comprueba en nombres que reciben o envían correo.
            message: no hay registro MTA-STS, así que los remitentes entregan sobre STARTTLS, que un atacante en la ruta puede eliminar
          - id: mail/mx-address/missing
            title: Un servidor de correo de un registro MX no tiene dirección
            severity: warning
            score: "5.9"
            scope: site
            rulesets:
              - mail
              - mail:recommended
              - server
            references:
              - https://www.rfc-editor.org/rfc/rfc5321#section-5.1
            rationale: Un servidor sin registro A ni AAAA no se puede alcanzar, así que el correo hacia él rebota o espera en las colas de los remitentes. Solo se comprueba en nombres que reciben o envían correo.
            message: un intercambiador MX no tiene registro A ni AAAA, así que el correo hacia él rebota ({got})
          - id: mail/mx-cname/present
            title: Un servidor de correo de un registro MX es un CNAME
            severity: warning
            score: "5.6"
            scope: site
            rulesets:
              - mail
              - mail:recommended
              - server
            references:
              - https://www.rfc-editor.org/rfc/rfc2181#section-10.3
            rationale: La RFC 2181 prohíbe que el destino de un MX sea un alias, y algunos remitentes se niegan a entregarle correo, de modo que este se pierde o se retrasa. Solo se comprueba en nombres que reciben o envían correo.
            message: un intercambiador MX es un CNAME, que la RFC 2181 prohíbe y algunos remitentes rechazan ({got})
          - id: mail/mx-literal/present
            title: Un servidor de correo de un registro MX es una dirección IP
            severity: warning
            score: "5.7"
            scope: site
            rulesets:
              - mail
              - mail:recommended
              - server
            references:
              - https://www.rfc-editor.org/rfc/rfc7505#section-3
            rationale: Un MX debe indicar un nombre de host, así que los remitentes no pueden usar una dirección IP y el correo hacia ella rebota. Solo se comprueba en nombres que reciben o envían correo.
            message: un intercambiador MX es una dirección IP, no un nombre, así que los remitentes no pueden usarlo ({got})
          - id: mail/mx/duplicate
            title: El conjunto MX lista el mismo servidor de correo más de una vez
            severity: warning
            score: "3.3"
            scope: site
            rulesets:
              - mail
              - mail:recommended
              - server
            references:
              - https://www.rfc-editor.org/rfc/rfc5321#section-5.1
            rationale: Las entradas repetidas no aportan nada y delatan un error de copia, y un remitente que reintenta cada entrada pierde tiempo con el mismo servidor caído. Solo se comprueba en nombres que reciben o envían correo.
            message: el conjunto MX nombra un intercambiador más de una vez ({got})
          - id: mail/smtp-banner/mismatch
            title: El nombre de saludo de un servidor de correo difiere de su DNS inverso
            severity: info
            score: "1.2"
            scope: site
            rulesets:
              - mail
            references:
              - https://www.rfc-editor.org/rfc/rfc5321#section-4.3.1
            rationale: Cuando el banner 220 nombra un host que el registro PTR de la dirección no nombra, algunos receptores puntúan como spam el correo del servidor. Solo se comprueba cuando la comprobación STARTTLS está activada.
            message: el banner 220 de un intercambiador nombra un host que el PTR de su dirección no nombra, algo que algunos receptores puntúan como spam ({got})
          - id: mail/spf-after-all/unused
            title: El registro SPF lista mecanismos después de all
            severity: warning
            score: "5.1"
            scope: site
            rulesets:
              - mail
            references:
              - https://www.rfc-editor.org/rfc/rfc7208#section-5.1
            rationale: Los receptores se detienen en all y nunca leen lo que sigue, así que los servidores allí listados no quedan autorizados y su correo falla la comprobación. Solo se comprueba en nombres con un registro SPF válido.
            message: SPF lista mecanismos después de all, que los receptores nunca alcanzan ({got})
          - id: mail/spf-include/broken
            title: El registro SPF incluye un nombre que no tiene registro SPF
            severity: warning
            score: "5.0"
            scope: site
            rulesets:
              - mail
              - mail:recommended
              - server
            references:
              - https://www.rfc-editor.org/rfc/rfc7208#section-5.2
            rationale: Los receptores tratan un include o redirect hacia un nombre sin un único registro SPF como un error permanente, así que toda la comprobación falla y el correo legítimo puede rechazarse. Solo se comprueba en nombres con un registro SPF válido.
            message: SPF incluye o redirige a un nombre sin un único registro SPF, un error permanente para los receptores ({got})
          - id: mail/spf-lookups/excessive
            title: El registro SPF necesita más de 10 consultas DNS
            severity: warning
            score: "5.8"
            scope: site
            rulesets:
              - mail
              - mail:recommended
              - server
            references:
              - https://www.rfc-editor.org/rfc/rfc7208#section-4.6.4
            rationale: La RFC 7208 limita SPF a 10 consultas contando cada include, así que los receptores hacen fallar la comprobación y el correo legítimo puede rechazarse o ir a spam. Solo se comprueba en nombres que reciben o envían correo con un registro SPF válido.
            message: SPF necesita {got} consultas DNS contando sus include, más de las 10 que permite la RFC 7208, así que los receptores lo hacen fallar
          - id: mail/spf-ptr/deprecated
            title: El registro SPF usa el mecanismo ptr, desaconsejado
            severity: warning
            score: "4.9"
            scope: site
            rulesets:
              - mail
            references:
              - https://www.rfc-editor.org/rfc/rfc7208#section-5.5
            rationale: La RFC 7208 indica no usar ptr porque es lento y poco fiable, así que los receptores pueden agotar el tiempo o hacer fallar la comprobación y el correo legítimo puede perderse. Solo se comprueba en nombres con un registro SPF válido.
            message: SPF usa el mecanismo ptr, que la RFC 7208 desaconseja por ser lento y poco fiable
          - id: mail/spf-void-lookups/excessive
            title: El registro SPF hace demasiadas consultas que no encuentran nada
            severity: warning
            score: "5.2"
            scope: site
            rulesets:
              - mail
              - mail:recommended
              - server
            references:
              - https://www.rfc-editor.org/rfc/rfc7208#section-4.6.4
            rationale: La RFC 7208 permite dos consultas sin resultado, así que los receptores hacen fallar la comprobación cuando un include obsoleto apunta a un nombre que ya no existe, y el correo legítimo puede rechazarse. Solo se comprueba en nombres con un registro SPF válido.
            message: SPF hace {got} consultas que no encuentran nada, más de las 2 que permite la RFC 7208, así que los receptores lo hacen fallar
          - id: mail/spf/invalid
            title: El registro SPF incumple la sintaxis de SPF
            severity: warning
            score: "6.2"
            scope: site
            rulesets:
              - mail
              - mail:recommended
              - server
            references:
              - https://www.rfc-editor.org/rfc/rfc7208#section-12
            rationale: Los receptores tratan un registro SPF mal formado como un error permanente y lo ignoran, de modo que el correo del nombre deja de estar protegido contra la falsificación y el legítimo puede marcarse como sospechoso. Solo se comprueba en nombres que reciben o envían correo.
            message: el registro SPF incumple la gramática de la RFC 7208, así que los receptores lo tratan como un error permanente y lo ignoran ({got})
          - id: mail/spf/redundant
            title: El registro SPF repite un término o tiene una redirección inútil
            severity: info
            score: "1.4"
            scope: site
            rulesets:
              - mail
            references:
              - https://www.rfc-editor.org/rfc/rfc7208#section-6.1
            rationale: Los mecanismos repetidos malgastan el presupuesto de 10 consultas, y una redirección que all hace inalcanzable confunde a quien mantiene el registro, de modo que se rompe con más facilidad. Solo se comprueba en nombres con un registro SPF válido.
            message: SPF repite un mecanismo, o lleva un redirect que all vuelve inalcanzable ({got})
          - id: mail/starttls-certificate/invalid
            title: El certificado STARTTLS de un servidor de correo no es válido para su nombre
            severity: warning
