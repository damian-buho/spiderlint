            rationale: Una clave EC ofrece la misma seguridad con un certificado más pequeño y un handshake más rápido, lo que acelera la primera carga de cada conexión. Solo se revisan las respuestas HTTPS.
            message: el certificado lleva una clave RSA, cuando una clave EC hace un handshake más pequeño
