            rationale: Cuando caduca, los navegadores bloquean el sitio con una advertencia de seguridad, así que una renovación olvidada lo deja fuera de servicio para la mayoría de los visitantes. Solo en páginas HTTPS con un certificado aún vigente.
            message: el certificado vence en menos de 14 días
          - id: tls/certificate/invalid
            title: El certificado del sitio no es de confianza
