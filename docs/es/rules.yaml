            rationale: Los navegadores ignoran un encabezado que no pueden interpretar, así que la página no queda aislada de las ventanas de otros sitios. Solo se revisan los documentos HTML que lo envían.
            message: Cross-Origin-Opener-Policy rompe su gramática de campo estructurado, así que los navegadores la ignoran
          - id: http/coop/missing
            title: La página no envía Cross-Origin-Opener-Policy
            severity: info
            score: "2.2"
            scope: page
            rulesets:
              - security-headers
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Headers/Cross-Origin-Opener-Policy
            rationale: Sin él, las ventanas abiertas desde otros sitios conservan un vínculo con la página, lo que les permite sondearla mediante canales laterales. Solo se revisan los documentos HTML.
            message: no hay Cross-Origin-Opener-Policy
          - id: http/coop/weak
            title: Cross-Origin-Opener-Policy es demasiado permisiva
            severity: info
            score: "2.2"
            scope: page
            rulesets:
              - security-headers
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Headers/Cross-Origin-Opener-Policy
            rationale: Solo same-origin y same-origin-allow-popups aíslan la página. Otros valores, como unsafe-none, dejan la página vinculada a ventanas de otros sitios, así que falta el aislamiento que promete el encabezado. Solo se revisan los documentos HTML con un encabezado válido.
            message: Cross-Origin-Opener-Policy debe ser same-origin o same-origin-allow-popups
          - id: http/corp/invalid
            title: Cross-Origin-Resource-Policy no tiene un valor válido
            severity: info
            score: "2.1"
            scope: page
            rulesets:
              - security-headers
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Headers/Cross-Origin-Resource-Policy
            rationale: Los navegadores ignoran un valor desconocido, así que el recurso sigue abierto a otros sitios. Solo se revisan las respuestas que envían el encabezado.
            message: Cross-Origin-Resource-Policy debe ser same-origin, same-site o cross-origin
          - id: http/corp/missing
            title: En la respuesta falta Cross-Origin-Resource-Policy
            severity: info
            score: "2.1"
            scope: page
            rulesets:
              - security-headers
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Headers/Cross-Origin-Resource-Policy
            rationale: Sin él, cualquier otro sitio puede incrustar el recurso, lo que puede filtrar su contenido por canales laterales o permitir que otros lo usen gratis.
            message: no hay Cross-Origin-Resource-Policy
          - id: http/csp-base-uri/missing
            title: Content-Security-Policy carece de base-uri
            severity: info
            score: "2.6"
            scope: page
            rulesets:
              - security-headers
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Headers/Content-Security-Policy/base-uri
            rationale: Un atacante que pueda inyectar una etiqueta base puede redirigir todos los scripts y enlaces relativos a su propio servidor. Solo se revisan los documentos HTML que envían una política.
            message: Content-Security-Policy no tiene base-uri, así que un <base> inyectado puede redirigir scripts relativos
          - id: http/csp-frame-ancestors/missing
            title: Content-Security-Policy carece de frame-ancestors
            severity: info
            score: "2.9"
            scope: page
            rulesets:
              - security-headers
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Headers/Content-Security-Policy/frame-ancestors
            rationale: Cualquier otro sitio puede entonces enmarcar la página, lo que permite el clickjacking, en el que se engaña a los visitantes para que pulsen controles ocultos. La directiva solo funciona en un encabezado, no en una etiqueta meta. Solo se revisan los documentos HTML que envían una política.
            message: Content-Security-Policy no tiene frame-ancestors, que solo puede llevar una cabecera
          - id: http/csp-object-src/weak
            title: Content-Security-Policy no fija object-src en none
            severity: warning
            score: "5.5"
            scope: page
            rulesets:
              - security-headers
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Headers/Content-Security-Policy/object-src
            rationale: Los plugins y objetos incrustados aún pueden cargarse, lo que da a los atacantes una vía antigua para ejecutar código en la página. Solo se revisan los documentos HTML que envían una política.
            message: Content-Security-Policy debe fijar object-src 'none'
          - id: http/csp-script-src/insecure
            title: Content-Security-Policy confía en scripts de cualquier host
            severity: warning
            score: "6.1"
            scope: page
            rulesets:
              - security-headers
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Headers/Content-Security-Policy/Sources
            rationale: Una fuente * o solo de esquema, como https:, permite cargar scripts de cualquier sitio, así que al atacante le basta alojar un script en cualquier parte para ejecutarlo. Solo se revisan los documentos HTML que envían una política.
            message: Content-Security-Policy carga scripts de cualquier host mediante una fuente * o solo de esquema
          - id: http/csp-script-src/missing
            title: Content-Security-Policy no restringe los scripts
            severity: warning
            score: "6.3"
            scope: page
            rulesets:
              - security-headers
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Headers/Content-Security-Policy/script-src
            rationale: Sin script-src ni default-src, puede ejecutarse cualquier script de cualquier origen, así que la política no protege contra scripts inyectados. Solo se revisan los documentos HTML que envían una política.
            message: Content-Security-Policy no fija script-src ni default-src, así que se carga cualquier script
          - id: http/csp-trusted-types/missing
            title: Content-Security-Policy no exige Trusted Types
            severity: info
            score: "2.4"
            scope: page
            rulesets:
              - security-headers
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Headers/Content-Security-Policy/require-trusted-types-for
            rationale: Sin Trusted Types, un script puede pasar texto no confiable a funciones peligrosas del navegador y abrir la página al cross-site scripting basado en DOM. Solo se revisan los documentos HTML que envían una política.
            message: Content-Security-Policy no tiene require-trusted-types-for 'script'
          - id: http/csp-unsafe-eval/present
            title: Content-Security-Policy permite eval()
            severity: warning
            score: "6.0"
            scope: page
            rulesets:
              - security-headers
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Headers/Content-Security-Policy/script-src#unsafe_eval_expressions
            rationale: Con ’unsafe-eval’, se ejecuta el texto convertido en código en tiempo de ejecución, lo que da a un atacante que controle ese texto una vía para ejecutar scripts. Solo se revisan los documentos HTML que envían una política.
            message: Content-Security-Policy permite eval() con 'unsafe-eval'
          - id: http/csp-unsafe-inline/present
            title: Content-Security-Policy permite scripts en línea
            severity: warning
            score: "6.2"
            scope: page
            rulesets:
              - security-headers
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Headers/Content-Security-Policy/script-src#unsafe_inline_script
            rationale: Con ’unsafe-inline’, se ejecuta cualquier script que un atacante inyecte en la página, así que la política deja de frenar el cross-site scripting. Solo se revisan los documentos HTML que envían una política.
            message: Content-Security-Policy permite scripts en línea con 'unsafe-inline' y sin nonce ni hash
          - id: http/csp-upgrade-insecure/missing
            title: Content-Security-Policy no tiene upgrade-insecure-requests
            severity: warning
            score: "5.3"
            scope: page
            rulesets:
              - security-headers
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Headers/Content-Security-Policy/upgrade-insecure-requests
            rationale: Sin la directiva, un enlace o recurso http:// olvidado en una página HTTPS se carga de forma insegura y los atacantes de la red pueden leerlo o alterarlo. Solo se revisan los documentos HTTPS que envían una política.
            message: Content-Security-Policy no tiene upgrade-insecure-requests
          - id: http/csp/invalid
            title: El encabezado Content-Security-Policy está mal formado
            severity: warning
            score: "5.9"
            scope: page
            rulesets:
              - security-headers
            references:
              - https://www.w3.org/TR/CSP3/#framework-directives
            rationale: Los navegadores descartan las directivas que no pueden leer, así que parte de la política, o toda, puede no aplicarse. Solo se revisan los documentos HTML que envían una política.
            message: Content-Security-Policy incumple CSP 3, y los navegadores descartan lo que no pueden leer
          - id: http/csp/missing
            title: La página no tiene una Content-Security-Policy aplicada
            severity: warning
            score: "6.4"
            scope: page
            rulesets:
              - security-headers
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/CSP
            rationale: Sin política, un script inyectado se ejecuta con todos los derechos de la página, así que un solo fallo de cross-site scripting puede robar sesiones o datos. Solo se revisan los documentos HTML y cuenta una política en una etiqueta meta.
            message: no hay Content-Security-Policy aplicada, ni en cabecera ni en <meta>
          - id: http/date/invalid
            title: El encabezado Date no tiene el formato de fecha estándar
            severity: warning
            score: "4.2"
            scope: page
            rulesets:
              - recommended
            references:
              - https://www.rfc-editor.org/rfc/rfc9110#section-5.6.7
            rationale: Las cachés y los clientes que no pueden interpretar Date recurren a adivinar la antigüedad de la respuesta, lo que rompe el cálculo de frescura. HTTP exige la forma fija en GMT, como Sun, 06 Nov 1994 08:49:37 GMT. Solo se revisan las respuestas que envían Date.
            message: Date debe ser una IMF-fixdate
          - id: http/date/mismatch
            title: El reloj del servidor difiere del nuestro
            severity: warning
            score: "dynamic: -3600 → 6.8, -60 → 3.4, 60 → 3.4, 3600 → 6.8"
            scope: site
            rulesets:
              - recommended
            references:
              - https://www.rfc-editor.org/rfc/rfc9110#section-6.6.1
            rationale: Un reloj desajustado en minutos puede romper la validez de los certificados, los tokens firmados, la frescura de la caché y la correlación de registros; una hora o más es un error. Se omite cuando todos los hosts están desajustados por igual, lo que apunta a la máquina que comprueba.
          - id: http/date/missing
            title: La respuesta no tiene encabezado Date
            severity: warning
            score: "4.2"
            scope: page
            rulesets:
              - recommended
            references:
              - https://www.rfc-editor.org/rfc/rfc9110#section-5.6.7
            rationale: Sin Date, las cachés no pueden calcular la antigüedad de una respuesta, así que pueden servir contenido obsoleto o almacenarlo mal. Los clientes que comparan relojes también pierden una referencia.
            message: no hay cabecera Date
          - id: http/deprecation/invalid
            title: El encabezado Deprecation no es @ seguido de segundos Unix
            severity: warning
            score: "3.6"
            scope: page
            rulesets:
              - performance
            references:
              - https://www.rfc-editor.org/rfc/rfc9745
            rationale: Los clientes que no pueden leer el valor no avisarán de que el recurso está obsoleto. Solo se revisan las respuestas que envían Deprecation.
            message: Deprecation debe ser @ y segundos Unix
          - id: http/digest/missing
            title: La respuesta no tiene ni Content-Digest ni Repr-Digest
            severity: hint
            score: "0.6"
            scope: page
            rulesets:
              - suggestions
            references:
              - https://www.rfc-editor.org/rfc/rfc9530
            rationale: Sin un resumen, un cliente o intermediario no puede verificar que el cuerpo llegó íntegro y sin alteraciones. Es un refuerzo opcional para las páginas HTML que responden 2xx.
            message: sin Content-Digest ni Repr-Digest un cliente no puede comprobar el cuerpo
          - id: http/early-hints-preload/mismatch
            title: Una precarga de las pistas tempranas 103 falta en la respuesta final
            severity: info
            score: "1.8"
            scope: page
            rulesets:
              - performance
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Status/103
            rationale: El navegador empieza a descargar lo que anunció la pista temprana, pero la respuesta final ya no lo pide, así que la descarga temprana se desperdicia o el recurso llega tarde. Solo se comprueban las respuestas que enviaron un 103.
          - id: http/frame-options/missing
            title: Otros sitios pueden incrustar la página en un marco
            severity: info
            score: "3.0"
            scope: page
            rulesets:
              - security-headers
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Headers/Content-Security-Policy/frame-ancestors
            rationale: Una página del atacante puede cargar esta en un marco oculto y engañar a los visitantes para que pulsen sus botones (clickjacking). Una directiva frame-ancestors en Content-Security-Policy, o X-Frame-Options con DENY o SAMEORIGIN, lo impide.
          - id: http/header/deprecated
            title: La página envía cabeceras que ningún navegador actual lee
            severity: info
            score: "1.2"
            scope: page
            rulesets:
              - security-headers
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Headers
            rationale: X-XSS-Protection, Expect-CT, Public-Key-Pins, Feature-Policy, P3P y Report-To son lastre en cada respuesta, y algunas dan una falsa sensación de protección. Report-To se deja en paz mientras NEL aún lo lee.
          - id: http/host/inconsistent
            title: Las páginas de un mismo host difieren en certificado, versión de TLS o servidor
            severity: info
            score: "2.8"
            scope: site
            rulesets:
              - recommended
            rationale: Que las páginas de un host respondan desde servidores configurados de forma distinta suele indicar un balanceador mal configurado o una migración a medias, de modo que algunos visitantes reciben una versión de TLS más antigua o un certificado obsoleto. La dirección del servidor no se compara detrás de una CDN que se identifica en Server.
          - id: http/hsts-subdomains/missing
            title: Strict-Transport-Security omite includeSubDomains
            severity: info
            score: "2.5"
            scope: page
            rulesets:
              - security-headers
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Headers/Strict-Transport-Security#includesubdomains
            rationale: Sin él, los subdominios no se fuerzan a HTTPS, así que un atacante puede usar un subdominio inseguro para capturar las cookies del sitio principal. Solo se revisan las respuestas HTTPS con un encabezado válido.
            message: Strict-Transport-Security debe llevar includeSubDomains
          - id: http/hsts/invalid
            title: El encabezado Strict-Transport-Security está mal formado
            severity: warning
            score: "5.6"
            scope: page
            rulesets:
              - security-headers
            references:
              - https://www.rfc-editor.org/rfc/rfc6797#section-6.1
            rationale: Los navegadores ignoran un encabezado que no pueden interpretar, así que la protección de solo HTTPS nunca se activa. Solo se revisan las respuestas que lo envían.
            message: Strict-Transport-Security incumple la RFC 6797 §6.1, así que los navegadores la ignoran
          - id: http/hsts/missing
            title: El sitio no envía Strict-Transport-Security
            severity: warning
            score: "5.8"
            scope: page
            rulesets:
              - security-headers
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Headers/Strict-Transport-Security
            rationale: Sin HSTS, la primera petición de un visitante, o una hecha en una red hostil, puede degradarse a HTTP simple e interceptarse. Solo se revisan las respuestas HTTPS con estado de 200 a 499, salvo 429.
            message: no hay Strict-Transport-Security
          - id: http/hsts/weak
            title: Strict-Transport-Security tiene un max-age corto
            severity: warning
            score: "5.8"
            scope: page
            rulesets:
              - security-headers
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Headers/Strict-Transport-Security
            rationale: Un max-age corto hace que el navegador olvide pronto la regla de solo HTTPS, así que la protección caduca entre visitas y vuelve a funcionar un ataque de degradación. Solo se revisan las respuestas HTTPS con un encabezado válido.
            message: Strict-Transport-Security debe llevar max-age de 1000000 o más
          - id: http/link/invalid
            title: El encabezado Link está mal formado
            severity: warning
            score: "4.6"
            scope: page
            rulesets:
              - performance
            references:
              - https://www.rfc-editor.org/rfc/rfc8288#section-3
            rationale: Los clientes descartan los enlaces que no pueden interpretar, así que las precargas y demás sugerencias que contiene nunca surten efecto. Solo se revisan las respuestas que envían Link.
            message: Link incumple la RFC 8288 §3, así que los clientes descartan los enlaces que no pueden leer
          - id: http/no-store/present
            title: "Cache-Control: no-store deja la página fuera de la caché de ida y vuelta"
            severity: info
            score: "2.4"
            scope: page
            rulesets:
              - performance
            references:
              - https://web.dev/articles/bfcache#minimize-use-of-cache-control-no-store
            rationale: Los navegadores no guardan una página no-store para la navegación instantánea hacia atrás y hacia delante, así que esos movimientos la recargan y se sienten más lentos. Solo se revisan las páginas HTML que envían Cache-Control.
            message: Cache-Control no-store deja la página fuera de la caché de ir atrás/adelante
          - id: http/no-vary-search/missing
            title: Una URL con consulta no tiene No-Vary-Search
            severity: hint
            score: "0.4"
            scope: page
            rulesets:
              - suggestions
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Headers/No-Vary-Search
            rationale: Sin él, las cachés tratan cada variante de la cadena de consulta como una página distinta, así que los parámetros de seguimiento causan fallos de caché y recargas innecesarias. Solo se revisan las páginas HTML 2xx que tienen consulta.
            message: una URL con consulta no tiene No-Vary-Search que indique qué parámetros cambian la página
          - id: http/permissions-policy/invalid
            title: El encabezado Permissions-Policy está mal formado
            severity: warning
            score: "3.7"
            scope: page
            rulesets:
              - security-headers
            references:
              - https://www.w3.org/TR/permissions-policy/#permissions-policy-http-header-field
            rationale: Los navegadores ignoran un encabezado que no pueden interpretar, así que las funciones que debía restringir siguen disponibles para la página y sus marcos. Solo se revisan los documentos HTML que lo envían.
            message: Permissions-Policy rompe su gramática de campo estructurado, así que los navegadores la ignoran
          - id: http/permissions-policy/missing
            title: La página no envía ninguna Permissions-Policy que nombre una función
            severity: info
            score: "1.8"
            scope: page
            rulesets:
              - security-headers
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Headers/Permissions-Policy
            rationale: Sin política, la página y cada marco incrustado pueden usar funciones potentes del navegador, como cámara, micrófono o ubicación, salvo que el navegador lo impida. Solo se revisan los documentos HTML.
            message: ninguna cabecera Permissions-Policy nombra una función
          - id: http/priority/invalid
            title: El encabezado Priority está mal formado
            severity: warning
            score: "3.8"
            scope: page
            rulesets:
              - performance
            references:
              - https://www.rfc-editor.org/rfc/rfc9218#section-5
            rationale: Los clientes ignoran un encabezado que no pueden interpretar, así que la indicación de urgencia de la respuesta no tiene efecto. Solo se revisan las respuestas que envían Priority.
            message: Priority rompe su gramática de campo estructurado, así que los clientes la ignoran
          - id: http/referrer-policy/insecure
            title: Referrer-Policy filtra URL completas a otros sitios
            severity: warning
            score: "5.1"
            scope: page
            rulesets:
              - security-headers
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Headers/Referrer-Policy
            rationale: Los valores unsafe-url y no-referrer-when-downgrade envían la dirección completa, con la cadena de consulta, a otros sitios, lo que puede exponer datos privados. Solo se revisan las respuestas con un encabezado válido.
            message: Referrer-Policy no debe filtrar URLs completas
          - id: http/referrer-policy/invalid
            title: El encabezado Referrer-Policy contiene un valor desconocido
            severity: warning
            score: "4.0"
            scope: page
            rulesets:
              - security-headers
            references:
              - https://www.w3.org/TR/referrer-policy/#referrer-policy-header
            rationale: Los navegadores ignoran los valores que no conocen y pueden recurrir a una política que filtre más de la URL de lo previsto. Solo se revisan las respuestas que lo envían.
            message: Referrer-Policy incumple los tokens de Referrer Policy
          - id: http/referrer-policy/missing
            title: La respuesta no envía Referrer-Policy
            severity: warning
            score: "5.1"
            scope: page
            rulesets:
              - security-headers
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Headers/Referrer-Policy
            rationale: Sin política, los navegadores deciden qué enviar, y las URL completas de las páginas, que pueden contener datos privados, pueden filtrarse a otros sitios cuando los visitantes siguen enlaces.
            message: no hay Referrer-Policy
          - id: http/reporting-endpoints/invalid
            title: El encabezado Reporting-Endpoints está mal formado
            severity: warning
            score: "3.4"
            scope: page
            rulesets:
              - security-headers
            references:
              - https://www.w3.org/TR/reporting-1/#header
            rationale: Los navegadores ignoran un encabezado que no pueden interpretar, así que nunca se envían informes de infracciones ni fallos. Solo se revisan las respuestas que lo envían.
            message: Reporting-Endpoints rompe su gramática de campo estructurado, así que los navegadores la ignoran
          - id: http/reporting-endpoints/missing
            title: La respuesta no nombra ningún Reporting-Endpoints
            severity: info
            score: "1.5"
            scope: page
            rulesets:
              - security-headers
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Headers/Reporting-Endpoints
            rationale: Sin un endpoint, los navegadores no pueden informar de infracciones de políticas, fallos ni obsolescencias, así que el propietario nunca se entera de los problemas que sufren los visitantes.
            message: ninguna cabecera Reporting-Endpoints nombra un endpoint
          - id: http/retry-after/invalid
            title: El encabezado Retry-After está mal formado
            severity: warning
            score: "4.1"
            scope: page
            rulesets:
              - performance
            references:
              - https://www.rfc-editor.org/rfc/rfc9110#section-10.2.3
            rationale: Los clientes no pueden saber cuándo reintentar, así que reintentan de inmediato o desisten. Solo se revisan las respuestas que envían Retry-After.
            message: Retry-After incumple la RFC 9110 §10.2.3, así que los clientes no saben cuándo reintentar
          - id: http/retry-after/missing
            title: Una respuesta 503 no indica cuándo reintentar
            severity: warning
            score: "4.8"
            scope: page
            rulesets:
              - performance
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Headers/Retry-After
            rationale: Sin Retry-After, los clientes y rastreadores reintentan de inmediato o desisten, lo que añade carga a un servidor que ya está en apuros o saca el sitio de los resultados. Solo se revisan las respuestas 503.
            message: una respuesta 503 debe indicar cuándo reintentar con Retry-After
          - id: http/retry-after/weak
            title: Retry-After pide a los clientes volver demasiado pronto
            severity: info
            score: "dynamic: 0 → 3.0, 9 → 1.2"
            scope: page
            rulesets:
              - performance
            references:
              - https://www.rfc-editor.org/rfc/rfc9110#section-10.2.3
            rationale: Una espera de menos de 10 segundos devuelve a los clientes directamente a un servidor que ya está descartando carga, lo que lo mantiene sobrecargado. Solo se revisan las respuestas 429 y 503 con un Retry-After legible.
            message: Retry-After pide a los clientes volver demasiado pronto, lo que devuelve la carga de inmediato a un servidor que intenta descargarla
          - id: http/server-timing/missing
            title: Un sitio de desarrollo o preproducción no envía Server-Timing
            severity: hint
            score: "0.2"
            scope: page
            rulesets:
              - suggestions
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Headers/Server-Timing
            rationale: Sin él, los desarrolladores y las herramientas del navegador no pueden ver dónde gastó el tiempo el servidor. Solo se revisan los sitios declarados como de desarrollo o preproducción.
            message: ninguna cabecera Server-Timing muestra dónde gastó el servidor su tiempo
          - id: http/server/disclosing
            title: El servidor revela el software que hay detrás
            severity: warning
            score: "5.0"
            scope: site
            rulesets:
              - security-headers
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Reference/Headers/Server
            rationale: Cabeceras como Server y X-Powered-By, y la etiqueta meta generator, nombran el producto y a menudo su versión, lo que indica a los atacantes qué fallos conocidos probar. No se informa de los nombres que fija una CDN o un alojamiento y que el propietario no puede quitar, y un nombre sin versión es solo una pista.
          - id: http/sunset/invalid
            title: El encabezado Sunset no es una fecha HTTP
            severity: warning
            score: "3.7"
            scope: page
            rulesets:
              - performance
            references:
              - https://www.rfc-editor.org/rfc/rfc8594
            rationale: Los clientes que no pueden leer la fecha no avisarán de que el recurso va a desaparecer. Solo se revisan las respuestas que envían Sunset.
            message: Sunset debe ser una HTTP-date
          - id: http/tdm-reservation/invalid
            title: El encabezado tdm-reservation no es 0 ni 1
            severity: warning
            score: "3.5"
            scope: page
            rulesets:
              - seo
            references:
              - https://www.w3.org/community/reports/tdmrep/CG-FINAL-tdmrep-20240510/
            rationale: Los rastreadores de minería de textos y datos no pueden leer la reserva del sitio, así que pueden extraer contenido que el propietario quería reservar. Solo se revisan las respuestas que envían el encabezado.
            message: tdm-reservation debe ser 0 o 1
          - id: http/use-as-dictionary-match/invalid
            title: Use-As-Dictionary no tiene patrón match
            severity: warning
            score: "3.5"
            scope: page
            rulesets:
              - performance
            references:
              - https://www.rfc-editor.org/rfc/rfc9842#section-2.1
            rationale: Un diccionario sin patrón match nunca se usa en peticiones posteriores, así que no se obtiene la compresión que debía mejorar. Solo se revisan las respuestas que envían Use-As-Dictionary.
            message: Use-As-Dictionary necesita un miembro match="<patrón de URL>"
          - id: http/use-as-dictionary/invalid
            title: El encabezado Use-As-Dictionary está mal formado
            severity: warning
            score: "3.4"
            scope: page
            rulesets:
              - performance
            references:
              - https://www.rfc-editor.org/rfc/rfc9842#section-2.1
            rationale: Los clientes ignoran un encabezado que no pueden interpretar, así que el diccionario nunca se usa y se pierde la ganancia de compresión. Solo se revisan las respuestas que envían Use-As-Dictionary.
            message: Use-As-Dictionary rompe su gramática de campo estructurado, así que los clientes la ignoran
          - id: http/validator/missing
            title: La respuesta no tiene ETag ni Last-Modified
            severity: info
            score: "2.6"
            scope: page
            rulesets:
              - performance
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Caching#validation
            rationale: Sin un validador, el navegador no puede preguntar si su copia guardada sigue vigente, así que vuelve a descargar toda la respuesta cuando la copia caduca. Solo se revisan las respuestas 2xx.
            message: no hay ETag ni Last-Modified con que revalidar
          - id: http/vary-accept-encoding/missing
            title: "Una respuesta comprimida carece de Vary: Accept-Encoding"
            severity: warning
            score: "5.4"
            scope: page
            rulesets:
              - performance
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Headers/Vary
            rationale: Sin él, una caché compartida o una CDN puede guardar la copia comprimida y entregarla a un cliente que no la sabe descomprimir, o al revés. Solo se revisan las respuestas que declaran Content-Encoding.
            message: "una respuesta comprimida debe llevar Vary: Accept-Encoding"
          - id: http/vary-star/present
            title: "Vary: * hace la respuesta no almacenable en caché"
            severity: warning
            score: "5.6"
            scope: page
            rulesets:
              - performance
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Headers/Vary
            rationale: Un Vary con * indica a las cachés que cada petición es distinta, así que navegadores y CDN no pueden reutilizar la respuesta y cada visita llega al servidor. Solo se revisan las respuestas que envían un encabezado Vary.
            message: "Vary: * hace la respuesta no almacenable en caché"
          - id: http/vary/invalid
            title: El encabezado Vary está mal formado
            severity: warning
            score: "4.2"
            scope: page
            rulesets:
              - performance
            references:
              - https://www.rfc-editor.org/rfc/rfc9110#section-12.5.5
            rationale: Las cachés que no pueden leer Vary pueden servir a un visitante la variante equivocada de una página, como el idioma o la compresión incorrectos. Solo se revisan las respuestas que envían Vary.
            message: Vary incumple la RFC 9110 §12.5.5
          - id: http/version/outdated
            title: El servidor responde por HTTP/1.1 en vez de HTTP/2 o HTTP/3
            severity: warning
            score: "5.8"
            scope: page
            rulesets:
              - performance
            references:
              - https://developer.mozilla.org/docs/Glossary/HTTP_2
            rationale: HTTP/1.1 carga los recursos de forma menos eficiente, así que las páginas tardan más en aparecer, sobre todo en conexiones lentas o con pérdidas. Solo se revisan las respuestas que informan de su versión de protocolo.
            message: el servidor debe hablar HTTP/2 o HTTP/3
          - id: http/x-xss-protection/insecure
            title: X-XSS-Protection está activado
            severity: warning
            score: "4.5"
            scope: page
            rulesets:
              - security-headers
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Headers/X-XSS-Protection
            rationale: El antiguo filtro del navegador que activa este encabezado puede introducir por sí mismo fallos de cross-site scripting, así que el encabezado debería estar ausente o en 0. Solo se revisan las respuestas que lo envían.
            message: X-XSS-Protection debe estar ausente o ser 0
          - id: i18n/content-language/mismatch
            title: Content-Language y lang nombran idiomas distintos
            severity: info
            score: "2.4"
            scope: page
            rulesets:
              - i18n
            references:
              - https://www.w3.org/International/questions/qa-http-and-lang
            rationale: La cabecera y el atributo lang de html discrepan sobre el idioma de la página, así que los navegadores, las herramientas de traducción y los buscadores pueden elegir el equivocado. Las páginas que carecen de alguno de los dos se omiten.
          - id: i18n/hreflang-return/missing
            title: Una versión de idioma no enlaza de vuelta
            severity: warning
            score: "5.2"
            scope: site
            rulesets:
              - i18n
            references:
              - https://developers.google.com/search/docs/specialty/international/localized-versions#html
            rationale: Hreflang solo funciona cuando las versiones se nombran entre sí, así que sin el enlace de vuelta los buscadores pueden ignorar la anotación y los visitantes llegan al idioma equivocado. Solo se juzgan las páginas rastreadas que responden 2xx.
          - id: i18n/hreflang/unreachable
            title: Un enlace hreflang apunta a una página que falla o redirige
            severity: warning
            score: "5.6"
            scope: site
            rulesets:
              - i18n
            references:
              - https://developers.google.com/search/docs/specialty/international/localized-versions#html
            rationale: Los buscadores ignoran los destinos hreflang que responden con un error o una redirección, así que esa versión de idioma nunca se ofrece a sus lectores. Se informa de los destinos que responden fuera de 2xx o que redirigen.
          - id: i18n/metadata-language/mismatch
            title: El título o la descripción están en un idioma distinto del que declara la página
            severity: info
            score: "2.8"
            scope: page
            rulesets:
              - i18n
            references:
              - https://www.w3.org/International/questions/qa-html-language-declarations
            rationale: Los lectores de pantalla pronuncian el texto según el atributo lang y los buscadores lo usan para elegir la audiencia, así que una discrepancia estropea la locución y puede mostrar la página a lectores equivocados. Solo se juzga cuando la detección de idioma es fiable.
          - id: icons/apple-touch/missing
            title: Falta el icono táctil de Apple o no es adecuado
            severity: warning
            score: "3.8"
            scope: site
            rulesets:
              - icons
              - recommended
            references:
              - https://developer.apple.com/library/archive/documentation/AppleApplications/Reference/SafariWebContent/ConfiguringWebApplications/ConfiguringWebApplications.html
            rationale: Los visitantes de iPhone y iPad que añaden el sitio a su pantalla de inicio obtienen una captura o un mosaico vacío en lugar del logotipo.
            message: "falta el icono táctil de Apple o no es apto: {got}"
          - id: icons/declared-size/mismatch
            title: Los iconos no tienen el tamaño o el tipo que declaran
            severity: warning
            score: "4.2"
            scope: site
            rulesets:
              - icons
              - recommended
            references:
              - https://developer.mozilla.org/docs/Web/HTML/Reference/Attributes/sizes
            rationale: Los navegadores eligen un icono por su tamaño y tipo declarados, así que una declaración errónea les hace elegir uno poco adecuado o rechazar el archivo.
            message: "los iconos no tienen el tamaño ni el tipo que declaran: {got}"
          - id: icons/favicon/missing
            title: Falta el favicon o está roto
            severity: warning
            score: "4.6"
            scope: site
            rulesets:
              - icons
              - recommended
            references:
              - https://developers.google.com/search/docs/appearance/favicon-in-search
            rationale: Las pestañas del navegador, los marcadores y los resultados de búsqueda muestran un icono vacío o genérico en lugar del del sitio, lo que lo hace más difícil de reconocer.
            message: "falta el favicon o está roto: {got}"
          - id: icons/mask-icon/invalid
            title: El icono de pestaña fijada de Safari no se puede usar
            severity: off
            score: "3.3"
            scope: site
            rulesets:
              - icons
              - recommended
            references:
              - https://developer.apple.com/library/archive/documentation/AppleApplications/Reference/SafariWebContent/pinnedTabs/pinnedTabs.html
            rationale: Safari dibuja la pestaña fijada con este icono, así que uno roto deja la pestaña en blanco o con un color erróneo. Safari 12 y posteriores usan en su lugar el favicon SVG, por lo que importa poco.
            message: "el icono de pestaña fijada de Safari es inutilizable; desde Safari 12 sirve en su lugar un rel=icon SVG: {got}"
          - id: icons/ms-tile/unreachable
            title: Una imagen de mosaico de Windows o browserconfig.xml está rota
            severity: off
            score: "3.3"
            scope: site
            rulesets:
              - icons
              - recommended
            references:
              - https://learn.microsoft.com/previous-versions/windows/internet-explorer/ie-developer/platform-apis/dn320426(v=vs.85)
            rationale: Un mosaico del menú Inicio de Windows para el sitio muestra una imagen vacía o genérica. Solo importa para el anclado antiguo en Windows, así que el impacto es pequeño.
            message: "una imagen de mosaico de Windows o browserconfig.xml está rota: {got}"
          - id: icons/svg/invalid
            title: No hay un favicon SVG utilizable
            severity: off
            score: "3.3"
            scope: site
            rulesets:
              - icons
              - recommended
            references:
              - https://developer.mozilla.org/docs/Web/HTML/Reference/Attributes/rel#icon
            rationale: Un icono SVG se ve nítido a cualquier tamaño y puede seguir el modo oscuro; sin él los navegadores recurren a un mapa de bits de tamaño fijo.
            message: "no hay un favicon SVG utilizable: {got}"
          - id: images/compression/weak
            title: Una imagen puede recodificarse mucho más pequeña en su propio formato
            severity: warning
            score: "4.8"
            scope: site
            rulesets:
              - images
            references:
              - https://web.dev/articles/use-imagemin-to-compress-images
            rationale: Las imágenes sin optimizar hacen las páginas más pesadas de lo necesario, así que los visitantes con conexiones lentas esperan más. Solo se señalan las imágenes en las que recodificar ahorra una parte apreciable.
          - id: images/dimensions/missing
            title: Las imágenes no tienen atributos width y height
            severity: warning
            score: "5.4"
            scope: page
            rulesets:
              - images
            references:
              - https://web.dev/articles/optimize-cls#images-without-dimensions
            rationale: Sin ellos el navegador no puede reservar espacio, así que la página salta al cargarse cada imagen y los visitantes pierden el hilo de la lectura. También perjudica la puntuación de Cumulative Layout Shift que leen los buscadores.
          - id: images/font-display/missing
            title: Las fuentes web ocultan el texto mientras se cargan
            severity: warning
            score: "5.0"
            scope: site
            rulesets:
              - images:assets
            references:
              - https://developer.mozilla.org/docs/Web/CSS/@font-face/font-display
            rationale: "Un @font-face sin font-display: swap, fallback u optional deja el texto invisible hasta que llega la fuente, así que los visitantes con conexiones lentas ven una página en blanco."
          - id: images/font-format/outdated
            title: Una fuente web se sirve en un formato distinto de WOFF2
            severity: warning
            score: "4.4"
            scope: site
            rulesets:
              - images:assets
            references:
              - https://web.dev/articles/reduce-webfont-size
            rationale: WOFF2 comprime las fuentes mejor que otros formatos y todos los navegadores actuales lo admiten, así que otros formatos obligan a descargar más para el mismo texto.
          - id: images/format/outdated
            title: Una imagen JPEG, PNG o GIF sería más pequeña como WebP o AVIF
            severity: warning
            score: "5.2"
            scope: site
            rulesets:
              - images
            references:
              - https://web.dev/articles/choose-the-right-image-format
            rationale: Los formatos de imagen antiguos cuestan bytes extra a los visitantes en cada visita, lo que ralentiza la carga en conexiones móviles. Solo se señalan las imágenes en las que recodificar ahorra una parte apreciable.
          - id: images/lazy-loading/missing
            title: Las imágenes bajo el pliegue no se cargan de forma diferida
            severity: warning
            score: "4.8"
            scope: page
            rulesets:
              - images:live
            references:
              - https://web.dev/articles/browser-level-image-lazy-loading
            rationale: Las imágenes a las que el visitante aún no ha llegado se descargan igualmente al principio y compiten con el contenido que quiere leer. Solo se juzgan las páginas renderizadas en un navegador.
          - id: images/lazy-loading/slow
            title: Las imágenes de la primera pantalla se cargan de forma diferida
            severity: warning
            score: "5.8"
            scope: page
            rulesets:
              - images:live
            references:
              - https://web.dev/articles/lcp-lazy-loading
            rationale: Una imagen diferida que se ve al llegar empieza a cargarse tarde, lo que retrasa el contenido principal y hace que la página parezca lenta. Solo se juzgan las páginas renderizadas en un navegador.
          - id: images/minification/missing
            title: Una hoja de estilos o un script se sirve sin minificar
            severity: warning
            score: "4.2"
            scope: site
            rulesets:
              - images:assets
            references:
              - https://web.dev/articles/reduce-network-payloads-using-text-compression
            rationale: Los espacios y los nombres largos en CSS y JavaScript añaden bytes que cada visitante descarga antes de que la página pueda mostrarse. Solo se señalan los archivos en los que minificar ahorra una parte apreciable.
          - id: images/rendered-size/large
            title: Las imágenes llevan muchos más píxeles de los que la página muestra
            severity: warning
            score: "4.4"
            scope: page
            rulesets:
              - images:live
            references:
              - https://web.dev/articles/serve-responsive-images
            rationale: Una imagen mucho más ancha que su caja desperdicia ancho de banda y ralentiza la carga, sobre todo en móviles. Las imágenes vectoriales están exentas y solo se juzgan las páginas renderizadas en un navegador.
          - id: images/srcset/large
            title: Las imágenes sin srcset son mucho más anchas de lo que se muestran
            severity: warning
            score: "4.6"
            scope: page
            rulesets:
              - images
            references:
              - https://web.dev/articles/serve-responsive-images
            rationale: Se envía un único archivo grande a todas las pantallas, así que los móviles descargan píxeles que nunca muestran. Solo se comparan las imágenes con un atributo width numérico y sin srcset.
          - id: images/weight/large
            title: Una imagen pesa más que el límite de peso
            severity: warning
            score: "5.6"
            scope: site
            rulesets:
              - images
            references:
              - https://developer.mozilla.org/docs/Learn_web_development/Extensions/Performance/Multimedia
            rationale: Un archivo de imagen muy grande ralentiza la página para todos los visitantes y gasta datos móviles. El límite es un ajuste, 200 kB por defecto.
          - id: insight/number/outlier
            title: Unas pocas páginas son mucho más pesadas o lentas que el resto del sitio
            severity: info
            score: "3.0"
            scope: site
            rulesets:
              - insights
            references:
              - https://www.itl.nist.gov/div898/handbook/eda/section3/eda35h.htm
            rationale: Las páginas cuyo tamaño, número de peticiones, tiempo de carga o estimación de CO2 queda muy por encima de la mediana son lentas para los visitantes y caras en datos móviles. Por defecto se necesitan al menos 20 páginas para comparar.
          - id: insight/value/inconsistent
            title: Unas pocas páginas se sirven de forma distinta al resto del sitio
            severity: info
            score: "2.0"
            scope: site
            rulesets:
              - insights
            rationale: Cuando casi todas las páginas comparten versión de HTTP, codificación de contenido o política de caché y unas pocas difieren, las discordantes suelen ser una ruta mal configurada o una regla olvidada, y los visitantes las reciben más lentas o sin caché. Por defecto se necesitan al menos 20 páginas, con un mismo valor en el 80 % de ellas.
          - id: keyboard/focus-outline/missing
            title: Los elementos enfocados no muestran ningún indicador de foco visible
            severity: warning
            score: "6.0"
            scope: page
            rulesets:
              - keyboard
            references:
              - https://www.w3.org/WAI/WCAG22/Understanding/focus-visible.html
            rationale: Quienes usan el teclado no pueden saber qué control está activo cuando enfocarlo no cambia nada en pantalla. Solo se juzgan las páginas de la muestra, recorridas con la tecla Tab en un navegador.
          - id: keyboard/focus/inaccessible
            title: Un elemento enfocado queda oculto bajo contenido fijo o pegajoso
            severity: warning
            score: "5.8"
            scope: page
            rulesets:
              - keyboard
            references:
              - https://www.w3.org/WAI/WCAG22/Understanding/focus-not-obscured-minimum.html
            rationale: Quienes usan el teclado llegan con Tab a un control que no ven porque una cabecera o un aviso lo tapa. Solo se juzgan las páginas de la muestra, recorridas con la tecla Tab en un navegador.
          - id: keyboard/forced-colors-focus/missing
            title: Los indicadores de foco desaparecen con colores forzados
            severity: warning
            score: "5.4"
            scope: page
            rulesets:
              - keyboard
            references:
              - https://developer.mozilla.org/docs/Web/CSS/@media/forced-colors
            rationale: Un anillo de foco dibujado solo con box-shadow desaparece en el modo de alto contraste de Windows, y quienes usan el teclado pierden el foco. Solo se juzgan las páginas de la muestra, en un navegador.
          - id: keyboard/skip-link/missing
            title: La primera parada de Tab no es un enlace de salto al contenido principal
            severity: info
            score: "2.8"
            scope: page
            rulesets:
              - keyboard
            references:
              - https://www.w3.org/WAI/WCAG22/Techniques/general/G1
            rationale: Quienes usan teclado o lector de pantalla deben recorrer con Tab toda la navegación en cada página antes de llegar al contenido. Solo se juzgan las páginas de la muestra, en un navegador.
          - id: keyboard/tab-order/inaccessible
            title: El foco del teclado queda atrapado u omite elementos interactivos
            severity: warning
            score: "6.4"
            scope: page
            rulesets:
              - keyboard
            references:
              - https://www.w3.org/WAI/WCAG22/Understanding/keyboard.html
            rationale: Quienes no pueden usar el ratón se quedan bloqueados o no llegan a un control. Solo se juzgan las páginas de la muestra, recorridas con la tecla Tab en un navegador.
