            rationale: Los remitentes que usan MTA-STS o DANE rechazan un certificado que no se valida, así que el correo hacia ese servidor se retrasa o rebota. Solo se comprueba cuando la comprobación STARTTLS está activada.
            message: el certificado STARTTLS de un intercambiador no valida para su nombre, así que los remitentes con MTA-STS y DANE lo rechazan ({got})
          - id: mail/starttls/missing
            title: Un servidor de correo no ofrece STARTTLS en el puerto 25
