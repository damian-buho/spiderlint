            score: "6.0"
            scope: site
            rulesets:
              - tls-probe
            references:
              - https://www.rfc-editor.org/rfc/rfc9325#section-3.3
            rationale: La compresión TLS permite el ataque CRIME, con el que un atacante puede leer secretos como las cookies de sesión.
            message: el servidor comprime los registros TLS, por donde CRIME lee secretos
          - id: tls-probe/dh/weak
