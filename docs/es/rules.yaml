            severity: error
            score: "6.6"
            scope: page
            rulesets:
              - html-validate
              - html-validate:standard
            references:
              - https://html-validate.org/rules/attr-spacing.html
          - id: html-validate/attribute-allowed-values
            severity: error
            score: "6.7"
            scope: page
            rulesets:
              - html-validate
              - html-validate:standard
            references:
              - https://html-validate.org/rules/attribute-allowed-values.html
          - id: html-validate/attribute-boolean-style
            title: Require a specific style when writing boolean attributes.
            severity: error
            score: "6.7"
            scope: page
            rulesets:
              - html-validate
            references:
              - https://html-validate.org/rules/attribute-boolean-style.html
          - id: html-validate/attribute-empty-style
            title: Require a specific style for attributes with empty values.
            severity: error
            score: "6.7"
            scope: page
            rulesets:
              - html-validate
            references:
              - https://html-validate.org/rules/attribute-empty-style.html
          - id: html-validate/attribute-misuse
            severity: error
            score: "6.7"
            scope: page
            rulesets:
              - html-validate
              - html-validate:standard
            references:
              - https://html-validate.org/rules/attribute-misuse.html
          - id: html-validate/autocomplete-password
            severity: error
            score: "6.8"
            scope: page
            rulesets:
              - html-validate
            references:
              - https://html-validate.org/rules/autocomplete-password.html
          - id: html-validate/close-attr
            title: HTML disallows end tags to have attributes.
            severity: error
            score: "6.7"
            scope: page
            rulesets:
              - html-validate
              - html-validate:standard
            references:
              - https://html-validate.org/rules/close-attr.html
          - id: html-validate/close-order
            title: HTML requires elements to be closed in the same order as they were opened.
            severity: error
            score: "9.0"
            scope: page
            rulesets:
              - html-validate
              - html-validate:standard
            references:
              - https://html-validate.org/rules/close-order.html
          - id: html-validate/deprecated
            severity: error
            score: "6.6"
            scope: page
            rulesets:
