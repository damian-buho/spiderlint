            references:
              - https://www.rfc-editor.org/rfc/rfc8460#section-3
            rationale: Los remitentes ignoran un registro mal formado, así que no llega ningún informe de entregas TLS fallidas. Solo se comprueba en nombres que reciben o envían correo.
            message: el registro TLS-RPT incumple la gramática de la RFC 8460 ({got})
          - id: mail/tls-rpt/missing
            title: El nombre no tiene registro TLS-RPT
