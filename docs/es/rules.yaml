            rationale: Si la clave del servidor se filtra más tarde, el tráfico grabado con un conjunto sin secreto perfecto hacia adelante puede descifrarse. Se omite detrás de Cloudflare.
            message: el secreto perfecto hacia adelante cubre {got} de las suites aceptadas, cuando se espera “all”
          - id: tls-probe/intermediate/missing
