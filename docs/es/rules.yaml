            references:
              - https://www.rfc-editor.org/rfc/rfc9325#section-4.5
            rationale: Un primo DHE corto permite a un atacante con muchos recursos romper el intercambio de claves y leer el tráfico.
            message: el primo DHE del servidor tiene {got} bits, menos de 2048
          - id: tls-probe/early-data/insecure
