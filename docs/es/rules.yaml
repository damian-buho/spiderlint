            rationale: Una clave corta puede ser factorizada o rota por un atacante decidido, que podría entonces suplantar al sitio. Solo en páginas HTTPS.
            message: la clave del certificado es más débil que RSA 2048 o EC P-256
          - id: tls/protocol/deprecated
