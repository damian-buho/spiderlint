              - https://developers.google.com/search/docs/appearance/structured-data/sd-policies
            rationale: Cuando la url o el nombre del marcado difieren de la URL canónica y del título, los buscadores desconfían de él y pueden ignorar los datos estructurados.
          - id: tls-probe/cipher-order/missing
