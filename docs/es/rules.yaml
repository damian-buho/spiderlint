            rationale: Sin una etiqueta iodef, una autoridad certificadora que rechaza o pone en duda una solicitud para el nombre no tiene dónde notificarlo. Solo se comprueba si existen registros CAA.
            message: CAA no nombra una dirección iodef para los informes de emisión rechazada
          - id: dns/caa-issuer/mismatch
            title: CAA no permite la CA que emitió el certificado servido
            severity: error
            score: "8.6"
            scope: site
            rulesets:
              - dns
              - dns:core
              - dns:recommended
              - server
            references:
              - https://www.rfc-editor.org/rfc/rfc8659#section-4.2
            rationale: Las autoridades certificadoras deben rechazar lo que CAA no permite, así que la próxima renovación con esta CA fallará y los visitantes verán un certificado caducado. Solo se comprueba si existen registros CAA y se conoce el emisor.
            message: CAA no permite a la CA que emitió el certificado servido ({got})
          - id: dns/caa/missing
            title: El host no tiene registro CAA
            severity: warning
            score: "4.0"
            scope: site
            rulesets:
              - dns
              - dns:core
              - dns:recommended
              - server
            references:
              - https://www.rfc-editor.org/rfc/rfc8659
            rationale: Sin un registro CAA issue o issuewild en el host o en algún nombre superior, cualquier autoridad certificadora puede emitir un certificado para él, y es más fácil obtener una emisión errónea o fraudulenta.
            message: no hay registro CAA issue ni issuewild en el host ni en ningún padre, así que cualquier CA puede emitir para él
          - id: dns/cname-chain/excessive
            title: El nombre se resuelve a través de una cadena larga de alias CNAME
            severity: info
            score: "1.6"
            scope: site
            rulesets:
              - dns
            references:
              - https://www.rfc-editor.org/rfc/rfc1034#section-3.6.2
            rationale: Cada salto CNAME obliga al resolutor a hacer otra consulta, lo que retrasa la primera visita, y algunos resolutores abandonan las cadenas largas. Se señala a partir de más de dos saltos.
            message: el nombre se resuelve a través de {got} saltos CNAME
          - id: dns/cname/insecure
            title: Un CNAME apunta a un nombre que no existe
            severity: error
            score: "9.2"
            scope: site
            rulesets:
              - dns
              - dns:core
              - dns:recommended
            references:
              - https://developer.mozilla.org/en-US/docs/Web/Security/Subdomain_takeovers
            rationale: Quien registre o reclame el destino inexistente puede servir contenido bajo el nombre del sitio, lo que permite phishing, robo de cookies o desfiguración. Se comprueba en los nombres rastreados y enlazados.
            message: el nombre es un CNAME a un nombre que no existe, expuesto a secuestro ({got})
          - id: dns/dmarc-policy/weak
            title: La política DMARC ni pone en cuarentena ni rechaza
            severity: warning
            score: "6.2"
            scope: site
            rulesets:
              - dns:mail
              - mail
              - mail:recommended
              - server
            references:
              - https://www.rfc-editor.org/rfc/rfc9989#section-4.7
            rationale: Una política none pide a los receptores que entreguen igualmente el correo falsificado, de modo que el phishing enviado con la identidad del nombre sigue llegando a las bandejas de entrada. Solo se comprueba en nombres que reciben o envían correo y publican DMARC.
            message: la política DMARC no pone en cuarentena ni rechaza, así que los receptores entregan el correo falsificado de un nombre que recibe o envía correo (se obtuvo {got})
          - id: dns/dmarc-reject/missing
            title: Un nombre que no envía correo no tiene política DMARC de rechazo
            severity: warning
            score: "6.4"
            scope: site
            rulesets:
              - dns:mail
            references:
              - https://www.rfc-editor.org/rfc/rfc9989#section-4.7
            rationale: Sin una política DMARC de reject, los receptores aceptan el correo falsificado con el nombre, y los estafadores pueden aprovechar su reputación. Solo se comprueba en nombres que parecen no recibir ni enviar correo.
            message: ninguna política DMARC de rechazo se aplica al nombre, así que los receptores aceptan correo falsificado desde él ({got})
          - id: dns/dmarc/missing
            title: Un nombre de correo no tiene registro DMARC
            severity: warning
            score: "6.2"
            scope: site
            rulesets:
              - dns:mail
              - mail
              - mail:recommended
              - server
            references:
              - https://www.rfc-editor.org/rfc/rfc9989#section-4.7
            rationale: Sin DMARC, los receptores entregan el correo falsificado con el nombre, y los destinatarios pueden ser víctimas de phishing bajo su identidad. Solo se comprueba en nombres que reciben o envían correo.
            message: ningún registro DMARC se aplica a un nombre que recibe o envía correo, así que los receptores entregan el correo falsificado en su nombre
          - id: dns/dnssec-algorithm/deprecated
            title: La zona usa un algoritmo DNSSEC que ya no está permitido
            severity: warning
            score: "4.2"
            scope: site
            rulesets:
              - dns
            references:
              - https://www.rfc-editor.org/rfc/rfc8624#section-3.1
            rationale: La RFC 8624 prohíbe el algoritmo de firma o el resumen DS, de modo que los resolutores pueden tratar la zona como no firmada y su protección contra respuestas falsificadas se debilita. Solo se comprueba en zonas firmadas.
            message: la zona firma o resume con un algoritmo que la RFC 8624 prohíbe
          - id: dns/dnssec/broken
            title: Las firmas DNSSEC de la zona no superan la validación
            severity: error
            score: "8.8"
            scope: site
            rulesets:
              - dns
              - dns:core
              - dns:recommended
              - server
            references:
              - https://www.rfc-editor.org/rfc/rfc4035#section-5.5
            rationale: Los resolutores que validan responden SERVFAIL, de modo que quienes los usan no pueden llegar al sitio ni a su correo. Solo se comprueba cuando el resolutor valida DNSSEC.
            message: la zona está firmada pero falla la validación, así que todo resolvedor que valida responde SERVFAIL
          - id: dns/dnssec/missing
            title: La zona no está firmada con DNSSEC
            severity: warning
            score: "5.6"
            scope: site
            rulesets:
              - dns
              - dns:core
              - dns:recommended
              - server
            references:
              - https://www.rfc-editor.org/rfc/rfc9364
            rationale: Sin firmas, los resolutores no pueden detectar respuestas DNS falsificadas, así que un atacante en la ruta puede enviar a los visitantes y el correo a otro servidor.
            message: la zona no está firmada con DNSSEC
          - id: dns/https-alpn/mismatch
            title: El registro HTTPS y Alt-Svc no coinciden sobre HTTP/3
            severity: warning
            score: "3.5"
            scope: site
            rulesets:
              - dns
            references:
              - https://www.rfc-editor.org/rfc/rfc9460#section-7.1
            rationale: Cuando el registro DNS y la cabecera discrepan sobre si HTTP/3 está disponible, los navegadores reciben indicaciones contradictorias y pueden probar un protocolo que el servidor no ofrece o ignorar uno que sí ofrece.
            message: el registro HTTPS y Alt-Svc no coinciden sobre h3 ({got})
          - id: dns/https-hints/mismatch
            title: Las pistas de dirección del registro HTTPS no coinciden con A y AAAA
            severity: warning
            score: "3.6"
            scope: site
            rulesets:
              - dns
            references:
              - https://www.rfc-editor.org/rfc/rfc9460#section-7.3
            rationale: Los navegadores que confían en ipv4hint o ipv6hint se conectan a direcciones que el host ya no tiene, o nunca prueban las que sí tiene, de modo que las conexiones fallan o se ralentizan. Solo se comprueba cuando el registro apunta al propio host.
            message: ipv4hint o ipv6hint no coincide con los registros A y AAAA
          - id: dns/https-record/missing
            title: El host no tiene registro DNS HTTPS
            severity: warning
            score: "3.8"
            scope: site
            rulesets:
              - dns
              - dns:core
              - dns:recommended
              - server
            references:
              - https://www.rfc-editor.org/rfc/rfc9460
            rationale: Sin él, en la primera visita el navegador solo se entera de HTTP/3 y de Encrypted Client Hello por la cabecera Alt-Svc, una conexión más tarde, de modo que la primera carga es más lenta y menos privada.
            message: no hay registro HTTPS, así que una primera visita se entera de h3 y ECH solo por Alt-Svc, una conexión tarde
          - id: dns/ns-answers/mismatch
            title: Los servidores de nombres responden de forma distinta para el host
            severity: warning
            score: "5.8"
            scope: site
            rulesets:
              - dns
            references:
              - https://www.rfc-editor.org/rfc/rfc1034#section-4.3.5
            rationale: Los visitantes llegan a direcciones distintas según el servidor que consulte su resolutor, así que algunos pueden acabar en un servidor obsoleto o equivocado.
            message: "los servidores de nombres responden de forma distinta para el host, así que lo que alcanza un visitante depende de cuál consulte su resolvedor: {got}"
          - id: dns/ns-delegation/broken
            title: Servidores de nombres listados no responden por la zona
            severity: warning
            score: "5.5"
            scope: site
            rulesets:
              - dns
            references:
              - https://www.rfc-editor.org/rfc/rfc1912#section-2.8
            rationale: Un resolutor que elige uno de estos restos de un proveedor antiguo o de una zona sin cargar espera a que venza el tiempo o recibe un rechazo, así que las consultas se ralentizan o fallan.
            message: "estos servidores de nombres figuran para la zona pero no responden por ella, un resto de un proveedor dado de baja o de una zona nunca cargada: {got}; un resolvedor que elija uno espera a que venza el tiempo o recibe un rechazo"
          - id: dns/ns-delegation/mismatch
            title: La zona superior y la propia zona listan servidores de nombres distintos
            severity: warning
            score: "5.2"
            scope: site
            rulesets:
              - dns
            references:
              - https://www.rfc-editor.org/rfc/rfc1034#section-4.2.2
            rationale: Los resolutores llegan a un servidor que la zona no reconoce o pasan por alto uno que sí lista, de modo que las consultas pueden fallar o devolver datos obsoletos.
            message: "la zona padre y los registros NS de la propia zona nombran servidores distintos, así que los resolvedores llegan a un servidor que la zona desconoce u omiten uno que lista: {got}"
          - id: dns/ns-network/single
            title: Todos los servidores de nombres están en una sola red
            severity: info
            score: "2.2"
            scope: site
            rulesets:
              - dns
            references:
              - https://www.rfc-editor.org/rfc/rfc2182#section-3.1
            rationale: Si esa única red /24 o /48 falla, todos los servidores de nombres caen juntos, y con ellos el sitio y su correo.
            message: todas las direcciones de los servidores de nombres están en un solo /24 o /48
          - id: dns/ns-resolver/mismatch
            title: La respuesta del resolutor difiere de la de los servidores de nombres
            severity: info
            score: "2.4"
            scope: site
            rulesets:
              - dns
            references:
              - https://www.rfc-editor.org/rfc/rfc2181#section-5.4.1
            rationale: Una respuesta antigua en caché o una vista dividida hace que algunos visitantes sigan llegando a una dirección antigua tras un cambio.
            message: "el resolvedor configurado responde distinto a sus servidores de nombres: una respuesta antigua en caché o una vista dividida"
          - id: dns/ns-serial/mismatch
            title: Los servidores de nombres sirven versiones distintas de la zona
            severity: warning
            score: "5.3"
            scope: site
            rulesets:
              - dns
            references:
              - https://www.rfc-editor.org/rfc/rfc1034#section-4.3.5
            rationale: Los servidores informan números de serie SOA distintos, de modo que un cambio en la zona llega tarde a algunos visitantes, según el servidor que consulte su resolutor.
            message: los servidores de nombres sirven números de serie SOA distintos, así que un cambio de zona llega tarde a algunos de ellos (obtenido {got})
          - id: dns/ns/single
            title: La zona tiene un solo servidor de nombres
            severity: warning
            score: "5.4"
            scope: site
            rulesets:
              - dns
            references:
              - https://www.rfc-editor.org/rfc/rfc1034#section-4.1
            rationale: Cuando ese servidor deja de funcionar, nadie puede resolver el sitio ni su correo. Se señala cuando hay menos de dos servidores de nombres.
            message: la zona tiene {got} servidores de nombres, menos de 2
          - id: dns/nsec3-iterations/excessive
            title: NSEC3 usa iteraciones de hash adicionales o una sal
            severity: warning
            score: "3.3"
            scope: site
            rulesets:
              - dns
            references:
              - https://www.rfc-editor.org/rfc/rfc9276#section-3.1
            rationale: Según la RFC 9276, las iteraciones adicionales y la sal añaden trabajo al resolutor sin protección real, y algunos resolutores tratan esas respuestas como inseguras. Solo se comprueba en zonas que usan NSEC3.
            message: NSEC3 usa iteraciones extra o una sal ({got})
          - id: dns/null-mx/invalid
            title: Un MX nulo en un nombre que recibe o envía correo
            severity: warning
            score: "5.0"
            scope: site
            rulesets:
              - dns:mail
              - mail
              - mail:recommended
              - server
            references:
              - https://www.rfc-editor.org/rfc/rfc7505#section-4
            rationale: Un MX nulo indica a los remitentes que el nombre no acepta correo, así que pueden descartar el correo dirigido a él y los receptores pueden rechazar el que envía. Solo se comprueba en nombres que parecen recibir o enviar correo.
            message: un MX nulo en un nombre que recibe o envía correo, así que los remitentes pueden descartar el correo hacia él y los receptores rechazar el que sale de él ({got})
          - id: dns/null-mx/missing
            title: Un nombre que no recibe correo no tiene registro MX nulo
            severity: warning
            score: "5.6"
            scope: site
            rulesets:
              - dns:mail
            references:
              - https://www.rfc-editor.org/rfc/rfc7505
            rationale: Sin un MX nulo, los remitentes recurren a la dirección A o AAAA del nombre y reintentan durante días correo que nunca acepta. Solo se comprueba en nombres que parecen no recibir ni enviar correo.
            message: no hay MX nulo, así que los remitentes recurren a la dirección A o AAAA del nombre y reintentan durante días un correo que nunca recibe ({got})
          - id: dns/recursion/insecure
            title: Un servidor de nombres autoritativo responde consultas recursivas
            severity: warning
            score: "6.0"
            scope: site
            rulesets:
              - dns
              - dns:recommended
              - server
            references:
              - https://www.rfc-editor.org/rfc/rfc5358
            rationale: Abierto a cualquiera, puede usarse indebidamente para ataques de amplificación de tráfico y envenenamiento de caché.
            message: un servidor de nombres autoritativo responde consultas recursivas de cualquier nombre, lo que lo expone a ataques de amplificación y envenenamiento de caché
          - id: dns/resolver-answers/mismatch
            title: Los resolutores comparados dan direcciones distintas para el host
            severity: info
            score: "2.0"
            scope: site
            rulesets:
              - dns
            references:
              - https://www.rfc-editor.org/rfc/rfc2181#section-5.4.1
            rationale: El DNS geográfico lo hace a propósito; una vista obsoleta o dividida no, y envía a algunos visitantes a un servidor antiguo o equivocado. Solo se comprueba cuando se comparan varios resolutores.
            message: los resolvedores comparados dan {got} respuestas distintas para el host; el DNS geográfico lo hace a propósito, una vista obsoleta o dividida no
          - id: dns/resolver-rcode/broken
            title: Los resolutores comparados discrepan sobre si el host se resuelve
            severity: warning
            score: "4.6"
            scope: site
            rulesets:
              - dns
            references:
              - https://www.rfc-editor.org/rfc/rfc4035#section-5.5
            rationale: Unos resolutores responden y otros fallan, de modo que parte de los visitantes no puede llegar al sitio; un SERVFAIL solo en los resolutores que validan apunta a una cadena DNSSEC rota. Solo se comprueba cuando se comparan varios resolutores.
            message: los resolvedores comparados no coinciden en si el host se resuelve ({got}); un SERVFAIL solo en un resolvedor que valida apunta a DNSSEC
          - id: dns/resolver-validation/broken
            title: Los resolutores discrepan sobre si la zona firmada se valida
            severity: info
            score: "1.8"
            scope: site
            rulesets:
              - dns
            references:
              - https://www.rfc-editor.org/rfc/rfc4035#section-4.3
            rationale: Algunos resolutores comparados validan la zona firmada y otros no, lo que apunta a un problema de DS o de claves que hace fallar las consultas de los visitantes tras resolutores que validan. Solo se comprueba en zonas firmadas.
            message: algunos resolvedores comparados validan la zona firmada y otros no ({got})
          - id: dns/rrsig/expiring
            title: Las firmas DNSSEC de la zona están a punto de caducar
            severity: warning
            score: "4.4"
            scope: site
            rulesets:
              - dns
            references:
              - https://www.rfc-editor.org/rfc/rfc6781#section-4.4.2
            rationale: Con menos de una cuarta parte de la validez restante, es probable que el refirmado se haya detenido; cuando las firmas caduquen, los resolutores que validan fallarán en cada consulta y el sitio y su correo desaparecerán para sus usuarios.
            message: queda menos de un cuarto de la validez de la firma del host, así que la refirma se ha detenido ({got})
          - id: dns/soa-timers/range
            title: Los temporizadores del SOA están fuera de los rangos recomendados
            severity: info
            score: "1.2"
            scope: site
            rulesets:
              - dns
            references:
              - https://www.rfc-editor.org/rfc/rfc1912#section-2.2
            rationale: Valores de refresh, retry, expire o minimum alejados de los rangos de la RFC 1912 ralentizan la propagación de cambios o hacen que los servidores secundarios abandonen la zona demasiado pronto. Se omite si el proveedor de DNS gestiona el SOA.
            message: "el {field} del SOA es {got}, fuera de lo que recomienda la RFC 1912 §2.2: refresh 1200–43200 s, retry por debajo de refresh, expire 1209600–2419200 s, minimum 300–86400 s, un servidor de nombres listado como primario"
          - id: dns/spf-all/weak
            title: El registro SPF no termina en -all ni en ~all
            severity: warning
            score: "5.7"
            scope: site
            rulesets:
              - dns:mail
              - mail
              - mail:recommended
              - server
            references:
              - https://www.rfc-editor.org/rfc/rfc7208#section-5.1
            rationale: Sin un -all, ~all o redirect final, los receptores permiten que cualquier servidor envíe con el nombre, y el correo falsificado supera la comprobación SPF. Solo se comprueba en nombres que reciben o envían correo.
            message: SPF no termina en -all ni ~all, así que los receptores dejan que cualquier servidor envíe como este nombre ({got})
          - id: dns/spf-null/missing
            title: Un nombre que no envía correo no tiene un registro SPF que lo deniegue todo
            severity: warning
            score: "6.1"
            scope: site
            rulesets:
              - dns:mail
            references:
              - https://www.rfc-editor.org/rfc/rfc7208#section-5.1
            rationale: Sin un único registro SPF v=spf1 -all, los receptores no pueden rechazar el correo falsificado con este nombre, y cualquiera puede suplantarlo para engañar a los destinatarios. Solo se comprueba en nombres que parecen no recibir ni enviar correo.
            message: SPF no es un v=spf1 -all solitario, así que los receptores no pueden rechazar correo falsificado desde este nombre ({got})
          - id: dns/spf/duplicate
            title: Un nombre de correo no tiene registro SPF o tiene más de uno
            severity: warning
            score: "5.8"
            scope: site
            rulesets:
              - dns:mail
              - mail
              - mail:recommended
              - server
            references:
              - https://www.rfc-editor.org/rfc/rfc7208#section-4.5
            rationale: Sin registro SPF nadie puede comprobar qué servidores pueden enviar con el nombre; con dos, todas las comprobaciones fallan y los receptores pueden rechazar correo legítimo. Solo se comprueba en nombres que reciben o envían correo.
            message: un nombre que recibe o envía correo necesita exactamente un registro v=spf1, pues ninguno deja a nadie enviar como él y dos hacen fallar toda comprobación ({got})
          - id: dns/ttl/range
            title: El TTL de un registro es muy corto o muy largo
            severity: hint
            score: "0.6"
            scope: site
            rulesets:
              - dns
            references:
              - https://www.rfc-editor.org/rfc/rfc1912#section-2.2
            rationale: Un TTL inferior a 300 segundos multiplica la carga y el retraso de las consultas DNS; superior a un día, una corrección o una migración tarda tanto en llegar a los visitantes. Los registros NS pueden llegar a dos días.
            message: un TTL de registro está fuera del rango de 300 segundos a un día, dos para NS; está bien justo antes de una migración, pero cuesta en otro caso ({got})
          - id: domain/ns-registry/mismatch
            title: El registro y la zona listan servidores de nombres distintos
            severity: warning
            score: "5.0"
            scope: site
            rulesets:
              - dns
            references:
              - https://www.rfc-editor.org/rfc/rfc1034#section-4.2.2
            rationale: Los resolutores pueden ser dirigidos a servidores que el propietario de la zona no controla o no conoce, de modo que las respuestas pueden ser erróneas o faltar.
            message: "los servidores de nombres que lista el registro difieren de los registros NS de la propia zona: {got}"
          - id: domain/registration/expiring
            title: El registro del dominio caduca en menos de 30 días
            severity: error
            score: "dynamic: 0 → 9.6, 6 → 7.0, 7 → 6.5, 30 → 3.5"
            scope: site
            rulesets:
              - dns
              - dns:recommended
              - server
            references:
              - https://www.rfc-editor.org/rfc/rfc9083#section-4.5
            rationale: Cuando caduca, el sitio y su correo dejan de resolverse y otra persona puede registrar el nombre. Solo se comprueba en dominios registrados que la consulta RDAP encuentra.
            message: el registro del dominio vence en {got} días, y el sitio y su correo dejan de resolverse cuando caduque
          - id: domain/transfer-lock/missing
            title: El dominio no tiene bloqueo de transferencia
            severity: warning
            score: "6.2"
            scope: site
            rulesets:
              - dns
              - dns:recommended
              - server
            references:
              - https://www.icann.org/resources/pages/epp-status-codes-2014-06-16-en
            rationale: Quien se apodere de la cuenta del registrador puede mover el dominio a otro registrador, y el sitio y el correo con él.
            message: el registro no lleva bloqueo de transferencia, así que quien tome la cuenta del registrador puede llevarse el dominio (estado {got})
          - id: feeds/archive-link/unreachable
            title: Los enlaces de archivo del feed no llevan a ninguna parte
            severity: warning
            score: "3.5"
            scope: site
            rulesets:
              - feeds
            references:
              - https://www.rfc-editor.org/rfc/rfc5005
            rationale: Los enlaces de archivo (prev-archive, next-archive, current) que responden con error o no son un feed impiden a los lectores obtener elementos antiguos, y un feed completo no debería nombrar páginas de archivo.
          - id: feeds/cache-control/mismatch
            title: El almacenamiento en caché del feed va en contra de sus lectores
            severity: warning
            score: "5.1"
            scope: page
            rulesets:
              - feeds
            references:
              - https://www.rfc-editor.org/rfc/rfc9111#section-5.2
            rationale: "Cache-Control: no-store, o un max-age muy distinto del ttl del propio feed, hace que los lectores lo descarguen constantemente o tarden horas en ver las novedades."
          - id: feeds/charset/mismatch
            title: La codificación del feed se declara o decodifica de forma incoherente
            severity: warning
            score: "5.5"
            scope: page
            rulesets:
              - feeds
            references:
              - https://www.w3.org/TR/xml/#charencoding
            rationale: Cuando la cabecera y la declaración XML no coinciden, o el texto muestra caracteres deformados, las letras con acento y no latinas de los títulos y el contenido se vuelven ilegibles para los suscriptores.
          - id: feeds/content-escaping/invalid
            title: El contenido de los elementos está escapado dos veces
            severity: warning
            score: "4.4"
            scope: page
            rulesets:
              - feeds
            references:
              - https://www.rssboard.org/rss-profile
            rationale: Los lectores muestran las etiquetas y entidades como texto visible, como &lt;p&gt;, en lugar de contenido con formato.
          - id: feeds/content-html/insecure
            title: El contenido de los elementos incluye marcado que los lectores eliminan
            severity: warning
            score: "6.3"
            scope: page
            rulesets:
              - feeds
            references:
              - https://www.rssboard.org/rss-profile
            rationale: Los lectores eliminan scripts, marcos, formularios, controladores de eventos y estilos de posición por seguridad, así que el elemento puede verse roto o incompleto.
          - id: feeds/content-markup/invalid
            title: El contenido de los elementos es Markdown o MDX sin renderizar
            severity: error
            score: "8.0"
            scope: page
            rulesets:
              - feeds
            references:
              - https://www.rssboard.org/rss-profile
            rationale: Los lectores muestran el texto tal cual, así que los suscriptores ven sintaxis sin procesar como `##` y `[texto](url)` en lugar de entradas con formato.
          - id: feeds/content-type/mismatch
            title: El contenido tiene HTML pero está declarado como texto plano
            severity: warning
            score: "5.6"
            scope: page
            rulesets:
              - feeds
            references:
              - https://www.rssboard.org/rss-profile
            rationale: Los lectores muestran las etiquetas como texto en lugar de interpretarlas, y los suscriptores leen marcado en vez de la entrada.
          - id: feeds/content-url/invalid
            title: Los enlaces e imágenes del contenido usan URL relativas
            severity: warning
            score: "4.5"
            scope: page
            rulesets:
              - feeds
            references:
              - https://www.rssboard.org/rss-profile
            rationale: El lector no conoce la dirección de la página, así que los enlaces e imágenes relativos dentro del HTML de un elemento se rompen para los suscriptores.
          - id: feeds/date/invalid
            title: El feed tiene fechas que los lectores no pueden interpretar
            severity: error
            score: "7.2"
            scope: page
            rulesets:
              - feeds
            references:
              - https://www.rssboard.org/rss-profile
            rationale: RSS exige fechas RFC 822; Atom y JSON Feed, RFC 3339. Los lectores descartan o colocan mal los elementos cuya fecha no pueden interpretar, así que las entradas aparecen en orden incorrecto o no aparecen.
          - id: feeds/discovery-link/mismatch
            title: Un enlace al feed anuncia un tipo erróneo o apunta a algo que no es un feed
            severity: warning
            score: "3.4"
            scope: site
            rulesets:
              - feeds
            references:
              - https://www.rssboard.org/rss-autodiscovery
            rationale: Los navegadores y lectores usan el tipo del enlace del encabezado para elegir un analizador. Un tipo erróneo, o un destino que no es un feed, hace que la suscripción falle.
          - id: feeds/discovery-link/missing
            title: Algunas páginas de un grupo anuncian un feed y otras no
            severity: warning
            score: "4.1"
            scope: group
            rulesets:
              - feeds
            references:
              - https://www.rssboard.org/rss-autodiscovery
            rationale: Los visitantes de una página sin el enlace al feed no pueden suscribirse desde ella. Solo se comparan las páginas HTML que responden 2xx.
          - id: feeds/document/invalid
            title: El feed no es XML ni JSON bien formado
            severity: error
            score: "9.0"
            scope: page
            rulesets:
              - feeds
            references:
              - https://www.w3.org/TR/xml/#sec-well-formed
            rationale: Los lectores de feeds no pueden analizar un documento mal formado, así que los suscriptores no reciben elementos nuevos. La causa habitual es una plantilla que no escapa sus valores.
          - id: feeds/document/large
            title: El feed es demasiado grande o se sirve sin comprimir
            severity: warning
            score: "5.0"
            scope: page
            rulesets:
              - feeds
            references:
              - https://www.rssboard.org/rss-profile
            rationale: Cada consulta de cada suscriptor descarga el cuerpo completo. Un feed por encima del límite max-bytes (1 MiB por defecto), o de más de 10 KiB sin comprimir, desperdicia ancho de banda y puede agotar el tiempo de espera en los lectores.
          - id: feeds/document/stale
            title: El feed no se actualiza desde hace mucho tiempo
            severity: info
            score: "2.2"
            scope: page
            rulesets:
              - feeds
            references:
              - https://www.rssboard.org/rss-profile
            rationale: Los suscriptores y directorios consideran abandonado un feed cuando su elemento más reciente supera el límite de stale-days (365 días por defecto). También se avisa cuando la fecha de compilación es anterior al elemento más reciente.
          - id: feeds/element/missing
            title: Al feed le faltan elementos que su formato exige
            severity: error
            score: "8.6"
            scope: page
            rulesets:
              - feeds
            references:
              - https://www.rssboard.org/rss-specification
            rationale: Un feed sin un elemento obligatorio (título, enlace o descripción del canal en RSS; id, título, updated o autor en Atom; título o id en JSON Feed) puede ser rechazado por los validadores o mostrarse en blanco en los lectores.
          - id: feeds/element/unknown
            title: El feed RSS usa elementos ajenos a la especificación
            severity: warning
            score: "3.9"
            scope: page
            rulesets:
              - feeds
            references:
              - https://www.rssboard.org/rss-specification
            rationale: Los elementos que RSS 2.0 no define y que no pertenecen a ningún espacio de nombres los ignoran los lectores y hacen que los validadores estrictos rechacen el feed.
          - id: feeds/email/invalid
            title: Los campos de correo del feed no tienen la forma dirección (Nombre)
            severity: warning
            score: "4.2"
            scope: page
            rulesets:
              - feeds
            references:
              - https://www.rssboard.org/rss-specification
            rationale: RSS exige managingEditor, webMaster y author como una dirección seguida de un nombre entre paréntesis. Otras formas no pasan los validadores y los lectores pueden mostrarlas o enlazarlas mal.
          - id: feeds/enclosure/invalid
            title: Los adjuntos del podcast no coinciden con lo que sirve su servidor
            severity: warning
            score: "6.2"
            scope: page
            rulesets:
              - podcasts
            references:
              - https://podcasters.apple.com/support/823-podcast-requirements
            rationale: "Solo feeds de podcast. Las aplicaciones y directorios comprueban cada archivo de audio con una petición HEAD: un archivo que falla, con otro tamaño o tipo del declarado o sin soporte de rangos de bytes hace que los episodios no se descarguen, muestren una duración errónea o no permitan avanzar."
          - id: feeds/full-text/missing
            title: El feed ofrece resúmenes mientras las páginas contienen las entradas completas
            severity: info
            score: "2.6"
            scope: site
            rulesets:
              - feeds
            references:
              - https://www.rssboard.org/rss-profile
            rationale: Cada página enlazada es mucho más larga que su elemento, así que los suscriptores deben salir del lector para leer una entrada. Solo se comparan páginas de al menos 150 palabras.
          - id: feeds/item-date/future
            title: Los elementos del feed tienen fecha futura
            severity: warning
            score: "3.6"
            scope: page
            rulesets:
              - feeds
            references:
              - https://www.rssboard.org/rss-profile
            rationale: Los lectores que ordenan por fecha muestran por encima de todo los elementos con fecha posterior a la respuesta, y una entrada programada se filtra antes de tiempo.
          - id: feeds/item-date/mismatch
            title: Las fechas de los elementos del feed difieren de las de sus páginas
            severity: warning
            score: "5.4"
            scope: site
            rulesets:
              - feeds
            references:
              - https://www.rssboard.org/rss-profile
            rationale: Cuando el feed y la página discrepan en más de un día, los lectores ordenan la entrada por la fecha equivocada y los buscadores ven fechas de publicación contradictorias.
          - id: feeds/item-id/duplicate
            title: Los elementos del feed comparten un ID
            severity: error
            score: "7.6"
            scope: page
            rulesets:
              - feeds
            references:
              - https://www.rssboard.org/rss-profile
            rationale: Los lectores tratan los elementos con el mismo ID como una sola entrada, así que uno se fusiona con otro o nunca llega a los suscriptores.
          - id: feeds/item-id/invalid
            title: Los ID de los elementos contienen parámetros de seguimiento
            severity: warning
            score: "4.8"
            scope: page
            rulesets:
              - feeds
            references:
              - https://www.rssboard.org/rss-profile
            rationale: Un ID que lleva parámetros utm_* u otros de campaña cambia cuando cambia la campaña, y los lectores vuelven a mostrar la misma entrada como nueva.
          - id: feeds/item-id/missing
            title: Los elementos del feed no tienen un ID estable
            severity: warning
            score: "4.6"
            scope: page
            rulesets:
              - feeds
            references:
              - https://www.rssboard.org/rss-profile
            rationale: Los lectores distinguen los elementos nuevos de los ya conocidos por su ID. Los que no lo tienen se muestran de nuevo como nuevos a los suscriptores cada vez que se descarga el feed.
          - id: feeds/item-link/mismatch
            title: Los elementos del feed enlazan fuera de la URL canónica de la página
            severity: warning
            score: "5.9"
            scope: site
            rulesets:
              - feeds
            references:
              - https://www.rssboard.org/rss-profile
            rationale: Un enlace de elemento distinto de la URL canónica de la página reparte los compartidos, las analíticas y las señales de búsqueda entre dos direcciones.
          - id: feeds/item-link/unreachable
            title: Los elementos del feed enlazan a páginas que fallan o redirigen
            severity: warning
            score: "6.1"
            scope: site
            rulesets:
              - feeds
            references:
              - https://www.rssboard.org/rss-profile
            rationale: Los suscriptores que pulsan un elemento llegan a una página de error o pasan por una redirección. Solo se comprueban los elementos cuya página obtuvo el rastreo.
          - id: feeds/item-title/invalid
            title: Los títulos de los elementos contienen marcado o marcadores
            severity: warning
            score: "4.3"
            scope: page
            rulesets:
              - feeds
            references:
              - https://www.rssboard.org/rss-profile
            rationale: Los títulos de los elementos son texto plano, así que las etiquetas, entidades o valores de plantilla aparecen literalmente en las listas y notificaciones de los suscriptores.
          - id: feeds/item-title/mismatch
            title: Los títulos de los elementos del feed difieren de los de sus páginas
            severity: info
            score: "2.8"
            scope: site
            rulesets:
              - feeds
            references:
              - https://www.rssboard.org/rss-profile
            rationale: Los suscriptores ven un título en el lector y otro en la página, lo que dificulta reconocer la entrada.
          - id: feeds/itunes-image/invalid
            title: La imagen del podcast falta o no es apta para los directorios
            severity: warning
            score: "5.0"
            scope: site
            rulesets:
              - podcasts
            references:
              - https://podcasters.apple.com/support/823-podcast-requirements
            rationale: Solo feeds de podcast. Los directorios rechazan una imagen que no sea un JPEG o PNG cuadrado de entre 1400 y 3000 px por lado, así que el programa aparece sin portada o se rechaza.
            message: "falta la carátula del pódcast o no es apta: {got}"
          - id: feeds/itunes-tags/missing
            title: Al feed del podcast le faltan etiquetas que exigen los directorios
            severity: warning
            score: "5.8"
            scope: page
            rulesets:
              - podcasts
            references:
              - https://podcasters.apple.com/support/823-podcast-requirements
            rationale: Solo feeds de podcast. Apple Podcasts y directorios similares rechazan o listan incompletos los programas sin itunes:image, category, explicit, author o language, o con un itunes:duration mal formado.
          - id: feeds/json-version/outdated
            title: El JSON Feed usa una versión obsoleta
            severity: warning
            score: "3.7"
            scope: page
            rulesets:
              - feeds
            references:
              - https://www.jsonfeed.org/version/1.1/
            rationale: JSON Feed 1.1 sustituyó el autor único por una lista de autores. Los lectores que siguen 1.1 ignoran la forma antigua, así que los autores desaparecen.
          - id: feeds/language/invalid
            title: El idioma del feed no es una etiqueta BCP 47 válida
            severity: warning
            score: "3.8"
            scope: page
            rulesets:
              - feeds
            references:
              - https://www.rfc-editor.org/info/bcp47
            rationale: Los lectores y directorios de podcasts usan el idioma para filtrar y agrupar feeds; un valor como “english” se ignora o se interpreta mal.
          - id: feeds/language/mismatch
            title: El idioma del feed difiere del de las páginas que lo anuncian
            severity: warning
            score: "5.3"
            scope: site
            rulesets:
              - feeds
            references:
              - https://www.rssboard.org/rss-autodiscovery
            rationale: Un feed enlazado desde una página en otro idioma se ofrece al público equivocado, y los lectores y directorios lo clasifican en el idioma erróneo.
          - id: feeds/media-type/invalid
            title: El feed se sirve con un tipo que los lectores no tratan como feed
            severity: warning
            score: "4.9"
            scope: page
            rulesets:
              - feeds
            references:
              - https://www.rssboard.org/rss-profile
            rationale: Un tipo como text/html, text/plain o application/octet-stream, o ninguno, puede hacer que los navegadores muestren o descarguen el archivo y que algunos lectores y herramientas de descubrimiento lo ignoren.
          - id: feeds/permalink/invalid
            title: Un guid que no es una URL está marcado como enlace permanente
            severity: warning
            score: "5.8"
            scope: page
            rulesets:
              - feeds
            references:
              - https://www.rssboard.org/rss-specification
            rationale: En RSS un guid se considera enlace permanente salvo que se indique lo contrario, así que los lectores intentan abrir un guid que no es una URL y los suscriptores llegan a un enlace roto.
          - id: feeds/podcast-guid/missing
            title: El feed del podcast no tiene un podcast:guid válido
            severity: warning
            score: "5.4"
            scope: page
            rulesets:
              - podcasts
            references:
              - https://podcasting2.org/docs/podcast-namespace/tags/guid
            rationale: Solo feeds de podcast. El GUID de Podcasting 2.0 identifica el programa entre servidores; sin él, o con un valor erróneo, mover el feed hace que las aplicaciones lo traten como un programa nuevo.
          - id: feeds/podcast-locked/missing
            title: El feed del podcast no tiene un podcast:locked válido
            severity: info
            score: "2.4"
            scope: page
            rulesets:
              - podcasts
            references:
              - https://podcasting2.org/docs/podcast-namespace/tags/locked
            rationale: Solo feeds de podcast. Sin podcast:locked con el valor yes, cualquier plataforma puede importar el feed en su propia cuenta y publicar una copia del programa sin el consentimiento del propietario. También se informa de un valor distinto de yes o no.
          - id: feeds/self-link/missing
            title: El feed no indica su propia URL, o indica otra
            severity: warning
            score: "6.0"
            scope: page
            rulesets:
              - feeds
            references:
              - https://www.rssboard.org/rss-profile
            rationale: Los lectores y agregadores usan el enlace self para reconocer un feed al que se llega por varias direcciones o que se ha movido. Sin él, o si apunta a otra parte, los suscriptores pueden acabar con duplicados.
          - id: feeds/stylesheet/invalid
            title: Los navegadores no aplicarán la hoja de estilo del feed
            severity: warning
            score: "4.7"
            scope: site
            rulesets:
              - feeds
            references:
              - https://www.w3.org/TR/xml-stylesheet/
            rationale: Una hoja de estilo de otro origen, que responde con error o que no se sirve como tipo XSL se ignora, así que quien abra el feed verá XML sin procesar.
          - id: feeds/template-placeholder/present
            title: El feed contiene marcadores de plantilla o valores vacíos
            severity: error
            score: "8.4"
            scope: page
            rulesets:
              - feeds
            references:
              - https://www.rssboard.org/rss-profile
            rationale: Etiquetas de plantilla sobrantes o la palabra undefined llegan a los suscriptores como texto de las entradas, y el feed parece roto.
          - id: feeds/url/invalid
            title: El feed usa URL relativas
            severity: warning
            score: "5.7"
            scope: page
            rulesets:
              - feeds
            references:
              - https://www.rssboard.org/rss-profile
            rationale: Una URL relativa en el canal, un elemento o un adjunto de un feed RSS o JSON Feed no tiene base en el lector, así que sus enlaces y descargas fallan para los suscriptores.
          - id: feeds/validator/missing
            title: El feed no se puede descargar de forma condicional
            severity: warning
            score: "5.2"
            scope: page
            rulesets:
              - feeds
            references:
              - https://www.rfc-editor.org/rfc/rfc9110#section-13.1
            rationale: Sin ETag ni Last-Modified, o sin respuestas 304, cada lector descarga el feed completo en cada consulta, lo que cuesta ancho de banda al servidor y ralentiza las actualizaciones de los suscriptores.
          - id: feeds/websub-hub/unreachable
            title: Un hub WebSub indicado por el feed no responde
            severity: warning
            score: "5.2"
            scope: site
            rulesets:
              - websub
            references:
              - https://www.w3.org/TR/websub/#discovery
            rationale: Los suscriptores que dependen del hub no reciben actualizaciones push mientras esté caído. Los hubs solo se sondean cuando org.spiderlint.feeds.websub está activado.
            message: "el hub WebSub declarado no responde: {got}"
          - id: feeds/websub-self/missing
            title: El feed indica un hub WebSub pero no su propia URL
            severity: warning
            score: "4.0"
            scope: page
            rulesets:
              - feeds
              - websub
            references:
              - https://www.w3.org/TR/websub/#discovery
            rationale: Un suscriptor WebSub necesita la URL propia del feed para registrarse en el hub. Sin ella el enlace al hub no sirve y los suscriptores recurren a consultas periódicas.
          - id: feeds/xslt/deprecated
            title: El feed tiene estilo mediante una hoja XSLT
            severity: info
            score: "1.8"
            scope: page
            rulesets:
              - feeds
            references:
              - https://chromestatus.com/feature/4709671889534976
            rationale: Chrome 158 deja de aplicar XSLT, así que quien abra el feed en ese navegador verá XML sin procesar en lugar de la página con estilo.
          - id: green/page-co2/excessive
            title: Una visita a la página emite más CO2e que el presupuesto de 0,209 g
            severity: info
            score: "dynamic: 0.209 → 1.4, 1 → 2.6, 3 → 3.2"
            scope: page
            rulesets:
              - sustainability
            references:
              - https://developers.thegreenwebfoundation.org/co2js/explainer/methodologies-for-calculating-website-carbon/
            rationale: Con este tamaño, la transferencia de la página implica un mayor coste de carbono por cada visitante y se carga más despacio en conexiones malas. La estimación sigue el modelo Sustainable Web Design; solo se revisan las páginas que responden 2xx.
            message: una vista emite demasiado CO2e según el modelo Sustainable Web Design, por encima del presupuesto de 0,209 g (calificación C)
          - id: html-validate/area-alt
            severity: error
            score: "7.5"
            scope: page
            rulesets:
              - html-validate
              - html-validate:a11y
              - html-validate:standard
            references:
              - https://html-validate.org/rules/area-alt.html
          - id: html-validate/aria-hidden-body
            title: "`aria-hidden` must not be used on the `<body>` element as it makes the page inaccessible to assistive technology such as screenreaders"
            severity: error
            score: "7.8"
            scope: page
            rulesets:
              - html-validate
              - html-validate:a11y
            references:
              - https://html-validate.org/rules/aria-hidden-body.html
          - id: html-validate/aria-label-misuse
