            references:
              - https://www.rfc-editor.org/rfc/rfc8470
            rationale: Un atacante puede repetir los datos tempranos, así que una petición como un pago puede ejecutarse dos veces salvo que el servidor responda 425 a las peticiones no idempotentes.
            message: el servidor acepta datos tempranos de TLS 1.3, que un atacante puede repetir; las peticiones no idempotentes deben responder 425
          - id: tls-probe/fallback-scsv/missing
            title: El servidor acepta un retroceso innecesario a una versión anterior de TLS
