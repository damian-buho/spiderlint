            rulesets:
              - seo
            references:
              - https://ogp.me/#metadata
            rationale: Los enlaces compartidos en redes sociales y apps de chat recurren a un título adivinado, que puede verse mal. Solo se revisan las páginas HTML que responden 2xx.
