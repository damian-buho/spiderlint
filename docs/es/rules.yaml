            score: "4.0"
            scope: page
            rulesets:
              - structured-data
            references:
              - https://schema.org/docs/attic.home.html
            rationale: Los buscadores pueden dejar de leer los términos que schema.org ha sustituido, así que los datos que contenían desaparecen de los resultados sin aviso.
          - id: structured-data/url/mismatch
