            message: el servidor acepta un retroceso innecesario a una versión anterior en lugar de rechazarlo
          - id: tls-probe/forward-secrecy/missing
            title: No todos los conjuntos de cifrado aceptados ofrecen secreto perfecto hacia adelante
            severity: warning
