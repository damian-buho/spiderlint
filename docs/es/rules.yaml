            scope: site
            rulesets:
              - tls-probe
            references:
              - https://www.rfc-editor.org/rfc/rfc9325#section-4.2
            rationale: Los conjuntos sin secreto perfecto hacia adelante, con CBC o con bloque de 64 bits permiten descifrar más tarde el tráfico grabado o atacarlo en tránsito. Se omite detrás de Cloudflare.
            message: "el servidor acepta suites sin secreto perfecto hacia adelante, con CBC o con bloque de 64 bits: {got}"
          - id: tls-probe/compression/insecure
