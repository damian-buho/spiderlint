            references:
              - https://www.rfc-editor.org/rfc/rfc9110#section-10.2.3
            rationale: A delay under 10 seconds brings clients straight back to a server that is already shedding load, which keeps it overloaded. Only 429 and 503 responses with a readable Retry-After are checked.
            message: Retry-After asks clients back too soon, which brings the load straight back to a server that is shedding it
          - id: http/server-timing/missing
            title: A development or staging site sends no Server-Timing
            severity: hint
            score: "0.2"
            scope: page
            rulesets:
              - suggestions
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Headers/Server-Timing
            rationale: Without it, developers and browser tools cannot see where the server spent its time. Only sites declared as development or staging are checked.
            message: no Server-Timing header shows where the server spent its time
          - id: http/server/disclosing
            title: The server reveals the software behind it
            severity: warning
            score: "5.0"
            scope: site
            rulesets:
              - security-headers
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Reference/Headers/Server
            rationale: Headers such as Server and X-Powered-By, and the generator meta tag, name the product and often its version, which tells attackers which known flaws to try. Names a CDN or host sets and the owner cannot remove are not reported, and a name without a version is only a hint.
          - id: http/sunset/invalid
            title: The Sunset header is not an HTTP date
            severity: warning
            score: "3.7"
            scope: page
            rulesets:
              - performance
            references:
              - https://www.rfc-editor.org/rfc/rfc8594
            rationale: Clients that cannot read the date will not warn that the resource is going away. Only responses that send Sunset are checked.
            message: Sunset should be an HTTP-date
          - id: http/tdm-reservation/invalid
            title: The tdm-reservation header is not 0 or 1
            severity: warning
            score: "3.5"
            scope: page
            rulesets:
              - seo
            references:
              - https://www.w3.org/community/reports/tdmrep/CG-FINAL-tdmrep-20240510/
            rationale: Text-and-data-mining crawlers cannot read the site’s reservation, so they may mine content the owner meant to reserve. Only responses that send the header are checked.
            message: tdm-reservation should be 0 or 1
          - id: http/use-as-dictionary-match/invalid
            title: Use-As-Dictionary has no match pattern
            severity: warning
            score: "3.5"
            scope: page
            rulesets:
              - performance
            references:
              - https://www.rfc-editor.org/rfc/rfc9842#section-2.1
            rationale: A dictionary without a match pattern is never used for later requests, so the compression it was meant to improve does not happen. Only responses that send Use-As-Dictionary are checked.
            message: Use-As-Dictionary needs a match="<URL pattern>" member
          - id: http/use-as-dictionary/invalid
            title: The Use-As-Dictionary header is malformed
            severity: warning
            score: "3.4"
            scope: page
            rulesets:
              - performance
            references:
              - https://www.rfc-editor.org/rfc/rfc9842#section-2.1
            rationale: Clients ignore a header they cannot parse, so the dictionary is never used and the compression gain is lost. Only responses that send Use-As-Dictionary are checked.
            message: Use-As-Dictionary breaks its structured-field grammar, so clients ignore it
          - id: http/validator/missing
            title: The response has neither ETag nor Last-Modified
            severity: info
            score: "2.6"
            scope: page
            rulesets:
              - performance
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Caching#validation
            rationale: Without a validator, a browser cannot ask whether its stored copy is still current, so it downloads the whole response again once the copy expires. Only 2xx responses are checked.
            message: no ETag or Last-Modified to revalidate against
          - id: http/vary-accept-encoding/missing
            title: "A compressed response lacks Vary: Accept-Encoding"
            severity: warning
            score: "5.4"
            scope: page
            rulesets:
              - performance
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Headers/Vary
            rationale: Without it, a shared cache or CDN may store the compressed copy and hand it to a client that cannot decompress it, or the other way round. Only responses that declare a Content-Encoding are checked.
            message: "a compressed response should carry Vary: Accept-Encoding"
          - id: http/vary-star/present
            title: "Vary: * makes the response uncacheable"
            severity: warning
            score: "5.6"
            scope: page
            rulesets:
              - performance
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Headers/Vary
            rationale: A Vary of * tells caches that every request differs, so browsers and CDNs cannot reuse the response and every visit hits the server. Only responses that send a Vary header are checked.
            message: "Vary: * makes the response uncacheable"
          - id: http/vary/invalid
            title: The Vary header is malformed
            severity: warning
            score: "4.2"
            scope: page
            rulesets:
              - performance
            references:
              - https://www.rfc-editor.org/rfc/rfc9110#section-12.5.5
            rationale: Caches that cannot read Vary may serve the wrong variant of a page, such as the wrong language or compression, to a visitor. Only responses that send Vary are checked.
            message: Vary breaks RFC 9110 §12.5.5
          - id: http/version/outdated
            title: The server answers over HTTP/1.1 instead of HTTP/2 or HTTP/3
            severity: warning
            score: "5.8"
            scope: page
            rulesets:
              - performance
            references:
              - https://developer.mozilla.org/docs/Glossary/HTTP_2
            rationale: HTTP/1.1 loads resources less efficiently, so pages take longer to appear, most of all on slow or lossy connections. Only responses that report a protocol version are checked.
            message: the server should speak HTTP/2 or HTTP/3
          - id: http/x-xss-protection/insecure
            title: X-XSS-Protection is switched on
            severity: warning
            score: "4.5"
            scope: page
            rulesets:
              - security-headers
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Headers/X-XSS-Protection
            rationale: The old browser filter this header enables can itself introduce cross-site scripting holes, so the header should be absent or 0. Only responses that send it are checked.
            message: X-XSS-Protection should be absent or 0
          - id: i18n/content-language/mismatch
            title: Content-Language and lang name different languages
            severity: info
            score: "2.4"
            scope: page
            rulesets:
              - i18n
            references:
              - https://www.w3.org/International/questions/qa-http-and-lang
            rationale: The header and the html lang attribute disagree about the page’s language, so browsers, translation tools and search engines may pick the wrong one. Pages lacking either are skipped.
          - id: i18n/hreflang-return/missing
            title: A language version does not link back
            severity: warning
            score: "5.2"
            scope: site
            rulesets:
              - i18n
            references:
              - https://developers.google.com/search/docs/specialty/international/localized-versions#html
            rationale: Hreflang works only when versions name each other, so without the return link search engines may ignore the annotation and visitors land on the wrong language. Only crawled pages that answer 2xx are judged.
          - id: i18n/hreflang/unreachable
            title: An hreflang link points at a page that fails or redirects
            severity: warning
            score: "5.6"
            scope: site
            rulesets:
              - i18n
            references:
              - https://developers.google.com/search/docs/specialty/international/localized-versions#html
            rationale: Search engines ignore hreflang targets that answer with an error or a redirect, so that language version is never offered to its readers. Targets answering outside 2xx, or redirecting, are reported.
          - id: i18n/metadata-language/mismatch
            title: The title or description is in another language than the page declares
            severity: info
            score: "2.8"
            scope: page
            rulesets:
              - i18n
            references:
              - https://www.w3.org/International/questions/qa-html-language-declarations
            rationale: Screen readers pronounce text by the lang attribute and search engines use it to pick the audience, so a mismatch garbles speech and can show the page to the wrong readers. Judged only when language detection is confident.
          - id: icons/apple-touch/missing
            title: The Apple touch icon is missing or unfit
            severity: warning
            score: "3.8"
            scope: site
            rulesets:
              - icons
              - recommended
            references:
              - https://developer.apple.com/library/archive/documentation/AppleApplications/Reference/SafariWebContent/ConfiguringWebApplications/ConfiguringWebApplications.html
            rationale: iPhone and iPad visitors who add the site to their home screen get a screenshot or blank tile instead of the logo.
            message: "the Apple touch icon is missing or unfit: {got}"
          - id: icons/declared-size/mismatch
            title: Icons are not the size or type they declare
            severity: warning
            score: "4.2"
            scope: site
            rulesets:
              - icons
              - recommended
            references:
              - https://developer.mozilla.org/docs/Web/HTML/Reference/Attributes/sizes
            rationale: Browsers pick an icon by its declared size and type, so a wrong declaration makes them choose a poor fit or reject the file.
            message: "icons are not the size or type they declare: {got}"
          - id: icons/favicon/missing
            title: The favicon is missing or broken
            severity: warning
            score: "4.6"
            scope: site
            rulesets:
              - icons
              - recommended
            references:
              - https://developers.google.com/search/docs/appearance/favicon-in-search
            rationale: Browser tabs, bookmarks and search results show a blank or default icon instead of the site’s, which makes it harder to recognise.
            message: "the favicon is missing or broken: {got}"
          - id: icons/mask-icon/invalid
            title: The Safari pinned tab icon is unusable
            severity: off
            score: "3.3"
            scope: site
            rulesets:
              - icons
              - recommended
            references:
              - https://developer.apple.com/library/archive/documentation/AppleApplications/Reference/SafariWebContent/pinnedTabs/pinnedTabs.html
            rationale: Safari draws a pinned tab from this icon, so a broken one leaves a blank or wrongly coloured tab. Safari 12 and later use the SVG favicon instead, so this matters little.
            message: "the Safari pinned tab icon is unusable; since Safari 12 an SVG rel=icon serves instead: {got}"
          - id: icons/ms-tile/unreachable
            title: A Windows tile image or browserconfig.xml is broken
            severity: off
            score: "3.3"
            scope: site
            rulesets:
              - icons
              - recommended
            references:
              - https://learn.microsoft.com/previous-versions/windows/internet-explorer/ie-developer/platform-apis/dn320426(v=vs.85)
            rationale: A Windows start-menu tile for the site shows a blank or default image. It only matters for old Windows pinning, so the impact is small.
            message: "a Windows tile image or browserconfig.xml is broken: {got}"
          - id: icons/svg/invalid
            title: There is no usable SVG favicon
            severity: off
            score: "3.3"
            scope: site
            rulesets:
              - icons
              - recommended
            references:
              - https://developer.mozilla.org/docs/Web/HTML/Reference/Attributes/rel#icon
            rationale: An SVG icon stays sharp at any size and can follow dark mode; without one browsers fall back to a fixed-size bitmap.
            message: "no usable SVG favicon: {got}"
          - id: images/compression/weak
            title: An image can be re-encoded much smaller in its own format
            severity: warning
            score: "4.8"
            scope: site
            rulesets:
              - images
            references:
              - https://web.dev/articles/use-imagemin-to-compress-images
            rationale: Unoptimised images make pages heavier than they need to be, so visitors on slow connections wait longer. Only images where a re-encode saves a meaningful share are flagged.
          - id: images/dimensions/missing
            title: Images lack width and height attributes
            severity: warning
            score: "5.4"
            scope: page
            rulesets:
              - images
            references:
              - https://web.dev/articles/optimize-cls#images-without-dimensions
            rationale: Without them the browser cannot reserve space, so the page jumps as each image loads and visitors lose their place while reading. It also hurts the Cumulative Layout Shift score search engines read.
          - id: images/font-display/missing
            title: Web fonts hide text while they load
            severity: warning
            score: "5.0"
            scope: site
            rulesets:
              - images:assets
            references:
              - https://developer.mozilla.org/docs/Web/CSS/@font-face/font-display
            rationale: "An @font-face without font-display: swap, fallback or optional leaves text invisible until the font arrives, so visitors on slow connections stare at a blank page."
          - id: images/font-format/outdated
            title: A web font is served in a format other than WOFF2
            severity: warning
            score: "4.4"
            scope: site
            rulesets:
              - images:assets
            references:
              - https://web.dev/articles/reduce-webfont-size
            rationale: WOFF2 compresses fonts best and every current browser supports it, so other formats make visitors download more for the same text.
          - id: images/format/outdated
            title: A JPEG, PNG or GIF image would be smaller as WebP or AVIF
            severity: warning
            score: "5.2"
            scope: site
            rulesets:
              - images
            references:
              - https://web.dev/articles/choose-the-right-image-format
            rationale: Old image formats cost visitors extra bytes on every page view, which slows loading on mobile connections. Only images where a re-encode saves a meaningful share are flagged.
          - id: images/lazy-loading/missing
            title: Images below the fold are not lazy-loaded
            severity: warning
            score: "4.8"
            scope: page
            rulesets:
              - images:live
            references:
              - https://web.dev/articles/browser-level-image-lazy-loading
            rationale: Images the visitor has not scrolled to still download up front and compete with the content they came to read. Only pages rendered in a browser are judged.
          - id: images/lazy-loading/slow
            title: Images in the first viewport are lazy-loaded
            severity: warning
            score: "5.8"
            scope: page
            rulesets:
              - images:live
            references:
              - https://web.dev/articles/lcp-lazy-loading
            rationale: A lazy image visible on arrival starts loading late, which delays the largest content and makes the page feel slow. Only pages rendered in a browser are judged.
          - id: images/minification/missing
            title: A stylesheet or script is served without minification
            severity: warning
            score: "4.2"
            scope: site
            rulesets:
              - images:assets
            references:
              - https://web.dev/articles/reduce-network-payloads-using-text-compression
            rationale: Whitespace and long names in CSS and JavaScript add bytes that every visitor downloads before the page can render. Only files where minifying saves a meaningful share are flagged.
          - id: images/rendered-size/large
            title: Images ship far more pixels than the page renders
            severity: warning
            score: "4.4"
            scope: page
            rulesets:
              - images:live
            references:
              - https://web.dev/articles/serve-responsive-images
            rationale: An image much wider than its box wastes bandwidth and slows loading, especially on phones. Vector images are exempt, and only pages rendered in a browser are judged.
          - id: images/srcset/large
            title: Images without srcset are far wider than they display
            severity: warning
            score: "4.6"
            scope: page
            rulesets:
              - images
            references:
              - https://web.dev/articles/serve-responsive-images
            rationale: A single large file is sent to every screen, so phones download pixels they never show. Only images with a numeric width attribute and no srcset are compared.
          - id: images/weight/large
            title: An image is heavier than the weight limit
            severity: warning
            score: "5.6"
            scope: site
            rulesets:
              - images
            references:
              - https://developer.mozilla.org/docs/Learn_web_development/Extensions/Performance/Multimedia
            rationale: A very large image file slows the page for every visitor and eats mobile data. The limit is a setting, 200 kB by default.
          - id: insight/number/outlier
            title: A few pages are far heavier or slower than the rest of the site
            severity: info
            score: "3.0"
            scope: site
            rulesets:
              - insights
            references:
              - https://www.itl.nist.gov/div898/handbook/eda/section3/eda35h.htm
            rationale: Pages whose size, request count, load time or CO2 estimate sits far above the median are slow for visitors and costly on mobile data. By default at least 20 pages are needed to compare.
          - id: insight/value/inconsistent
            title: A few pages are served differently from the rest of the site
            severity: info
            score: "2.0"
            scope: site
            rulesets:
              - insights
            rationale: When nearly every page shares an HTTP version, content encoding or cache policy and a few differ, the odd ones are usually a misconfigured route or an overlooked rule, and visitors get them slower or uncached. By default at least 20 pages are needed, with one value on 80% of them.
          - id: keyboard/focus-outline/missing
            title: Focused elements show no visible focus indicator
            severity: warning
            score: "6.0"
            scope: page
            rulesets:
              - keyboard
            references:
              - https://www.w3.org/WAI/WCAG22/Understanding/focus-visible.html
            rationale: Keyboard users cannot tell which control is active when focusing it changes nothing on screen. Only sampled pages, walked with the Tab key in a browser, are judged.
          - id: keyboard/focus/inaccessible
            title: A focused element is hidden under sticky or fixed content
            severity: warning
            score: "5.8"
            scope: page
            rulesets:
              - keyboard
            references:
              - https://www.w3.org/WAI/WCAG22/Understanding/focus-not-obscured-minimum.html
            rationale: Keyboard users tab to a control they cannot see because a header or banner covers it. Only sampled pages, walked with the Tab key in a browser, are judged.
          - id: keyboard/forced-colors-focus/missing
            title: Focus indicators vanish under forced colours
            severity: warning
            score: "5.4"
            scope: page
            rulesets:
              - keyboard
            references:
              - https://developer.mozilla.org/docs/Web/CSS/@media/forced-colors
            rationale: A focus ring drawn only with box-shadow disappears in Windows high-contrast mode, so keyboard users lose track of focus. Only sampled pages are judged, in a browser.
          - id: keyboard/skip-link/missing
            title: The first Tab stop is not a skip link to the main content
            severity: info
            score: "2.8"
            scope: page
            rulesets:
              - keyboard
            references:
              - https://www.w3.org/WAI/WCAG22/Techniques/general/G1
            rationale: Keyboard and screen-reader users must tab through the whole navigation on every page before reaching the content. Only sampled pages are judged, in a browser.
          - id: keyboard/tab-order/inaccessible
            title: Keyboard focus is trapped or skips interactive elements
            severity: warning
            score: "6.4"
            scope: page
            rulesets:
              - keyboard
            references:
              - https://www.w3.org/WAI/WCAG22/Understanding/keyboard.html
            rationale: Visitors who cannot use a mouse get stuck or cannot reach a control at all. Only sampled pages, walked with the Tab key in a browser, are judged.
          - id: lighthouse/accessibility
            title: Low Lighthouse accessibility score
            severity: warning
            score: "dynamic: 0 → 6.2, 0.9 → 3.3"
            scope: page
            rulesets:
              - lighthouse
            references:
              - https://developer.chrome.com/docs/lighthouse/accessibility/scoring
            message: Lighthouse accessibility score is {got}, under 0.9
          - id: lighthouse/best-practices
            title: Low Lighthouse best-practices score
            severity: warning
