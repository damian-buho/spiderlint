            references:
              - https://web.dev/articles/cls
            message: CLS is {got} in the lab, over 0.1
          - id: lighthouse/fcp
            title: FCP over 1800 ms in the lab
            severity: warning
            score: "dynamic: 1800 → 3.4, 3000 → 6.0"
            scope: page
            rulesets:
              - lighthouse
            references:
              - https://web.dev/articles/fcp
            message: FCP is {got} ms in the lab, over 1800 ms
          - id: lighthouse/lcp
            title: LCP over 2500 ms in the lab
            severity: warning
            score: "dynamic: 2500 → 3.4, 6000 → 6.0"
            scope: page
            rulesets:
              - lighthouse
            references:
              - https://web.dev/articles/lcp
            message: LCP is {got} ms in the lab, over 2500 ms
          - id: lighthouse/performance
            title: Low Lighthouse performance score
            severity: warning
            score: "dynamic: 0 → 6.4, 0.9 → 3.3"
            scope: page
            rulesets:
              - lighthouse
            references:
              - https://developer.chrome.com/docs/lighthouse/performance/performance-scoring
            message: Lighthouse performance score is {got}, under 0.9
          - id: lighthouse/seo
            title: Low Lighthouse SEO score
            severity: warning
            score: "dynamic: 0 → 5.4, 0.9 → 3.3"
            scope: page
            rulesets:
              - lighthouse
            references:
              - https://developer.chrome.com/docs/lighthouse/overview
            message: Lighthouse SEO score is {got}, under 0.9
          - id: lighthouse/tbt
            title: TBT over 200 ms in the lab
            severity: warning
            score: "dynamic: 200 → 3.4, 600 → 6.0"
            scope: page
            rulesets:
              - lighthouse
            references:
              - https://web.dev/articles/tbt
            message: TBT is {got} ms in the lab, over 200 ms
          - id: link-text/label/inaccessible
            title: Links use generic text such as “click here”
            severity: warning
            score: "4.6"
            scope: page
            rulesets:
              - link-text
            references:
              - https://www.w3.org/WAI/WCAG22/Understanding/link-purpose-in-context.html
            rationale: Screen-reader users often browse a list of links out of context, where “read more” says nothing, and search engines learn little from such anchors. Only pages in English, Spanish or Ukrainian are judged.
          - id: links/click-depth/excessive
            title: A page is more than 3 links from the start page
            severity: info
            score: "dynamic: 4 → 1.6, 10 → 3.0"
            scope: page
            rulesets:
              - graph
            references:
              - https://developers.google.com/search/docs/crawling-indexing/links-crawlable
            rationale: Pages buried deep in the site are found late by crawlers and are rarely reached by visitors. Search engines may treat them as less important. Only HTML pages that answer 2xx and were reached by the crawl are checked.
            message: a page is more than 3 links away from the start page
          - id: links/external-rel/missing
            title: External links lack the rel tokens the policy requires
            severity: off
            score: "5.0"
            scope: page
            rulesets:
              - links
            references:
              - https://developers.google.com/search/docs/crawling-indexing/qualify-outbound-links
            rationale: Search engines ask sites to mark paid links sponsored and user content ugc, and a link missing the tokens declared for its host may be read as passing ranking and risk a penalty. Only hosts matching the configured policy are checked.
          - id: links/external/unreachable
            title: An external link leads to a page that does not load
            severity: off
            score: "dynamic: 0 → 6.0, 404 → 4.6, 500 → 6.0"
            scope: site
            rulesets:
              - links
              - web-quick
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Reference/Status/404
            rationale: Visitors who follow the link reach an error or a dead site, which makes the page look neglected. Only probed links that answer 4xx or 5xx, or nothing, count; rate limits, bot walls and excluded hosts are not judged.
          - id: links/incoming/weak
            title: Only a few pages of the site link to this page
            severity: info
            score: "1.8"
            scope: page
            rulesets:
              - graph
            references:
              - https://developers.google.com/search/docs/crawling-indexing/links-crawlable
            rationale: A page that few others link to is hard to find and signals little importance to search engines. Only HTML pages that answer 2xx are checked, and not the start page or pages in a paginated series.
            message: only a few pages of the site link here
          - id: links/internal-nofollow/present
            title: Internal links carry rel=nofollow
            severity: warning
            score: "4.2"
            scope: page
            rulesets:
              - links
            references:
              - https://developers.google.com/search/docs/crawling-indexing/qualify-outbound-links
            rationale: nofollow on the site’s own links withholds ranking signals from its pages and hampers crawlers in discovering them. To keep crawlers out of a page, use robots.txt or noindex instead.
          - id: links/internal/redirected
            title: An internal link points at a URL that redirects
            severity: warning
            score: "4.6"
            scope: site
            rulesets:
              - links
            references:
              - https://developers.google.com/search/docs/crawling-indexing/301-redirects
            rationale: Every visitor and crawler pays an extra round trip before reaching the page, which slows loading. Pointing the link at the final URL avoids the hop.
          - id: links/internal/unreachable
            title: An internal link leads to a page that does not load
            severity: error
            score: "dynamic: 0 → 8.4, 404 → 7.4, 500 → 8.4"
            scope: site
            rulesets:
              - links
            references:
              - https://developers.google.com/search/docs/crawling-indexing/http-network-errors
            rationale: Visitors who follow the link reach an error page, and search engines waste crawl time on it and may drop the page. Counted for every crawled page that answers 4xx or 5xx, or does not answer at all.
          - id: links/outgoing/missing
            title: A page links to no other page of the site
            severity: info
            score: "1.6"
            scope: page
            rulesets:
              - graph
            references:
              - https://developers.google.com/search/docs/crawling-indexing/links-crawlable
            rationale: "A page without outgoing links is a dead end: visitors must use the back button, and crawlers find nothing further from it. Only HTML pages that answer 2xx are checked."
