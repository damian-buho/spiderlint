            score: "4.6"
            scope: site
            rulesets:
              - mail
            references:
              - https://www.rfc-editor.org/rfc/rfc8460#section-3
            rationale: Senders ignore a malformed record, so no reports of failed TLS deliveries arrive. Checked only on names that take or send mail.
            message: the TLS-RPT record breaks the RFC 8460 grammar (got {got})
          - id: mail/tls-rpt/missing
            title: The name has no TLS-RPT record
            severity: info
            score: "1.8"
            scope: site
            rulesets:
              - mail
            references:
              - https://www.rfc-editor.org/rfc/rfc8460
            rationale: Without it, mail servers cannot report failed TLS deliveries, so problems with the name’s mail encryption stay unseen. Checked only on names that take or send mail.
            message: no TLS-RPT record, so senders cannot report failed TLS deliveries
          - id: manifest/document/invalid
            title: The web app manifest does not parse
            severity: error
            score: "7.2"
            scope: site
            rulesets:
              - manifest
              - recommended
            references:
              - https://developer.mozilla.org/docs/Web/Progressive_web_apps/Manifest
            rationale: A manifest that is not valid JSON is ignored by browsers, so the site cannot be installed as an app and loses its name and icons on home screens.
          - id: manifest/fields/missing
