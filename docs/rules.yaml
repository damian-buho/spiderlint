              - https://www.rfc-editor.org/rfc/rfc9989#section-4.7
            rationale: Without DMARC, receivers deliver mail forged from the name, so recipients can be phished under its identity. Checked only on names that take or send mail.
            message: no DMARC record applies to a name that takes or sends mail, so receivers deliver mail forged from it
          - id: dns/dnssec-algorithm/deprecated
            title: The zone uses a DNSSEC algorithm that is no longer allowed
            severity: warning
            score: "4.2"
            scope: site
            rulesets:
              - dns
            references:
              - https://www.rfc-editor.org/rfc/rfc8624#section-3.1
            rationale: RFC 8624 forbids the signing algorithm or DS digest, so resolvers may treat the zone as unsigned and its protection against forged answers weakens. Checked only on signed zones.
            message: the zone signs or digests with an algorithm RFC 8624 forbids
          - id: dns/dnssec/broken
            title: The zone’s DNSSEC signatures fail validation
            severity: error
            score: "8.8"
            scope: site
            rulesets:
              - dns
              - dns:core
              - dns:recommended
              - server
            references:
              - https://www.rfc-editor.org/rfc/rfc4035#section-5.5
            rationale: Validating resolvers answer SERVFAIL, so everyone behind them cannot reach the site or its mail. Checked only when the resolver validates DNSSEC.
            message: the zone is signed but fails validation, so every validating resolver answers SERVFAIL
          - id: dns/dnssec/missing
            title: The zone is not signed with DNSSEC
            severity: warning
            score: "5.6"
            scope: site
            rulesets:
              - dns
              - dns:core
              - dns:recommended
              - server
            references:
              - https://www.rfc-editor.org/rfc/rfc9364
            rationale: Without signatures, resolvers cannot detect forged DNS answers, so an attacker on the path can send visitors and mail to a different server.
            message: the zone is not signed with DNSSEC
          - id: dns/https-alpn/mismatch
            title: The HTTPS record and Alt-Svc disagree about HTTP/3
            severity: warning
            score: "3.5"
            scope: site
            rulesets:
              - dns
            references:
              - https://www.rfc-editor.org/rfc/rfc9460#section-7.1
            rationale: When the DNS record and the header differ on whether HTTP/3 is available, browsers get conflicting advice and may try a protocol the server does not serve or skip one it does.
            message: the HTTPS record and Alt-Svc disagree about h3 (got {got})
          - id: dns/https-hints/mismatch
            title: The HTTPS record’s address hints do not match A and AAAA
            severity: warning
            score: "3.6"
            scope: site
            rulesets:
              - dns
            references:
              - https://www.rfc-editor.org/rfc/rfc9460#section-7.3
            rationale: Browsers that trust ipv4hint or ipv6hint connect to addresses the host no longer has, or never try those it does, so connections fail or slow down. Checked only where the record points at the host itself.
            message: ipv4hint or ipv6hint does not match the A and AAAA records
          - id: dns/https-record/missing
            title: The host has no HTTPS DNS record
            severity: warning
            score: "3.8"
            scope: site
            rulesets:
              - dns
              - dns:core
              - dns:recommended
              - server
            references:
              - https://www.rfc-editor.org/rfc/rfc9460
            rationale: Without it, a browser’s first visit learns about HTTP/3 and Encrypted Client Hello only from the Alt-Svc header, one connection later, so first loads are slower and less private.
            message: no HTTPS record, so a first visit learns h3 and ECH only from Alt-Svc, one connection late
          - id: dns/ns-answers/mismatch
            title: The name servers answer the host differently
            severity: warning
            score: "5.8"
            scope: site
            rulesets:
              - dns
            references:
              - https://www.rfc-editor.org/rfc/rfc1034#section-4.3.5
            rationale: Visitors reach different addresses depending on which server their resolver asks, so some may land on a stale or wrong server.
            message: "the name servers answer the host differently, so what a visitor reaches depends on which one their resolver asks: {got}"
          - id: dns/ns-delegation/broken
            title: Listed name servers do not answer for the zone
            severity: warning
            score: "5.5"
            scope: site
            rulesets:
              - dns
            references:
              - https://www.rfc-editor.org/rfc/rfc1912#section-2.8
            rationale: A resolver that picks one of these leftovers of an old provider or an unloaded zone waits out a timeout or gets a refusal, so lookups slow down or fail.
            message: "these name servers are listed for the zone but do not answer for it, a leftover of a decommissioned provider or a zone never loaded: {got}; a resolver that picks one waits out a timeout or gets a refusal"
          - id: dns/ns-delegation/mismatch
            title: The parent zone and the zone list different name servers
            severity: warning
            score: "5.2"
            scope: site
            rulesets:
              - dns
            references:
              - https://www.rfc-editor.org/rfc/rfc1034#section-4.2.2
            rationale: Resolvers reach a server the zone disowns or skip one it lists, so lookups can fail or return stale data.
            message: "the parent zone and the zone’s own NS records name different servers, so resolvers reach a server the zone disowns or skip one it lists: {got}"
          - id: dns/ns-network/single
            title: All name servers sit in one network
            severity: info
            score: "2.2"
            scope: site
            rulesets:
              - dns
            references:
              - https://www.rfc-editor.org/rfc/rfc2182#section-3.1
            rationale: If that one /24 or /48 network fails, every name server goes down together, and the site and its mail with them.
            message: every name server address sits in one /24 or /48
          - id: dns/ns-resolver/mismatch
            title: The resolver’s answer differs from the name servers’ answer
            severity: info
            score: "2.4"
            scope: site
            rulesets:
              - dns
            references:
              - https://www.rfc-editor.org/rfc/rfc2181#section-5.4.1
            rationale: A cached old answer or a split view means some visitors still reach an old address after a change.
            message: the configured resolver answers the host differently from its name servers, a cached old answer or a split view
          - id: dns/ns-serial/mismatch
            title: The name servers serve different versions of the zone
            severity: warning
            score: "5.3"
            scope: site
            rulesets:
              - dns
            references:
              - https://www.rfc-editor.org/rfc/rfc1034#section-4.3.5
            rationale: The servers report different SOA serials, so a change to the zone reaches some visitors late, depending on which server their resolver asks.
            message: the name servers serve different SOA serials, so a zone change reaches some of them late (got {got})
          - id: dns/ns/single
            title: The zone has a single name server
            severity: warning
            score: "5.4"
            scope: site
            rulesets:
              - dns
            references:
              - https://www.rfc-editor.org/rfc/rfc1034#section-4.1
            rationale: When that server is down, nobody can resolve the site or its mail. Flagged when fewer than two name servers are listed.
            message: the zone has {got} name servers, fewer than 2
          - id: dns/nsec3-iterations/excessive
            title: NSEC3 uses extra hashing iterations or a salt
            severity: warning
            score: "3.3"
            scope: site
            rulesets:
              - dns
            references:
              - https://www.rfc-editor.org/rfc/rfc9276#section-3.1
            rationale: Per RFC 9276, extra iterations and a salt add resolver work without real protection, and some resolvers treat such answers as insecure. Checked only on zones that use NSEC3.
            message: NSEC3 uses extra iterations or a salt (got {got})
          - id: dns/null-mx/invalid
            title: A null MX sits on a name that takes or sends mail
            severity: warning
            score: "5.0"
            scope: site
            rulesets:
              - dns:mail
              - mail
              - mail:recommended
              - server
            references:
              - https://www.rfc-editor.org/rfc/rfc7505#section-4
            rationale: A null MX tells senders the name accepts no mail, so they may drop mail addressed to it, and receivers may refuse mail it sends. Checked only on names that appear to take or send mail.
            message: a null MX on a name that takes or sends mail, so senders may drop mail to it and receivers may refuse mail from it (got {got})
          - id: dns/null-mx/missing
            title: A name that takes no mail has no null MX record
            severity: warning
            score: "5.6"
            scope: site
            rulesets:
              - dns:mail
            references:
              - https://www.rfc-editor.org/rfc/rfc7505
            rationale: Without a null MX, senders fall back to the name’s A or AAAA address and keep retrying mail it never accepts, for days. Checked only on names that appear to take and send no mail.
            message: no null MX, so senders fall back to the name’s A or AAAA address and retry mail it never takes for days (got {got})
          - id: dns/recursion/insecure
            title: An authoritative name server answers recursive queries
            severity: warning
            score: "6.0"
            scope: site
            rulesets:
              - dns
              - dns:recommended
              - server
            references:
              - https://www.rfc-editor.org/rfc/rfc5358
            rationale: Open to anyone, it can be abused for traffic amplification attacks and cache poisoning.
            message: an authoritative name server answers recursive queries for any name, which lends it to amplification attacks and cache poisoning
          - id: dns/resolver-answers/mismatch
            title: The compared resolvers give different addresses for the host
            severity: info
            score: "2.0"
            scope: site
            rulesets:
              - dns
            references:
              - https://www.rfc-editor.org/rfc/rfc2181#section-5.4.1
            rationale: Geo-DNS does this on purpose; a stale or split view does not, and it sends some visitors to an old or wrong server. Checked only when several resolvers are compared.
            message: the compared resolvers give {got} different answers for the host; geo-DNS does this on purpose, a stale or split view does not
          - id: dns/resolver-rcode/broken
            title: The compared resolvers disagree on whether the host resolves
            severity: warning
            score: "4.6"
            scope: site
            rulesets:
              - dns
            references:
              - https://www.rfc-editor.org/rfc/rfc4035#section-5.5
            rationale: Some resolvers answer while others fail, so part of the visitors cannot reach the site; a SERVFAIL on validating resolvers alone points at a broken DNSSEC chain. Checked only when several resolvers are compared.
            message: the compared resolvers disagree on whether the host resolves (got {got}); a SERVFAIL on a validating resolver alone points at DNSSEC
          - id: dns/resolver-validation/broken
            title: Resolvers disagree on whether the signed zone validates
            severity: info
            score: "1.8"
            scope: site
            rulesets:
              - dns
            references:
              - https://www.rfc-editor.org/rfc/rfc4035#section-4.3
            rationale: Some compared resolvers validate the signed zone and some do not, which points at a DS or key problem that fails lookups for visitors behind validating resolvers. Checked only on signed zones.
            message: some compared resolvers validate the signed zone and some do not (got {got})
          - id: dns/rrsig/expiring
            title: The zone’s DNSSEC signatures are close to expiring
            severity: warning
            score: "4.4"
            scope: site
            rulesets:
              - dns
            references:
              - https://www.rfc-editor.org/rfc/rfc6781#section-4.4.2
            rationale: With under a quarter of the validity left, re-signing has probably stalled; once the signatures expire, validating resolvers fail every lookup and the site and its mail vanish for their users.
            message: less than a quarter of the host’s signature validity is left, so re-signing has stalled (got {got})
          - id: dns/soa-timers/range
            title: The SOA timers are outside the recommended ranges
            severity: info
            score: "1.2"
            scope: site
            rulesets:
              - dns
            references:
              - https://www.rfc-editor.org/rfc/rfc1912#section-2.2
            rationale: Refresh, retry, expire or minimum values far from RFC 1912’s ranges slow the spread of changes or make secondary servers drop the zone too early. Skipped where the DNS provider manages the SOA.
            message: "the SOA {field} is {got}, outside what RFC 1912 §2.2 recommends: refresh 1200–43200 s, retry below refresh, expire 1209600–2419200 s, minimum 300–86400 s, a listed name server as primary"
          - id: dns/spf-all/weak
            title: The SPF record does not end in -all or ~all
            severity: warning
            score: "5.7"
            scope: site
            rulesets:
              - dns:mail
              - mail
              - mail:recommended
              - server
            references:
              - https://www.rfc-editor.org/rfc/rfc7208#section-5.1
            rationale: Without a closing -all, ~all or redirect, receivers let any server send as the name, so forged mail passes the SPF check. Checked only on names that take or send mail.
            message: SPF does not end in -all or ~all, so receivers let any server send as this name (got {got})
          - id: dns/spf-null/missing
            title: A name that sends no mail has no deny-all SPF record
            severity: warning
            score: "6.1"
            scope: site
            rulesets:
              - dns:mail
            references:
              - https://www.rfc-editor.org/rfc/rfc7208#section-5.1
            rationale: Without a lone SPF record of v=spf1 -all, receivers cannot refuse mail forged from this name, so anyone can impersonate it to phish recipients. Checked only on names that appear to take and send no mail.
            message: SPF is not a lone v=spf1 -all, so receivers cannot refuse mail forged from this name (got {got})
          - id: dns/spf/duplicate
            title: A mail name has no SPF record or more than one
            severity: warning
            score: "5.8"
            scope: site
            rulesets:
              - dns:mail
              - mail
              - mail:recommended
              - server
            references:
              - https://www.rfc-editor.org/rfc/rfc7208#section-4.5
            rationale: With no SPF record, nobody can check which servers may send as the name; with two, every check fails and receivers may reject genuine mail. Checked only on names that take or send mail.
            message: a name that takes or sends mail needs exactly one v=spf1 record, since none lets anyone send as it and two fail every check (got {got})
          - id: dns/ttl/range
            title: A record’s TTL is very short or very long
            severity: hint
            score: "0.6"
            scope: site
            rulesets:
              - dns
            references:
              - https://www.rfc-editor.org/rfc/rfc1912#section-2.2
            rationale: A TTL under 300 seconds multiplies DNS load and lookup delay; over a day, a fix or a migration takes that long to reach visitors. NS records may go up to two days.
            message: a record TTL sits outside 300 seconds to one day, two for NS; fine just before a migration, costly otherwise (got {got})
          - id: domain/ns-registry/mismatch
            title: The registry and the zone list different name servers
            severity: warning
            score: "5.0"
            scope: site
            rulesets:
              - dns
            references:
              - https://www.rfc-editor.org/rfc/rfc1034#section-4.2.2
            rationale: Resolvers may be sent to servers the zone’s owner does not control or does not know, so answers can be wrong or missing.
            message: "the name servers the registry lists differ from the zone’s own NS records: {got}"
          - id: domain/registration/expiring
            title: The domain registration expires within 30 days
            severity: error
            score: "dynamic: 0 → 9.6, 6 → 7.0, 7 → 6.5, 30 → 3.5"
            scope: site
            rulesets:
              - dns
              - dns:recommended
              - server
            references:
              - https://www.rfc-editor.org/rfc/rfc9083#section-4.5
            rationale: When it lapses, the site and its mail stop resolving and someone else can register the name. Checked only for registered domains that the RDAP lookup finds.
            message: the domain registration expires in {got} days, and the site and its mail stop resolving when it lapses
          - id: domain/transfer-lock/missing
            title: The domain has no transfer lock
            severity: warning
            score: "6.2"
            scope: site
            rulesets:
              - dns
              - dns:recommended
              - server
            references:
              - https://www.icann.org/resources/pages/epp-status-codes-2014-06-16-en
            rationale: Whoever takes over the registrar account can move the domain to another registrar, and the site and mail go with it.
            message: the registration carries no transfer lock, so whoever takes over the registrar account can move the domain away (status {got})
          - id: feeds/archive-link/unreachable
            title: The feed’s archive links lead nowhere
            severity: warning
            score: "3.5"
            scope: site
            rulesets:
              - feeds
            references:
              - https://www.rfc-editor.org/rfc/rfc5005
            rationale: Archive links (prev-archive, next-archive, current) that answer an error or are no feed stop readers from fetching older items, and a complete feed should not name archive pages at all.
          - id: feeds/cache-control/mismatch
            title: The feed’s caching works against its readers
            severity: warning
            score: "5.1"
            scope: page
            rulesets:
              - feeds
            references:
              - https://www.rfc-editor.org/rfc/rfc9111#section-5.2
            rationale: "Cache-Control: no-store, or a max-age far from the feed’s own ttl, makes readers either refetch constantly or miss updates for hours."
          - id: feeds/charset/mismatch
            title: The feed’s encoding is declared or decoded inconsistently
            severity: warning
            score: "5.5"
            scope: page
            rulesets:
              - feeds
            references:
              - https://www.w3.org/TR/xml/#charencoding
            rationale: When the header and the XML declaration disagree, or the text shows garbled characters, accented and non-Latin letters in titles and content turn into nonsense for subscribers.
          - id: feeds/content-escaping/invalid
            title: Item content is escaped twice
            severity: warning
            score: "4.4"
            scope: page
            rulesets:
              - feeds
            references:
              - https://www.rssboard.org/rss-profile
            rationale: Readers show the tags and entities as visible text, such as &lt;p&gt;, instead of formatted content.
          - id: feeds/content-html/insecure
            title: Item content contains markup that readers remove
            severity: warning
            score: "6.3"
            scope: page
            rulesets:
              - feeds
            references:
              - https://www.rssboard.org/rss-profile
            rationale: Readers strip scripts, frames, forms, event handlers and positioned styles for safety, so the item may appear broken or incomplete.
          - id: feeds/content-markup/invalid
            title: Item content is unrendered Markdown or MDX
            severity: error
            score: "8.0"
            scope: page
            rulesets:
              - feeds
            references:
              - https://www.rssboard.org/rss-profile
            rationale: "Readers display the text as it is, so subscribers see raw syntax such as ## and [text](url) instead of formatted posts."
          - id: feeds/content-type/mismatch
            title: Item content holds HTML but is declared as plain text
            severity: warning
            score: "5.6"
            scope: page
            rulesets:
              - feeds
            references:
              - https://www.rssboard.org/rss-profile
            rationale: Readers show the tags as text instead of rendering them, so subscribers read markup rather than the post.
          - id: feeds/content-url/invalid
            title: Item content links and images use relative URLs
            severity: warning
            score: "4.5"
            scope: page
            rulesets:
              - feeds
            references:
              - https://www.rssboard.org/rss-profile
            rationale: A reader does not know the page address, so relative links and images inside an item’s HTML break for subscribers.
          - id: feeds/date/invalid
            title: The feed has dates readers cannot parse
            severity: error
            score: "7.2"
            scope: page
            rulesets:
              - feeds
            references:
              - https://www.rssboard.org/rss-profile
            rationale: RSS wants RFC 822 dates, Atom and JSON Feed RFC 3339 ones. Readers drop or misplace items whose date they cannot parse, so posts appear in the wrong order or not at all.
          - id: feeds/discovery-link/mismatch
            title: A feed link announces the wrong type or points to no feed
            severity: warning
            score: "3.4"
            scope: site
            rulesets:
              - feeds
            references:
              - https://www.rssboard.org/rss-autodiscovery
            rationale: Browsers and readers use the type in the head link to choose a parser. A wrong type, or a target that is no feed, makes subscribing fail.
          - id: feeds/discovery-link/missing
            title: Some pages of a group advertise a feed and others do not
            severity: warning
            score: "4.1"
            scope: group
            rulesets:
              - feeds
            references:
              - https://www.rssboard.org/rss-autodiscovery
            rationale: Visitors on a page without the feed link cannot subscribe from there. Only HTML pages that answer 2xx are compared.
          - id: feeds/document/invalid
            title: The feed is not well-formed XML or JSON
            severity: error
            score: "9.0"
            scope: page
            rulesets:
              - feeds
            references:
              - https://www.w3.org/TR/xml/#sec-well-formed
            rationale: Feed readers cannot parse a document that is not well-formed, so subscribers receive no new items from it. The usual cause is a template that does not escape its values.
          - id: feeds/document/large
            title: The feed is too large or served uncompressed
            severity: warning
            score: "5.0"
            scope: page
            rulesets:
              - feeds
            references:
              - https://www.rssboard.org/rss-profile
            rationale: Every poll by every subscriber downloads the whole body. A feed over the max-bytes limit (1 MiB by default), or over 10 KiB without compression, wastes bandwidth and may time out in readers.
          - id: feeds/document/stale
            title: The feed has not been updated for a long time
            severity: info
            score: "2.2"
            scope: page
            rulesets:
              - feeds
            references:
              - https://www.rssboard.org/rss-profile
            rationale: Subscribers and directories take a feed as abandoned once its newest item is older than the stale-days limit (365 days by default). It also fires when the build date is older than the newest item.
          - id: feeds/element/missing
            title: The feed lacks elements its format requires
            severity: error
            score: "8.6"
            scope: page
            rulesets:
              - feeds
            references:
              - https://www.rssboard.org/rss-specification
            rationale: A feed missing a required element (a channel title, link or description in RSS; an id, title, updated or author in Atom; a title or id in JSON Feed) may be rejected by validators or shown blank by readers.
          - id: feeds/element/unknown
            title: The RSS feed uses elements outside the specification
            severity: warning
            score: "3.9"
            scope: page
            rulesets:
              - feeds
            references:
              - https://www.rssboard.org/rss-specification
            rationale: Elements that RSS 2.0 does not define and that sit in no namespace are ignored by readers and make strict validators reject the feed.
          - id: feeds/email/invalid
            title: Feed email fields are not in the address (Name) form
            severity: warning
            score: "4.2"
            scope: page
            rulesets:
              - feeds
            references:
              - https://www.rssboard.org/rss-specification
            rationale: RSS wants managingEditor, webMaster and author as an address followed by a name in brackets. Other forms fail validators and may be shown or linked wrongly by readers.
          - id: feeds/enclosure/invalid
            title: Podcast enclosures disagree with what their host serves
            severity: warning
            score: "6.2"
            scope: page
            rulesets:
              - podcasts
            references:
              - https://podcasters.apple.com/support/823-podcast-requirements
            rationale: "Only podcast feeds. Apps and directories check each audio file with a HEAD request: a file that fails, has another size or type than declared, or lacks byte-range support makes episodes fail to download, show a wrong length or not seek."
          - id: feeds/full-text/missing
            title: The feed carries summaries while the pages hold the full posts
            severity: info
            score: "2.6"
            scope: site
            rulesets:
              - feeds
            references:
              - https://www.rssboard.org/rss-profile
            rationale: Every linked page is far longer than its item, so subscribers must leave their reader to read a post. Only pages of at least 150 words are compared.
          - id: feeds/item-date/future
            title: Feed items are dated in the future
            severity: warning
            score: "3.6"
            scope: page
            rulesets:
              - feeds
            references:
              - https://www.rssboard.org/rss-profile
            rationale: Readers that sort by date show items dated after the response above everything else, and a scheduled post leaks before its time.
          - id: feeds/item-date/mismatch
            title: Feed item dates differ from their pages’ dates
            severity: warning
            score: "5.4"
            scope: site
            rulesets:
              - feeds
            references:
              - https://www.rssboard.org/rss-profile
            rationale: When the feed and the page disagree by more than a day, readers sort the post by the wrong date and search engines see conflicting publication dates.
          - id: feeds/item-id/duplicate
            title: The feed’s items share an ID
            severity: error
            score: "7.6"
            scope: page
            rulesets:
              - feeds
            references:
              - https://www.rssboard.org/rss-profile
            rationale: Readers treat items with the same ID as one post, so one of them is merged into the other or never shown to subscribers.
          - id: feeds/item-id/invalid
            title: Item IDs contain tracking parameters
            severity: warning
            score: "4.8"
            scope: page
            rulesets:
              - feeds
            references:
              - https://www.rssboard.org/rss-profile
            rationale: An ID that carries utm_* or similar campaign parameters changes whenever the campaign does, so readers show the same post again as new.
          - id: feeds/item-id/missing
            title: The feed’s items have no stable ID
            severity: warning
            score: "4.6"
            scope: page
            rulesets:
              - feeds
            references:
              - https://www.rssboard.org/rss-profile
            rationale: Readers tell new items from known ones by their ID. Items without one are shown to subscribers again as new whenever the feed is fetched.
          - id: feeds/item-link/mismatch
            title: Feed items link away from the page’s canonical URL
            severity: warning
            score: "5.9"
            scope: site
            rulesets:
              - feeds
            references:
              - https://www.rssboard.org/rss-profile
            rationale: An item link that differs from the page’s canonical URL splits shares, analytics and search signals across two addresses.
          - id: feeds/item-link/unreachable
            title: Feed items link to pages that fail or redirect
            severity: warning
            score: "6.1"
            scope: site
            rulesets:
              - feeds
            references:
              - https://www.rssboard.org/rss-profile
            rationale: Subscribers who click an item land on an error page or pass through a redirect. Only items whose page the crawl fetched are checked.
          - id: feeds/item-title/invalid
            title: Item titles contain markup or placeholders
            severity: warning
            score: "4.3"
            scope: page
            rulesets:
              - feeds
            references:
              - https://www.rssboard.org/rss-profile
            rationale: Item titles are plain text, so tags, entities or template values show up literally in subscribers’ lists and notifications.
          - id: feeds/item-title/mismatch
            title: Feed item titles differ from their pages’ titles
            severity: info
            score: "2.8"
            scope: site
            rulesets:
              - feeds
            references:
              - https://www.rssboard.org/rss-profile
            rationale: Subscribers see one title in the reader and another on the page, which makes the post harder to recognise.
          - id: feeds/itunes-image/invalid
            title: The podcast artwork is missing or unfit for directories
            severity: warning
            score: "5.0"
            scope: site
            rulesets:
              - podcasts
            references:
              - https://podcasters.apple.com/support/823-podcast-requirements
            rationale: Only podcast feeds. Directories refuse artwork that is not a square JPEG or PNG between 1400 and 3000 px on each side, so the show appears without a cover or is rejected.
            message: "podcast artwork is missing or unfit: {got}"
          - id: feeds/itunes-tags/missing
            title: The podcast feed lacks tags directories require
            severity: warning
            score: "5.8"
            scope: page
            rulesets:
              - podcasts
            references:
              - https://podcasters.apple.com/support/823-podcast-requirements
            rationale: Only podcast feeds. Apple Podcasts and similar directories reject or list incomplete shows when itunes:image, category, explicit, author or language is missing, or an itunes:duration is malformed.
          - id: feeds/json-version/outdated
            title: The JSON Feed uses an outdated version
            severity: warning
            score: "3.7"
            scope: page
            rulesets:
              - feeds
            references:
              - https://www.jsonfeed.org/version/1.1/
            rationale: JSON Feed 1.1 replaced the single author with a list of authors. Readers that follow 1.1 ignore the old form, so authors go missing.
          - id: feeds/language/invalid
            title: The feed’s language is not a valid BCP 47 tag
            severity: warning
            score: "3.8"
            scope: page
            rulesets:
              - feeds
            references:
              - https://www.rfc-editor.org/info/bcp47
            rationale: Readers and podcast directories use the language to filter and group feeds; a value such as “english” is ignored or misread.
          - id: feeds/language/mismatch
            title: The feed’s language differs from the pages that advertise it
            severity: warning
            score: "5.3"
            scope: site
            rulesets:
              - feeds
            references:
              - https://www.rssboard.org/rss-autodiscovery
            rationale: A feed linked from a page in another language is offered to the wrong audience, and readers and directories file it under the wrong language.
          - id: feeds/media-type/invalid
            title: The feed is served with a type readers do not treat as a feed
            severity: warning
            score: "4.9"
            scope: page
            rulesets:
              - feeds
            references:
              - https://www.rssboard.org/rss-profile
            rationale: A type such as text/html, text/plain or application/octet-stream, or none at all, can make browsers show or download the file and lets some readers and discovery tools skip it.
          - id: feeds/permalink/invalid
            title: A guid that is not a URL is marked as a permalink
            severity: warning
            score: "5.8"
            scope: page
            rulesets:
              - feeds
            references:
              - https://www.rssboard.org/rss-specification
            rationale: An RSS guid counts as a permalink unless it says otherwise, so readers try to open a guid that is no URL and subscribers land on a broken link.
          - id: feeds/podcast-guid/missing
            title: The podcast feed has no valid podcast:guid
            severity: warning
            score: "5.4"
            scope: page
            rulesets:
              - podcasts
            references:
              - https://podcasting2.org/docs/podcast-namespace/tags/guid
            rationale: Only podcast feeds. The Podcasting 2.0 GUID identifies the show across hosts; without it, or with a wrong value, moving the feed makes apps treat it as a new show.
          - id: feeds/podcast-locked/missing
            title: The podcast feed has no valid podcast:locked
            severity: info
            score: "2.4"
            scope: page
            rulesets:
              - podcasts
            references:
              - https://podcasting2.org/docs/podcast-namespace/tags/locked
            rationale: Only podcast feeds. Without podcast:locked set to yes, any platform may import the feed under its own account and publish a copy of the show without the owner’s consent. A value other than yes or no is reported too.
          - id: feeds/self-link/missing
            title: The feed names no self URL, or names another one
            severity: warning
            score: "6.0"
            scope: page
            rulesets:
              - feeds
            references:
              - https://www.rssboard.org/rss-profile
            rationale: Readers and aggregators use the self link to recognise a feed reached through several addresses or one that has moved. Without it, or when it points elsewhere, subscribers can end up with duplicates.
          - id: feeds/stylesheet/invalid
            title: The feed’s stylesheet will not be applied by browsers
            severity: warning
            score: "4.7"
            scope: site
            rulesets:
              - feeds
            references:
              - https://www.w3.org/TR/xml-stylesheet/
            rationale: A stylesheet on another origin, one that answers an error, or one not served as an XSL type is ignored, so people who open the feed see raw XML.
          - id: feeds/template-placeholder/present
            title: The feed contains template placeholders or empty values
            severity: error
            score: "8.4"
            scope: page
            rulesets:
              - feeds
            references:
              - https://www.rssboard.org/rss-profile
            rationale: Leftover template tags or the word undefined reach subscribers as post text, which makes the feed look broken.
          - id: feeds/url/invalid
            title: The feed uses relative URLs
            severity: warning
            score: "5.7"
            scope: page
            rulesets:
              - feeds
            references:
              - https://www.rssboard.org/rss-profile
            rationale: A relative URL in an RSS or JSON Feed channel, item or enclosure has no base in a reader, so its links and downloads break for subscribers.
          - id: feeds/validator/missing
            title: The feed cannot be fetched conditionally
            severity: warning
            score: "5.2"
            scope: page
            rulesets:
              - feeds
            references:
              - https://www.rfc-editor.org/rfc/rfc9110#section-13.1
            rationale: Without ETag or Last-Modified, or without 304 answers, every reader downloads the whole feed on every poll, which costs the server bandwidth and slows updates for subscribers.
          - id: feeds/websub-hub/unreachable
            title: A WebSub hub named by the feed does not answer
            severity: warning
            score: "5.2"
            scope: site
            rulesets:
              - websub
            references:
              - https://www.w3.org/TR/websub/#discovery
            rationale: Subscribers relying on the hub receive no pushed updates while it is down. Hubs are probed only when org.spiderlint.feeds.websub is enabled.
            message: "declared WebSub hub does not answer: {got}"
          - id: feeds/websub-self/missing
            title: The feed names a WebSub hub but not its own URL
            severity: warning
            score: "4.0"
            scope: page
            rulesets:
              - feeds
              - websub
            references:
              - https://www.w3.org/TR/websub/#discovery
            rationale: A WebSub subscriber needs the feed’s self URL to register with the hub. Without it the hub link is of no use, and subscribers fall back to polling.
          - id: feeds/xslt/deprecated
            title: The feed is styled with an XSLT stylesheet
            severity: info
            score: "1.8"
            scope: page
            rulesets:
              - feeds
            references:
              - https://chromestatus.com/feature/4709671889534976
            rationale: Chrome 158 stops applying XSLT, so people who open the feed in that browser see raw XML instead of the styled page.
          - id: green/page-co2/excessive
