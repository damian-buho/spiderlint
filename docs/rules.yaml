          - id: markup/captions/missing
            title: A video has no captions or subtitles
            severity: warning
            score: "6.0"
            scope: page
            rulesets:
              - markup
            references:
              - https://www.w3.org/WAI/media/av/captions/
            rationale: Deaf and hard-of-hearing visitors, and anyone watching without sound, cannot follow speech in a video with no text track. Muted videos without controls are exempt.
          - id: markup/input-type/mismatch
            title: An input’s type does not match its autocomplete field
            severity: warning
            score: "4.4"
            scope: page
            rulesets:
              - markup
            references:
              - https://html.spec.whatwg.org/multipage/form-control-infrastructure.html#autofill-field
            rationale: Phones show the wrong keyboard and autofill suggests the wrong value when an email, phone or URL field is a plain text input.
          - id: markup/lang-switcher/mismatch
            title: Language switcher links do not declare their target language
            severity: warning
            score: "4.8"
            scope: page
            rulesets:
              - markup
            references:
              - https://www.w3.org/International/questions/qa-link-lang
            rationale: Without lang and hreflang a screen reader pronounces the link in the wrong language, and visitors and search engines cannot tell which language it leads to.
          - id: network/asn/single
            title: The site and its name servers sit in one autonomous system
            severity: hint
            score: "0.6"
            scope: site
            rulesets:
              - network
              - server
            references:
              - https://www.rfc-editor.org/rfc/rfc2182#section-3.1
            rationale: One network outage then takes both the site and its DNS down together. Not flagged when an anycast DNS operator announces the zone.
          - id: network/mail-fcrdns/mismatch
            title: A mail server address has no matching reverse DNS name
            severity: warning
            score: "5.8"
            scope: site
            rulesets:
              - network
              - server
            references:
              - https://www.rfc-editor.org/rfc/rfc1912#section-2.1
            rationale: Large mailbox providers refuse or junk mail from an address with no PTR record, or whose PTR does not resolve back to that address, so the name’s mail goes missing.
            message: a mail exchanger address has no PTR, or its PTR does not resolve back to it, so large mailbox providers refuse its mail
          - id: network/rpki/invalid
            title: An address sits in a route that RPKI marks invalid
            severity: error
            score: "9.0"
            scope: site
            rulesets:
              - network
              - server
            references:
              - https://www.rfc-editor.org/rfc/rfc6811
            rationale: Networks that drop RPKI-invalid routes cannot reach the site at all, and the mismatch can also signal a route hijack.
            message: an address sits in a route RPKI marks invalid, so networks that drop invalid routes cannot reach the site
          - id: network/rpki/missing
            title: An address sits in a prefix that no RPKI route authorisation covers
            severity: hint
            score: "0.7"
            scope: site
            rulesets:
              - network
              - server
            references:
              - https://www.rfc-editor.org/rfc/rfc6480
            rationale: Without a ROA, a hijack of the route cannot be told apart from the real one, so a rogue network can attract the site’s traffic.
            message: an address sits in a prefix no ROA covers, so a hijack of its route cannot be told apart
          - id: origin/canonical-host/mismatch
            title: Entry variants do not all lead to one canonical origin
            severity: warning
            score: "5.6"
            scope: site
            rulesets:
              - origin
              - server
            references:
              - https://developers.google.com/search/docs/crawling-indexing/consolidate-duplicate-urls
            rationale: When http, https, www and the bare domain each serve the site, search engines split ranking across copies and visitors land on inconsistent addresses. Judged once per origin.
          - id: origin/compression/missing
            title: The home page is not offered in br, zstd and gzip
            severity: info
            score: "2.4"
            scope: site
            rulesets:
              - origin
              - server
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Headers/Accept-Encoding
            rationale: Missing compression makes every visitor download more bytes, which is slowest on mobile connections. Only a text page of 1 KiB or more is judged.
            message: / is served only with {got}; offer br, zstd and gzip, each to the clients that ask for it
          - id: origin/cross-domain-policy/insecure
            title: A cross-domain policy file lets any origin read the site
            severity: warning
            score: "5.2"
            scope: site
            rulesets:
              - origin
              - server
            references:
              - https://www.adobe.com/devnet-docs/acrobatetk/tools/AppSec/xdomain.html
            rationale: A wildcard policy lets a page on any other site make Flash or Silverlight requests as the visitor and read the answers. Judged once per origin.
            message: "a cross-domain policy file lets any origin read the site as its visitor: {got}"
          - id: origin/entry-redirect-path/missing
            title: Entry redirects drop the requested path or query
            severity: warning
            score: "5.4"
            scope: site
            rulesets:
              - origin
              - server
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Guides/Redirections
            rationale: A visitor who follows a deep link or a bookmark through http or www ends on the home page instead of the page they wanted. Judged once per origin.
            message: "entry variants lose the requested path or query on the way: {got}"
          - id: origin/entry-redirect/excessive
            title: Entry variants take more than one redirect hop
            severity: warning
            score: "4.8"
            scope: site
            rulesets:
              - origin
              - server
            references:
              - https://hstspreload.org/#deployment-recommendations
