            rationale: Без нього сторінка не може стати ізольованою між походженнями, чого браузери вимагають для функцій на кшталт високоточних таймерів і спільної пам’яті. Перевіряються лише HTML-сторінки з відповіддю 2xx. Це необов’язкове зміцнення.
            message: немає Cross-Origin-Embedder-Policy
          - id: http/coep/weak
