            scope: page
            rulesets:
              - suggestions
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Headers/Cross-Origin-Embedder-Policy
            rationale: Інші значення не ізолюють сторінку від вмісту інших походжень, тож функції, що потребують ізоляції, лишаються недоступними. Перевіряються лише HTML-сторінки 2xx, що надсилають коректний заголовок.
            message: Cross-Origin-Embedder-Policy має бути require-corp або credentialless
          - id: http/compression/missing
            title: Текстова відповідь понад 1 КБ надсилається без стиснення
            severity: warning
