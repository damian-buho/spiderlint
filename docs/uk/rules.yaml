            references:
              - https://web.dev/articles/maskable-icon
            rationale: Без значків 192×192 і 512×512 встановлений застосунок має розмитий або типовий значок, а без maskable-значка Android погано обрізає логотип. Оцінюються лише маніфести, що розбираються.
          - id: manifest/link/missing
            title: Деякі сторінки не посилаються на маніфест веб-застосунку
