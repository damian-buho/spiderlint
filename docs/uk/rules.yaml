            scope: page
            rulesets:
              - performance
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Compression
            rationale: Нестиснені HTML, CSS, JavaScript та JSON передаються у кілька разів більшим обсягом, що сповільнює сторінки на повільному зв’язку й витрачає мобільний трафік відвідувачів. Перевіряються лише текстові відповіді 2xx розміром від 1 КБ.
            message: текстова відповідь понад 1 КБ надсилається без стиснення
          - id: http/compression/weak
