            message: NSEC3 використовує додаткові ітерації або сіль ({got})
          - id: dns/null-mx/invalid
            title: Нульовий MX на імені, яке приймає або надсилає пошту
            severity: warning
            score: "5.0"
            scope: site
            rulesets:
              - dns:mail
              - mail
              - mail:recommended
              - server
            references:
              - https://www.rfc-editor.org/rfc/rfc7505#section-4
            rationale: Нульовий MX повідомляє відправникам, що ім’я не приймає пошту, тож вони можуть відкидати листи до нього, а одержувачі — відхиляти листи від нього. Перевіряється лише для імен, які, схоже, приймають або надсилають пошту.
            message: нульовий MX на імені, що приймає чи надсилає пошту, тож відправники можуть відкидати пошту до нього, а одержувачі — пошту від нього ({got})
          - id: dns/null-mx/missing
            title: Ім’я, яке не приймає пошту, не має нульового запису MX
            severity: warning
            score: "5.6"
            scope: site
            rulesets:
              - dns:mail
            references:
              - https://www.rfc-editor.org/rfc/rfc7505
            rationale: Без нульового MX відправники звертаються до адреси A або AAAA цього імені й днями повторюють спроби доставити пошту, яку воно ніколи не прийме. Перевіряється лише для імен, які, схоже, не приймають і не надсилають пошту.
            message: немає нульового MX, тому відправники звертаються до адреси A чи AAAA імені й днями повторюють пошту, яку воно ніколи не приймає ({got})
          - id: dns/recursion/insecure
            title: Авторитетний сервер імен відповідає на рекурсивні запити
            severity: warning
            score: "6.0"
            scope: site
            rulesets:
              - dns
              - dns:recommended
              - server
            references:
              - https://www.rfc-editor.org/rfc/rfc5358
            rationale: Відкритий для всіх, він може використовуватися для атак із підсиленням трафіку та отруєння кешу.
            message: авторитетний сервер імен відповідає на рекурсивні запити для будь-якого імені, що відкриває його для атак підсилення та отруєння кешу
          - id: dns/resolver-answers/mismatch
            title: Порівнювані резолвери дають різні адреси для хоста
            severity: info
            score: "2.0"
            scope: site
            rulesets:
              - dns
            references:
              - https://www.rfc-editor.org/rfc/rfc2181#section-5.4.1
            rationale: Гео-DNS робить так навмисно; застаріле чи розділене подання — ні, і воно спрямовує частину відвідувачів на старий або хибний сервер. Перевіряється лише коли порівнюється кілька резолверів.
            message: порівняні резолвери дають {got} різних відповідей для хоста; гео-DNS робить це навмисно, застаріле чи розділене подання — ні
          - id: dns/resolver-rcode/broken
            title: Порівнювані резолвери не збігаються в тому, чи розв’язується хост
            severity: warning
            score: "4.6"
            scope: site
            rulesets:
              - dns
            references:
              - https://www.rfc-editor.org/rfc/rfc4035#section-5.5
            rationale: Одні резолвери відповідають, інші ні, тож частина відвідувачів не може потрапити на сайт; SERVFAIL лише на резолверах із перевіркою вказує на зламаний ланцюг DNSSEC. Перевіряється лише коли порівнюється кілька резолверів.
            message: порівняні резолвери розходяться щодо того, чи розв’язується хост ({got}); SERVFAIL лише на резолвері з перевіркою вказує на DNSSEC
          - id: dns/resolver-validation/broken
            title: Резолвери розходяться в тому, чи проходить перевірку підписана зона
            severity: info
            score: "1.8"
            scope: site
            rulesets:
              - dns
            references:
              - https://www.rfc-editor.org/rfc/rfc4035#section-4.3
            rationale: Частина порівнюваних резолверів перевіряє підписану зону, а частина ні, що вказує на проблему з DS або ключами, через яку запити відвідувачів за резолверами з перевіркою збоять. Перевіряється лише для підписаних зон.
            message: одні з порівняних резолверів перевіряють підписану зону, а інші ні ({got})
          - id: dns/rrsig/expiring
            title: Підписи DNSSEC зони скоро спливуть
            severity: warning
            score: "4.4"
            scope: site
            rulesets:
              - dns
            references:
              - https://www.rfc-editor.org/rfc/rfc6781#section-4.4.2
            rationale: Коли лишилося менш як чверть строку дії, повторне підписування, імовірно, зупинилося; після спливу підписів резолвери з перевіркою відмовлятимуть у кожному запиті, і сайт та його пошта зникнуть для їхніх користувачів.
            message: залишилося менше чверті строку дії підпису хоста, тож повторне підписання зупинилося ({got})
          - id: dns/soa-timers/range
            title: Таймери SOA виходять за рекомендовані межі
            severity: info
            score: "1.2"
            scope: site
            rulesets:
              - dns
            references:
              - https://www.rfc-editor.org/rfc/rfc1912#section-2.2
            rationale: Значення refresh, retry, expire чи minimum, далекі від діапазонів RFC 1912, сповільнюють поширення змін або змушують вторинні сервери надто рано відмовитися від зони. Пропускається, якщо SOA керує DNS-провайдер.
            message: "{field} у SOA дорівнює {got}, поза рекомендаціями RFC 1912 §2.2: refresh 1200–43200 с, retry менше за refresh, expire 1209600–2419200 с, minimum 300–86400 с, первинний сервер зі списку серверів імен"
          - id: dns/spf-all/weak
            title: Запис SPF не завершується на -all або ~all
            severity: warning
            score: "5.7"
            scope: site
            rulesets:
              - dns:mail
              - mail
              - mail:recommended
              - server
            references:
              - https://www.rfc-editor.org/rfc/rfc7208#section-5.1
            rationale: Без завершального -all, ~all чи redirect одержувачі дозволяють будь-якому серверу надсилати пошту від імені домену, тож підроблені листи проходять перевірку SPF. Перевіряється лише для імен, які приймають або надсилають пошту.
            message: SPF не закінчується на -all чи ~all, тому одержувачі дозволяють будь-якому серверу надсилати від цього імені ({got})
          - id: dns/spf-null/missing
            title: Ім’я, яке не надсилає пошту, не має SPF-запису із забороною для всіх
            severity: warning
            score: "6.1"
            scope: site
            rulesets:
              - dns:mail
            references:
              - https://www.rfc-editor.org/rfc/rfc7208#section-5.1
            rationale: Без єдиного запису SPF v=spf1 -all одержувачі не можуть відхиляти пошту, підроблену від цього імені, тож будь-хто може видавати себе за нього, щоб ошукувати адресатів. Перевіряється лише для імен, які, схоже, не приймають і не надсилають пошту.
            message: SPF не є самотнім v=spf1 -all, тому одержувачі не можуть відхиляти підроблену від цього імені пошту ({got})
          - id: dns/spf/duplicate
            title: Поштове ім’я не має запису SPF або має більше одного
            severity: warning
            score: "5.8"
            scope: site
            rulesets:
              - dns:mail
              - mail
              - mail:recommended
              - server
            references:
              - https://www.rfc-editor.org/rfc/rfc7208#section-4.5
            rationale: Без запису SPF ніхто не може перевірити, які сервери мають право надсилати пошту від імені домену; із двома записами кожна перевірка не проходить, і одержувачі можуть відхиляти справжні листи. Перевіряється лише для імен, які приймають або надсилають пошту.
            message: "ім’я, що приймає чи надсилає пошту, потребує рівно одного запису v=spf1: за його відсутності ніхто не може надсилати від імені, а два провалюють кожну перевірку ({got})"
          - id: dns/ttl/range
            title: TTL запису дуже короткий або дуже довгий
            severity: hint
            score: "0.6"
            scope: site
            rulesets:
              - dns
            references:
              - https://www.rfc-editor.org/rfc/rfc1912#section-2.2
            rationale: TTL менший за 300 секунд множить навантаження на DNS і затримку запитів; понад добу виправлення чи міграція доходять до відвідувачів так довго. Для записів NS допускається до двох діб.
            message: TTL запису лежить поза діапазоном від 300 секунд до доби, для NS — двох; доречно перед міграцією, а в інший час коштовно ({got})
          - id: domain/ns-registry/mismatch
            title: Реєстр і зона перелічують різні сервери імен
            severity: warning
            score: "5.0"
            scope: site
            rulesets:
              - dns
            references:
              - https://www.rfc-editor.org/rfc/rfc1034#section-4.2.2
            rationale: Резолвери можуть потрапляти на сервери, яких власник зони не контролює або не знає, тож відповіді можуть бути хибними чи відсутніми.
            message: "сервери імен, які перелічує реєстр, відрізняються від власних записів NS зони: {got}"
          - id: domain/registration/expiring
            title: Реєстрація домену спливає менш ніж за 30 днів
            severity: error
            score: "dynamic: 0 → 9.6, 6 → 7.0, 7 → 6.5, 30 → 3.5"
            scope: site
            rulesets:
              - dns
              - dns:recommended
              - server
            references:
              - https://www.rfc-editor.org/rfc/rfc9083#section-4.5
            rationale: Коли вона спливе, сайт і його пошта перестануть розв’язуватися, а ім’я зможе зареєструвати хтось інший. Перевіряється лише для зареєстрованих доменів, які знаходить запит RDAP.
            message: реєстрація домену спливає через {got} днів, і сайт та його пошта перестануть розв’язуватися, коли вона мине
          - id: domain/transfer-lock/missing
            title: Домен не має блокування перенесення
            severity: warning
            score: "6.2"
            scope: site
            rulesets:
              - dns
              - dns:recommended
              - server
            references:
              - https://www.icann.org/resources/pages/epp-status-codes-2014-06-16-en
            rationale: Той, хто захопить обліковий запис реєстратора, може перенести домен до іншого реєстратора, а разом із ним сайт і пошту.
            message: реєстрація не має блокування переносу, тож хто заволодіє обліковим записом реєстратора, може забрати домен (статус {got})
          - id: feeds/archive-link/unreachable
            title: Архівні посилання стрічки нікуди не ведуть
            severity: warning
            score: "3.5"
            scope: site
            rulesets:
              - feeds
            references:
              - https://www.rfc-editor.org/rfc/rfc5005
            rationale: Архівні посилання (prev-archive, next-archive, current), що відповідають помилкою або не є стрічкою, не дають читачам отримати старіші записи, а повна стрічка взагалі не повинна називати архівні сторінки.
          - id: feeds/cache-control/mismatch
            title: Кешування стрічки працює проти її читачів
            severity: warning
            score: "5.1"
            scope: page
            rulesets:
              - feeds
            references:
              - https://www.rfc-editor.org/rfc/rfc9111#section-5.2
            rationale: "Cache-Control: no-store або max-age, далекий від власного ttl стрічки, змушує читачів постійно завантажувати її знову або пропускати оновлення годинами."
          - id: feeds/charset/mismatch
            title: Кодування стрічки оголошено або декодовано неузгоджено
            severity: warning
            score: "5.5"
            scope: page
            rulesets:
              - feeds
            references:
              - https://www.w3.org/TR/xml/#charencoding
            rationale: Коли заголовок і оголошення XML суперечать одне одному або текст містить спотворені символи, літери з діакритикою та не латинські в назвах і вмісті перетворюються на нісенітницю для підписників.
          - id: feeds/content-escaping/invalid
            title: Вміст записів екрановано двічі
            severity: warning
            score: "4.4"
            scope: page
            rulesets:
              - feeds
            references:
              - https://www.rssboard.org/rss-profile
            rationale: Читачі показують теги й сутності як видимий текст, наприклад &lt;p&gt;, замість відформатованого вмісту.
          - id: feeds/content-html/insecure
            title: Вміст записів містить розмітку, яку читачі вилучають
            severity: warning
            score: "6.3"
            scope: page
            rulesets:
              - feeds
            references:
              - https://www.rssboard.org/rss-profile
            rationale: Читачі з міркувань безпеки вилучають скрипти, фрейми, форми, обробники подій і позиціонування стилів, тож запис може виглядати зламаним або неповним.
          - id: feeds/content-markup/invalid
            title: Вміст записів — це невідрендерені Markdown чи MDX
            severity: error
            score: "8.0"
            scope: page
            rulesets:
              - feeds
            references:
              - https://www.rssboard.org/rss-profile
            rationale: Читачі показують текст як є, тож підписники бачать сирий синтаксис на кшталт `##` і `[текст](url)` замість відформатованих постів.
          - id: feeds/content-type/mismatch
            title: Вміст має HTML, але оголошений як простий текст
            severity: warning
            score: "5.6"
            scope: page
            rulesets:
              - feeds
            references:
              - https://www.rssboard.org/rss-profile
            rationale: Читачі показують теги як текст замість рендерингу, тож підписники читають розмітку, а не пост.
          - id: feeds/content-url/invalid
            title: Посилання та зображення у вмісті записів використовують відносні URL-адреси
            severity: warning
            score: "4.5"
            scope: page
            rulesets:
              - feeds
            references:
              - https://www.rssboard.org/rss-profile
            rationale: Читач не знає адреси сторінки, тож відносні посилання й зображення в HTML запису ламаються для підписників.
          - id: feeds/date/invalid
            title: У стрічці є дати, які читачі не можуть розібрати
            severity: error
            score: "7.2"
            scope: page
            rulesets:
              - feeds
            references:
              - https://www.rssboard.org/rss-profile
            rationale: RSS вимагає дат за RFC 822, Atom і JSON Feed — за RFC 3339. Читачі відкидають або неправильно розташовують записи з нерозбірливою датою, тож пости йдуть у хибному порядку або зникають.
          - id: feeds/discovery-link/mismatch
            title: Посилання на стрічку вказує хибний тип або веде не на стрічку
            severity: warning
            score: "3.4"
            scope: site
            rulesets:
              - feeds
            references:
              - https://www.rssboard.org/rss-autodiscovery
            rationale: Браузери й читачі добирають розбирач за типом у посиланні в head. Хибний тип або ціль, що не є стрічкою, призводять до збою підписки.
          - id: feeds/discovery-link/missing
            title: Деякі сторінки групи анонсують стрічку, а інші ні
            severity: warning
            score: "4.1"
            scope: group
            rulesets:
              - feeds
            references:
              - https://www.rssboard.org/rss-autodiscovery
            rationale: Відвідувачі сторінки без посилання на стрічку не можуть підписатися з неї. Порівнюються лише HTML-сторінки, що відповідають 2xx.
          - id: feeds/document/invalid
            title: Стрічка не є коректно сформованим XML чи JSON
            severity: error
            score: "9.0"
            scope: page
            rulesets:
              - feeds
            references:
              - https://www.w3.org/TR/xml/#sec-well-formed
            rationale: Читачі стрічок не можуть розібрати некоректний документ, тож підписники не отримують нових записів. Зазвичай причина в шаблоні, який не екранує значення.
          - id: feeds/document/large
            title: Стрічка завелика або віддається без стиснення
            severity: warning
            score: "5.0"
            scope: page
            rulesets:
              - feeds
            references:
              - https://www.rssboard.org/rss-profile
            rationale: Кожне опитування кожного підписника завантажує все тіло. Стрічка понад ліміт max-bytes (1 МіБ за замовчуванням) або понад 10 КіБ без стиснення марнує трафік і може перевищити час очікування в читачів.
          - id: feeds/document/stale
            title: Стрічку давно не оновлювали
            severity: info
            score: "2.2"
            scope: page
            rulesets:
              - feeds
            references:
              - https://www.rssboard.org/rss-profile
            rationale: Підписники й каталоги вважають стрічку занедбаною, щойно її найновіший запис старший за ліміт stale-days (за замовчуванням 365 днів). Також спрацьовує, коли дата збірки старша за найновіший запис.
          - id: feeds/element/missing
            title: У стрічці бракує елементів, яких вимагає її формат
            severity: error
            score: "8.6"
            scope: page
            rulesets:
              - feeds
            references:
              - https://www.rssboard.org/rss-specification
            rationale: Стрічку без обов’язкового елемента (назва, посилання чи опис каналу в RSS; id, назва, updated чи автор в Atom; назва чи id у JSON Feed) можуть відхилити валідатори або показати порожньою читачі.
          - id: feeds/element/unknown
            title: RSS-стрічка використовує елементи поза специфікацією
            severity: warning
            score: "3.9"
            scope: page
            rulesets:
              - feeds
            references:
              - https://www.rssboard.org/rss-specification
            rationale: Елементи, яких RSS 2.0 не визначає і які не належать до жодного простору імен, читачі ігнорують, а суворі валідатори відхиляють стрічку.
          - id: feeds/email/invalid
            title: Поля електронної пошти стрічки не мають вигляду адреса (Ім’я)
            severity: warning
            score: "4.2"
            scope: page
            rulesets:
              - feeds
            references:
              - https://www.rssboard.org/rss-specification
            rationale: RSS вимагає managingEditor, webMaster і author у вигляді адреси з іменем у дужках. Інші форми не проходять валідатори, а читачі можуть показати чи прив’язати їх хибно.
          - id: feeds/enclosure/invalid
            title: Вкладення подкасту не відповідають тому, що віддає їхній хост
            severity: warning
            score: "6.2"
