            message: Content-Type порушує RFC 9110 §8.3.1
          - id: http/coop/invalid
            title: Заголовок Cross-Origin-Opener-Policy має неправильний формат
            severity: warning
            score: "3.9"
            scope: page
            rulesets:
              - security-headers
            references:
              - https://html.spec.whatwg.org/multipage/browsers.html#the-coop-headers
            rationale: Браузери ігнорують заголовок, який не можуть розібрати, тож сторінка не ізолюється від вікон інших сайтів. Перевіряються лише HTML-документи, що його надсилають.
            message: Cross-Origin-Opener-Policy порушує граматику структурованого поля, тому браузери його ігнорують
          - id: http/coop/missing
            title: Сторінка не надсилає Cross-Origin-Opener-Policy
            severity: info
            score: "2.2"
            scope: page
            rulesets:
              - security-headers
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Headers/Cross-Origin-Opener-Policy
            rationale: Без нього вікна, відкриті з інших сайтів, зберігають зв’язок зі сторінкою, що дозволяє їм зондувати її через побічні канали. Перевіряються лише HTML-документи.
            message: немає Cross-Origin-Opener-Policy
          - id: http/coop/weak
            title: Cross-Origin-Opener-Policy надто поблажлива
            severity: info
            score: "2.2"
            scope: page
            rulesets:
              - security-headers
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Headers/Cross-Origin-Opener-Policy
            rationale: Ізолюють сторінку лише same-origin і same-origin-allow-popups. Інші значення, наприклад unsafe-none, лишають сторінку пов’язаною з вікнами інших сайтів, тож ізоляції, яку обіцяє заголовок, немає. Перевіряються лише HTML-документи з коректним заголовком.
            message: Cross-Origin-Opener-Policy має бути same-origin або same-origin-allow-popups
          - id: http/corp/invalid
            title: Cross-Origin-Resource-Policy має недійсне значення
            severity: info
            score: "2.1"
            scope: page
            rulesets:
              - security-headers
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Headers/Cross-Origin-Resource-Policy
            rationale: Браузери ігнорують невідоме значення, тож ресурс лишається відкритим для інших сайтів. Перевіряються лише відповіді, що надсилають заголовок.
            message: Cross-Origin-Resource-Policy має бути same-origin, same-site або cross-origin
          - id: http/corp/missing
            title: У відповіді немає Cross-Origin-Resource-Policy
            severity: info
            score: "2.1"
            scope: page
            rulesets:
              - security-headers
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Headers/Cross-Origin-Resource-Policy
            rationale: Без нього будь-який інший сайт може вбудувати ресурс, що може розкрити його вміст через побічні канали або дозволити іншим користуватися ним безкоштовно.
            message: немає Cross-Origin-Resource-Policy
          - id: http/csp-base-uri/missing
            title: У Content-Security-Policy немає base-uri
            severity: info
            score: "2.6"
            scope: page
            rulesets:
              - security-headers
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Headers/Content-Security-Policy/base-uri
            rationale: Зловмисник, який може впровадити тег base, здатен перенаправити всі відносні скрипти та посилання на власний сервер. Перевіряються лише HTML-документи, що надсилають політику.
            message: Content-Security-Policy не має base-uri, тому ін’єктований <base> може переспрямувати відносні скрипти
          - id: http/csp-frame-ancestors/missing
            title: У Content-Security-Policy немає frame-ancestors
            severity: info
            score: "2.9"
            scope: page
            rulesets:
              - security-headers
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Headers/Content-Security-Policy/frame-ancestors
            rationale: Тоді будь-який інший сайт може вкласти сторінку у фрейм, що уможливлює клікджекінг, коли відвідувачів змушують натиснути приховані елементи. Директива працює лише в заголовку, а не в meta-тегу. Перевіряються лише HTML-документи, що надсилають політику.
            message: Content-Security-Policy не має frame-ancestors, який може передати лише заголовок
          - id: http/csp-object-src/weak
            title: Content-Security-Policy не задає object-src як none
            severity: warning
            score: "5.5"
            scope: page
            rulesets:
              - security-headers
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Headers/Content-Security-Policy/object-src
            rationale: Плагіни та вбудовані об’єкти все ще можуть завантажуватися, що дає зловмисникам давній шлях до виконання коду на сторінці. Перевіряються лише HTML-документи, що надсилають політику.
            message: Content-Security-Policy має задавати object-src 'none'
          - id: http/csp-script-src/insecure
            title: Content-Security-Policy довіряє скриптам з будь-якого хоста
            severity: warning
            score: "6.1"
            scope: page
            rulesets:
              - security-headers
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Headers/Content-Security-Policy/Sources
            rationale: Джерело * або лише схема, як-от https:, дозволяє завантажувати скрипти з будь-якого сайту, тож зловмиснику досить розмістити скрипт будь-де, щоб його виконати. Перевіряються лише HTML-документи, що надсилають політику.
            message: Content-Security-Policy завантажує скрипти з будь-якого хоста через джерело * або лише зі схемою
          - id: http/csp-script-src/missing
            title: Content-Security-Policy не обмежує скрипти
            severity: warning
            score: "6.3"
            scope: page
            rulesets:
              - security-headers
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Headers/Content-Security-Policy/script-src
            rationale: Без script-src і default-src може виконуватися будь-який скрипт з будь-якого джерела, тож політика не захищає від впроваджених скриптів. Перевіряються лише HTML-документи, що надсилають політику.
            message: Content-Security-Policy не задає ні script-src, ні default-src, тож завантажується будь-який скрипт
          - id: http/csp-trusted-types/missing
            title: Content-Security-Policy не вимагає Trusted Types
            severity: info
            score: "2.4"
            scope: page
            rulesets:
              - security-headers
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Headers/Content-Security-Policy/require-trusted-types-for
            rationale: Без Trusted Types скрипт може передати ненадійний текст небезпечним функціям браузера й відкрити сторінку для міжсайтового скриптингу на основі DOM. Перевіряються лише HTML-документи, що надсилають політику.
            message: Content-Security-Policy не має require-trusted-types-for 'script'
          - id: http/csp-unsafe-eval/present
            title: Content-Security-Policy дозволяє eval()
            severity: warning
            score: "6.0"
            scope: page
            rulesets:
              - security-headers
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Headers/Content-Security-Policy/script-src#unsafe_eval_expressions
            rationale: З ’unsafe-eval’ виконується текст, перетворений на код під час роботи, що дає зловмиснику, який керує таким текстом, спосіб виконати скрипти. Перевіряються лише HTML-документи, що надсилають політику.
            message: Content-Security-Policy дозволяє eval() через 'unsafe-eval'
          - id: http/csp-unsafe-inline/present
            title: Content-Security-Policy дозволяє вбудовані скрипти
            severity: warning
            score: "6.2"
            scope: page
            rulesets:
              - security-headers
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Headers/Content-Security-Policy/script-src#unsafe_inline_script
            rationale: З ’unsafe-inline’ виконується будь-який скрипт, який зловмисник впровадить на сторінку, тож політика більше не зупиняє міжсайтовий скриптинг. Перевіряються лише HTML-документи, що надсилають політику.
            message: Content-Security-Policy дозволяє вбудовані скрипти через 'unsafe-inline' без nonce чи хеша
          - id: http/csp-upgrade-insecure/missing
            title: Content-Security-Policy не має upgrade-insecure-requests
            severity: warning
            score: "5.3"
            scope: page
            rulesets:
              - security-headers
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Headers/Content-Security-Policy/upgrade-insecure-requests
            rationale: Без директиви забуте посилання чи ресурс http:// на HTTPS-сторінці завантажується небезпечно, і зловмисники в мережі можуть його прочитати або змінити. Перевіряються лише HTTPS-документи, що надсилають політику.
            message: Content-Security-Policy не має upgrade-insecure-requests
          - id: http/csp/invalid
            title: Заголовок Content-Security-Policy має неправильний формат
            severity: warning
            score: "5.9"
            scope: page
            rulesets:
              - security-headers
            references:
              - https://www.w3.org/TR/CSP3/#framework-directives
            rationale: Браузери відкидають директиви, які не можуть прочитати, тож частина політики або вся вона може не діяти. Перевіряються лише HTML-документи, що надсилають політику.
            message: Content-Security-Policy порушує CSP 3, а браузери відкидають те, чого не можуть прочитати
          - id: http/csp/missing
            title: Сторінка не має чинної Content-Security-Policy
            severity: warning
            score: "6.4"
            scope: page
            rulesets:
              - security-headers
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/CSP
            rationale: Без політики впроваджений скрипт виконується з усіма правами сторінки, тож одна діра міжсайтового скриптингу може викрасти сесії чи дані. Перевіряються лише HTML-документи, і політика в meta-тегу зараховується.
            message: немає чинної Content-Security-Policy ні в заголовку, ні в <meta>
          - id: http/date/invalid
            title: Заголовок Date не має стандартного формату дати
            severity: warning
            score: "4.2"
            scope: page
            rulesets:
              - recommended
            references:
              - https://www.rfc-editor.org/rfc/rfc9110#section-5.6.7
            rationale: Кеші та клієнти, які не можуть розібрати Date, змушені вгадувати вік відповіді, через що ламаються обчислення свіжості. HTTP вимагає фіксованої форми в GMT, наприклад Sun, 06 Nov 1994 08:49:37 GMT. Перевіряються лише відповіді, що надсилають Date.
            message: Date має бути IMF-fixdate
          - id: http/date/mismatch
            title: Годинник сервера відрізняється від нашого
            severity: warning
            score: "dynamic: -3600 → 6.8, -60 → 3.4, 60 → 3.4, 3600 → 6.8"
            scope: site
            rulesets:
              - recommended
            references:
              - https://www.rfc-editor.org/rfc/rfc9110#section-6.6.1
            rationale: Годинник, що відстає чи поспішає на хвилини, може порушити чинність сертифікатів, підписані токени, свіжість кешу й зіставлення журналів; година чи більше — це помилка. Пропускається, коли всі хости відхиляються однаково, що вказує на машину, яка перевіряє.
          - id: http/date/missing
            title: У відповіді немає заголовка Date
            severity: warning
            score: "4.2"
            scope: page
            rulesets:
              - recommended
            references:
              - https://www.rfc-editor.org/rfc/rfc9110#section-5.6.7
            rationale: Без Date кеші не можуть визначити вік відповіді, тому можуть віддавати застарілий вміст або кешувати його неправильно. Клієнти, що звіряють годинники, також втрачають орієнтир.
            message: немає заголовка Date
          - id: http/deprecation/invalid
            title: Заголовок Deprecation не є @ з секундами Unix
            severity: warning
            score: "3.6"
            scope: page
            rulesets:
              - performance
            references:
              - https://www.rfc-editor.org/rfc/rfc9745
            rationale: Клієнти, які не можуть прочитати значення, не попередять, що ресурс застарів. Перевіряються лише відповіді, що надсилають Deprecation.
            message: Deprecation має бути @ і секундами Unix
          - id: http/digest/missing
            title: У відповіді немає ні Content-Digest, ні Repr-Digest
            severity: hint
            score: "0.6"
            scope: page
            rulesets:
              - suggestions
            references:
              - https://www.rfc-editor.org/rfc/rfc9530
            rationale: Без дайджесту клієнт чи посередник не може перевірити, що тіло дійшло цілим і незмінним. Це необов’язкове зміцнення для HTML-сторінок із відповіддю 2xx.
            message: без Content-Digest чи Repr-Digest клієнт не може перевірити тіло
          - id: http/early-hints-preload/mismatch
            title: Preload із ранніх підказок 103 відсутній у кінцевій відповіді
            severity: info
            score: "1.8"
            scope: page
            rulesets:
              - performance
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Status/103
            rationale: Браузер починає завантажувати те, що оголосила рання підказка, але кінцева відповідь цього вже не просить, тож раннє завантаження марне або ресурс приходить пізно. Перевіряються лише відповіді, що надіслали 103.
          - id: http/frame-options/missing
            title: Інші сайти можуть вбудовувати сторінку у фрейм
            severity: info
            score: "3.0"
            scope: page
            rulesets:
              - security-headers
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Headers/Content-Security-Policy/frame-ancestors
            rationale: Сторінка зловмисника може завантажити цю в прихованому фреймі й обманом змусити відвідувачів натискати її кнопки (clickjacking). Директива frame-ancestors у Content-Security-Policy або X-Frame-Options зі значенням DENY чи SAMEORIGIN це забороняє.
          - id: http/header/deprecated
            title: Сторінка надсилає заголовки, яких жоден сучасний браузер не читає
            severity: info
            score: "1.2"
            scope: page
            rulesets:
              - security-headers
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Headers
            rationale: X-XSS-Protection, Expect-CT, Public-Key-Pins, Feature-Policy, P3P і Report-To — зайвий баласт у кожній відповіді, а деякі дають хибне відчуття захисту. Report-To не чіпається, поки його ще читає NEL.
          - id: http/host/inconsistent
            title: Сторінки одного хоста відрізняються сертифікатом, версією TLS чи сервером
            severity: info
            score: "2.8"
            scope: site
            rulesets:
              - recommended
            rationale: Коли сторінки одного хоста відповідають із по-різному налаштованих серверів, це зазвичай означає хибно налаштований балансувальник чи недоведену міграцію, і частина відвідувачів отримує старішу версію TLS або застарілий сертифікат. Адреса сервера не порівнюється за CDN, що називає себе в Server.
          - id: http/hsts-subdomains/missing
            title: Strict-Transport-Security не містить includeSubDomains
            severity: info
            score: "2.5"
            scope: page
            rulesets:
              - security-headers
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Headers/Strict-Transport-Security#includesubdomains
            rationale: Без нього піддомени не примушуються до HTTPS, тож зловмисник може використати незахищений піддомен, щоб перехопити cookie основного сайту. Перевіряються лише HTTPS-відповіді з коректним заголовком.
            message: Strict-Transport-Security має містити includeSubDomains
          - id: http/hsts/invalid
            title: Заголовок Strict-Transport-Security має неправильний формат
            severity: warning
            score: "5.6"
            scope: page
            rulesets:
              - security-headers
            references:
              - https://www.rfc-editor.org/rfc/rfc6797#section-6.1
            rationale: Браузери ігнорують заголовок, який не можуть розібрати, тож захист «лише HTTPS» ніколи не вмикається. Перевіряються лише відповіді, що його надсилають.
            message: Strict-Transport-Security порушує RFC 6797 §6.1, тому браузери його ігнорують
          - id: http/hsts/missing
            title: Сайт не надсилає Strict-Transport-Security
            severity: warning
            score: "5.8"
            scope: page
            rulesets:
              - security-headers
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Headers/Strict-Transport-Security
            rationale: Без HSTS перший запит відвідувача або запит у ворожій мережі можна знизити до звичайного HTTP і перехопити. Перевіряються лише HTTPS-відповіді зі статусом від 200 до 499, окрім 429.
            message: немає Strict-Transport-Security
          - id: http/hsts/weak
            title: Strict-Transport-Security має короткий max-age
            severity: warning
            score: "5.8"
            scope: page
            rulesets:
              - security-headers
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Headers/Strict-Transport-Security
            rationale: Короткий max-age змушує браузер швидко забути правило «лише HTTPS», тож захист зникає між візитами, і атака зниження знову працює. Перевіряються лише HTTPS-відповіді з коректним заголовком.
            message: Strict-Transport-Security має містити max-age від 1000000
          - id: http/link/invalid
            title: Заголовок Link має неправильний формат
            severity: warning
            score: "4.6"
            scope: page
            rulesets:
              - performance
            references:
              - https://www.rfc-editor.org/rfc/rfc8288#section-3
            rationale: Клієнти відкидають посилання, які не можуть розібрати, тож preload та інші підказки в ньому ніколи не спрацьовують. Перевіряються лише відповіді, що надсилають Link.
            message: Link порушує RFC 8288 §3, тому клієнти відкидають посилання, яких не можуть прочитати
          - id: http/no-store/present
            title: "Cache-Control: no-store виключає сторінку з кешу переходів назад і вперед"
            severity: info
            score: "2.4"
            scope: page
            rulesets:
              - performance
            references:
              - https://web.dev/articles/bfcache#minimize-use-of-cache-control-no-store
            rationale: Браузери не зберігають сторінку з no-store для миттєвих переходів назад і вперед, тож такі переходи перезавантажують сторінку й здаються повільнішими. Перевіряються лише HTML-сторінки, що надсилають Cache-Control.
            message: Cache-Control no-store виключає сторінку з кешу переходів назад/вперед
          - id: http/no-vary-search/missing
            title: URL із параметрами запиту не має No-Vary-Search
            severity: hint
            score: "0.4"
            scope: page
            rulesets:
              - suggestions
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Headers/No-Vary-Search
            rationale: Без нього кеші вважають кожен варіант рядка запиту окремою сторінкою, тож параметри відстеження спричиняють зайві промахи кешу й перезавантаження. Перевіряються лише HTML-сторінки 2xx, що мають запит.
            message: URL із запитом не має No-Vary-Search, що вказував би, які параметри змінюють сторінку
          - id: http/permissions-policy/invalid
            title: Заголовок Permissions-Policy має неправильний формат
            severity: warning
            score: "3.7"
            scope: page
            rulesets:
              - security-headers
            references:
              - https://www.w3.org/TR/permissions-policy/#permissions-policy-http-header-field
            rationale: Браузери ігнорують заголовок, який не можуть розібрати, тож функції, які він мав обмежити, лишаються доступними сторінці та її фреймам. Перевіряються лише HTML-документи, що його надсилають.
            message: Permissions-Policy порушує граматику структурованого поля, тому браузери його ігнорують
          - id: http/permissions-policy/missing
            title: Сторінка не надсилає Permissions-Policy з назвою жодної функції
            severity: info
            score: "1.8"
            scope: page
            rulesets:
              - security-headers
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Headers/Permissions-Policy
            rationale: Без політики сторінка та кожен вбудований фрейм можуть користуватися потужними функціями браузера, як-от камерою, мікрофоном чи геолокацією, якщо браузер цього не блокує. Перевіряються лише HTML-документи.
            message: жоден заголовок Permissions-Policy не називає функції
          - id: http/priority/invalid
            title: Заголовок Priority має неправильний формат
            severity: warning
            score: "3.8"
            scope: page
            rulesets:
              - performance
            references:
              - https://www.rfc-editor.org/rfc/rfc9218#section-5
            rationale: Клієнти ігнорують заголовок, який не можуть розібрати, тож підказка про терміновість відповіді не діє. Перевіряються лише відповіді, що надсилають Priority.
            message: Priority порушує граматику структурованого поля, тому клієнти його ігнорують
          - id: http/referrer-policy/insecure
            title: Referrer-Policy витікає повні URL на інші сайти
            severity: warning
            score: "5.1"
            scope: page
            rulesets:
              - security-headers
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Headers/Referrer-Policy
            rationale: Значення unsafe-url і no-referrer-when-downgrade надсилають іншим сайтам повну адресу з рядком запиту, що може розкрити приватні дані. Перевіряються лише відповіді з коректним заголовком.
            message: Referrer-Policy не має розкривати повні URL
          - id: http/referrer-policy/invalid
            title: Заголовок Referrer-Policy містить невідоме значення
            severity: warning
            score: "4.0"
            scope: page
            rulesets:
              - security-headers
            references:
              - https://www.w3.org/TR/referrer-policy/#referrer-policy-header
            rationale: Браузери ігнорують значення, яких не знають, і можуть вдатися до політики, що розкриває більше URL, ніж задумано. Перевіряються лише відповіді, що його надсилають.
            message: Referrer-Policy порушує токени Referrer Policy
          - id: http/referrer-policy/missing
            title: Відповідь не надсилає Referrer-Policy
            severity: warning
            score: "5.1"
            scope: page
            rulesets:
              - security-headers
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Headers/Referrer-Policy
            rationale: Без політики браузери самі вирішують, що надсилати, і повні URL сторінок, які можуть містити приватні дані, можуть витікати на інші сайти, коли відвідувачі переходять за посиланнями.
            message: немає Referrer-Policy
          - id: http/reporting-endpoints/invalid
            title: Заголовок Reporting-Endpoints має неправильний формат
            severity: warning
            score: "3.4"
            scope: page
            rulesets:
              - security-headers
            references:
              - https://www.w3.org/TR/reporting-1/#header
            rationale: Браузери ігнорують заголовок, який не можуть розібрати, тож звіти про порушення чи збої ніколи не надсилаються. Перевіряються лише відповіді, що його надсилають.
            message: Reporting-Endpoints порушує граматику структурованого поля, тому браузери його ігнорують
          - id: http/reporting-endpoints/missing
            title: Відповідь не вказує жодного Reporting-Endpoints
            severity: info
            score: "1.5"
            scope: page
            rulesets:
              - security-headers
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Headers/Reporting-Endpoints
            rationale: Без кінцевої точки браузери не можуть повідомляти про порушення політик, збої чи застарілі функції, тож власник ніколи не дізнається про проблеми, на які натрапляють відвідувачі.
            message: жоден заголовок Reporting-Endpoints не називає кінцевої точки
          - id: http/retry-after/invalid
            title: Заголовок Retry-After має неправильний формат
            severity: warning
            score: "4.1"
            scope: page
            rulesets:
              - performance
            references:
              - https://www.rfc-editor.org/rfc/rfc9110#section-10.2.3
            rationale: Клієнти не можуть визначити, коли повторити запит, тому повторюють його одразу або здаються. Перевіряються лише відповіді, що надсилають Retry-After.
            message: Retry-After порушує RFC 9110 §10.2.3, тому клієнти не знають, коли повторити запит
          - id: http/retry-after/missing
            title: Відповідь 503 не вказує, коли повторити запит
            severity: warning
            score: "4.8"
            scope: page
            rulesets:
              - performance
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Headers/Retry-After
            rationale: Без Retry-After клієнти й краулери повторюють запит одразу або здаються, що додає навантаження серверу, який і так не справляється, чи вилучає сайт із видачі. Перевіряються лише відповіді 503.
            message: відповідь 503 має вказувати, коли повторити запит, через Retry-After
          - id: http/retry-after/weak
            title: Retry-After просить клієнтів повернутися надто швидко
            severity: info
            score: "dynamic: 0 → 3.0, 9 → 1.2"
            scope: page
            rulesets:
              - performance
            references:
              - https://www.rfc-editor.org/rfc/rfc9110#section-10.2.3
            rationale: Затримка менш ніж 10 секунд одразу повертає клієнтів до сервера, який і так скидає навантаження, через що він лишається перевантаженим. Перевіряються лише відповіді 429 і 503 із придатним до читання Retry-After.
            message: Retry-After просить клієнтів повернутися занадто скоро, що одразу повертає навантаження серверу, який намагається його скинути
          - id: http/server-timing/missing
            title: Сайт розробки чи тестування не надсилає Server-Timing
            severity: hint
            score: "0.2"
            scope: page
            rulesets:
              - suggestions
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Headers/Server-Timing
            rationale: Без нього розробники та інструменти браузера не бачать, де сервер витратив час. Перевіряються лише сайти, оголошені як для розробки або тестування.
            message: жоден заголовок Server-Timing не показує, на що сервер витратив час
          - id: http/server/disclosing
            title: Сервер розкриває програмне забезпечення, що за ним стоїть
            severity: warning
            score: "5.0"
            scope: site
            rulesets:
              - security-headers
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Reference/Headers/Server
            rationale: Заголовки на кшталт Server і X-Powered-By та мета-тег generator називають продукт і часто його версію, що підказує зловмисникам, які відомі вразливості пробувати. Імена, які задає CDN чи хостинг і які власник не може прибрати, не повідомляються, а ім’я без версії — лише підказка.
          - id: http/sunset/invalid
            title: Заголовок Sunset не є датою HTTP
            severity: warning
            score: "3.7"
            scope: page
            rulesets:
              - performance
            references:
              - https://www.rfc-editor.org/rfc/rfc8594
            rationale: Клієнти, які не можуть прочитати дату, не попередять, що ресурс зникне. Перевіряються лише відповіді, що надсилають Sunset.
            message: Sunset має бути HTTP-date
          - id: http/tdm-reservation/invalid
            title: Заголовок tdm-reservation не дорівнює 0 чи 1
            severity: warning
            score: "3.5"
            scope: page
            rulesets:
              - seo
            references:
              - https://www.w3.org/community/reports/tdmrep/CG-FINAL-tdmrep-20240510/
            rationale: Краулери інтелектуального аналізу текстів і даних не можуть прочитати застереження сайту, тож можуть добувати вміст, який власник хотів зарезервувати. Перевіряються лише відповіді, що надсилають заголовок.
            message: tdm-reservation має бути 0 або 1
          - id: http/use-as-dictionary-match/invalid
            title: У Use-As-Dictionary немає шаблону match
            severity: warning
            score: "3.5"
            scope: page
            rulesets:
              - performance
            references:
              - https://www.rfc-editor.org/rfc/rfc9842#section-2.1
            rationale: Словник без шаблону match не застосовується до подальших запитів, тож стиснення, яке він мав покращити, не відбувається. Перевіряються лише відповіді, що надсилають Use-As-Dictionary.
            message: Use-As-Dictionary потребує члена match="<шаблон URL>"
          - id: http/use-as-dictionary/invalid
            title: Заголовок Use-As-Dictionary має неправильний формат
            severity: warning
            score: "3.4"
            scope: page
            rulesets:
              - performance
            references:
              - https://www.rfc-editor.org/rfc/rfc9842#section-2.1
            rationale: Клієнти ігнорують заголовок, який не можуть розібрати, тож словник ніколи не використовується і виграш від стиснення втрачається. Перевіряються лише відповіді, що надсилають Use-As-Dictionary.
            message: Use-As-Dictionary порушує граматику структурованого поля, тому клієнти його ігнорують
          - id: http/validator/missing
            title: У відповіді немає ні ETag, ні Last-Modified
            severity: info
            score: "2.6"
            scope: page
            rulesets:
              - performance
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Caching#validation
            rationale: Без валідатора браузер не може спитати, чи збережена копія ще актуальна, тому після її завершення терміну повторно завантажує всю відповідь. Перевіряються лише відповіді 2xx.
            message: немає ETag чи Last-Modified для повторної перевірки
          - id: http/vary-accept-encoding/missing
            title: "У стисненої відповіді немає Vary: Accept-Encoding"
            severity: warning
            score: "5.4"
            scope: page
            rulesets:
              - performance
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Headers/Vary
            rationale: Без нього спільний кеш чи CDN може зберегти стиснену копію й віддати її клієнтові, який не вміє її розпакувати, або навпаки. Перевіряються лише відповіді, що вказують Content-Encoding.
            message: "стиснена відповідь має містити Vary: Accept-Encoding"
          - id: http/vary-star/present
            title: "Vary: * робить відповідь некешованою"
            severity: warning
            score: "5.6"
            scope: page
            rulesets:
              - performance
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Headers/Vary
            rationale: Vary зі значенням * повідомляє кешам, що кожен запит особливий, тож браузери та CDN не можуть повторно використати відповідь і кожен візит доходить до сервера. Перевіряються лише відповіді, що надсилають заголовок Vary.
            message: "Vary: * робить відповідь некешованою"
          - id: http/vary/invalid
            title: Заголовок Vary має неправильний формат
            severity: warning
            score: "4.2"
            scope: page
            rulesets:
              - performance
            references:
              - https://www.rfc-editor.org/rfc/rfc9110#section-12.5.5
            rationale: Кеші, які не можуть прочитати Vary, можуть віддати відвідувачу хибний варіант сторінки, наприклад не ту мову чи стиснення. Перевіряються лише відповіді, що надсилають Vary.
            message: Vary порушує RFC 9110 §12.5.5
          - id: http/version/outdated
            title: Сервер відповідає по HTTP/1.1 замість HTTP/2 чи HTTP/3
            severity: warning
            score: "5.8"
            scope: page
            rulesets:
              - performance
            references:
              - https://developer.mozilla.org/docs/Glossary/HTTP_2
            rationale: HTTP/1.1 менш ефективно завантажує ресурси, тому сторінки з’являються довше, особливо на повільному чи нестабільному зв’язку. Перевіряються лише відповіді, що повідомляють версію протоколу.
            message: сервер має підтримувати HTTP/2 або HTTP/3
          - id: http/x-xss-protection/insecure
            title: X-XSS-Protection увімкнено
            severity: warning
            score: "4.5"
            scope: page
            rulesets:
              - security-headers
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Headers/X-XSS-Protection
            rationale: Старий фільтр браузера, який вмикає цей заголовок, сам може створювати діри міжсайтового скриптингу, тому заголовок має бути відсутнім або дорівнювати 0. Перевіряються лише відповіді, що його надсилають.
            message: X-XSS-Protection має бути відсутнім або 0
          - id: i18n/content-language/mismatch
            title: Content-Language і lang називають різні мови
            severity: info
            score: "2.4"
            scope: page
            rulesets:
              - i18n
            references:
              - https://www.w3.org/International/questions/qa-http-and-lang
            rationale: Заголовок і атрибут lang елемента html розходяться щодо мови сторінки, тож браузери, інструменти перекладу й пошукові системи можуть обрати хибну. Сторінки, де бракує одного з них, пропускаються.
          - id: i18n/hreflang-return/missing
            title: Мовна версія не посилається у відповідь
            severity: warning
            score: "5.2"
            scope: site
            rulesets:
              - i18n
            references:
              - https://developers.google.com/search/docs/specialty/international/localized-versions#html
            rationale: Hreflang працює лише тоді, коли версії називають одна одну, тож без зворотного посилання пошукові системи можуть ігнорувати анотацію, а відвідувачі потрапляють не на ту мову. Оцінюються лише оброблені сторінки, що відповідають 2xx.
          - id: i18n/hreflang/unreachable
            title: Посилання hreflang веде на сторінку, що не працює чи перенаправляє
            severity: warning
            score: "5.6"
            scope: site
            rulesets:
              - i18n
            references:
              - https://developers.google.com/search/docs/specialty/international/localized-versions#html
            rationale: Пошукові системи ігнорують цілі hreflang, які відповідають помилкою чи перенаправленням, тож ця мовна версія ніколи не пропонується її читачам. Повідомляється про цілі, що відповідають поза 2xx або перенаправляють.
          - id: i18n/metadata-language/mismatch
            title: Заголовок чи опис іншою мовою, ніж оголошує сторінка
            severity: info
            score: "2.8"
            scope: page
            rulesets:
              - i18n
            references:
              - https://www.w3.org/International/questions/qa-html-language-declarations
            rationale: Скрінрідери вимовляють текст за атрибутом lang, а пошукові системи добирають за ним аудиторію, тож розбіжність псує озвучення й може показати сторінку не тим читачам. Оцінюється лише тоді, коли визначення мови впевнене.
          - id: icons/apple-touch/missing
            title: Apple touch icon відсутній або непридатний
            severity: warning
            score: "3.8"
            scope: site
            rulesets:
              - icons
              - recommended
            references:
              - https://developer.apple.com/library/archive/documentation/AppleApplications/Reference/SafariWebContent/ConfiguringWebApplications/ConfiguringWebApplications.html
            rationale: Відвідувачі з iPhone та iPad, які додають сайт на домашній екран, отримують знімок екрана або порожню плитку замість логотипа.
            message: "піктограма Apple touch відсутня або непридатна: {got}"
          - id: icons/declared-size/mismatch
            title: Значки не відповідають розміру чи типу, які заявляють
            severity: warning
            score: "4.2"
            scope: site
            rulesets:
              - icons
              - recommended
            references:
              - https://developer.mozilla.org/docs/Web/HTML/Reference/Attributes/sizes
            rationale: Браузери обирають значок за заявленими розміром і типом, тож хибне оголошення змушує їх вибрати невдалий варіант або відхилити файл.
            message: "піктограми не мають розміру чи типу, які заявлено: {got}"
          - id: icons/favicon/missing
            title: Favicon відсутній або зламаний
            severity: warning
            score: "4.6"
            scope: site
            rulesets:
              - icons
              - recommended
            references:
              - https://developers.google.com/search/docs/appearance/favicon-in-search
            rationale: Вкладки браузера, закладки та результати пошуку показують порожній або типовий значок замість значка сайту, через що його важче впізнати.
            message: "favicon відсутній або пошкоджений: {got}"
          - id: icons/mask-icon/invalid
            title: Значок закріпленої вкладки Safari непридатний
            severity: off
            score: "3.3"
            scope: site
            rulesets:
              - icons
              - recommended
            references:
              - https://developer.apple.com/library/archive/documentation/AppleApplications/Reference/SafariWebContent/pinnedTabs/pinnedTabs.html
            rationale: Safari малює закріплену вкладку з цього значка, тож зламаний залишає вкладку порожньою або неправильного кольору. Safari 12 і новіші натомість беруть SVG-favicon, тому це майже не має значення.
            message: "піктограма закріпленої вкладки Safari непридатна; від Safari 12 замість неї править SVG rel=icon: {got}"
          - id: icons/ms-tile/unreachable
            title: Зображення плитки Windows або browserconfig.xml зламане
            severity: off
            score: "3.3"
            scope: site
            rulesets:
              - icons
              - recommended
            references:
              - https://learn.microsoft.com/previous-versions/windows/internet-explorer/ie-developer/platform-apis/dn320426(v=vs.85)
            rationale: Плитка сайту в меню «Пуск» Windows показує порожнє або типове зображення. Це важливо лише для старого закріплення у Windows, тож вплив невеликий.
            message: "зображення плитки Windows або browserconfig.xml пошкоджено: {got}"
          - id: icons/svg/invalid
            title: Немає придатного SVG-favicon
            severity: off
            score: "3.3"
            scope: site
            rulesets:
              - icons
              - recommended
            references:
              - https://developer.mozilla.org/docs/Web/HTML/Reference/Attributes/rel#icon
            rationale: SVG-значок лишається чітким за будь-якого розміру й може враховувати темний режим; без нього браузери повертаються до растрового значка фіксованого розміру.
            message: "немає придатного SVG-favicon: {got}"
          - id: images/compression/weak
            title: Зображення можна перекодувати значно меншим у його власному форматі
            severity: warning
            score: "4.8"
            scope: site
            rulesets:
              - images
            references:
              - https://web.dev/articles/use-imagemin-to-compress-images
            rationale: Неоптимізовані зображення роблять сторінки важчими, ніж потрібно, тож відвідувачі з повільним зв’язком чекають довше. Позначаються лише зображення, де перекодування дає помітну економію.
          - id: images/dimensions/missing
            title: Зображення без атрибутів width і height
            severity: warning
            score: "5.4"
            scope: page
            rulesets:
              - images
            references:
              - https://web.dev/articles/optimize-cls#images-without-dimensions
            rationale: Без них браузер не може зарезервувати місце, тому сторінка стрибає, коли вантажиться кожне зображення, і відвідувачі втрачають місце в тексті. Це також погіршує показник Cumulative Layout Shift, який враховують пошукові системи.
          - id: images/font-display/missing
            title: Веб-шрифти ховають текст, поки завантажуються
            severity: warning
            score: "5.0"
            scope: site
            rulesets:
              - images:assets
            references:
              - https://developer.mozilla.org/docs/Web/CSS/@font-face/font-display
            rationale: "@font-face без font-display: swap, fallback або optional залишає текст невидимим, доки не надійде шрифт, тож відвідувачі з повільним зв’язком бачать порожню сторінку."
          - id: images/font-format/outdated
            title: Веб-шрифт віддається не у форматі WOFF2
            severity: warning
            score: "4.4"
            scope: site
            rulesets:
              - images:assets
            references:
              - https://web.dev/articles/reduce-webfont-size
            rationale: WOFF2 стискає шрифти найкраще, і його підтримують усі сучасні браузери, тож інші формати змушують завантажувати більше для того самого тексту.
          - id: images/format/outdated
            title: Зображення JPEG, PNG або GIF було б меншим у форматі WebP або AVIF
            severity: warning
            score: "5.2"
            scope: site
            rulesets:
              - images
            references:
              - https://web.dev/articles/choose-the-right-image-format
            rationale: Старі формати зображень коштують відвідувачам зайвих байтів на кожному перегляді, через що сторінка повільніше вантажиться в мобільних мережах. Позначаються лише зображення, де перекодування дає помітну економію.
          - id: images/lazy-loading/missing
            title: Зображення нижче першого екрана не завантажуються відкладено
            severity: warning
            score: "4.8"
            scope: page
            rulesets:
              - images:live
            references:
              - https://web.dev/articles/browser-level-image-lazy-loading
            rationale: Зображення, до яких відвідувач ще не прокрутив, усе одно завантажуються одразу й конкурують із вмістом, який він прийшов читати. Оцінюються лише сторінки, відтворені в браузері.
          - id: images/lazy-loading/slow
            title: Зображення першого екрана завантажуються відкладено
            severity: warning
            score: "5.8"
            scope: page
            rulesets:
              - images:live
            references:
              - https://web.dev/articles/lcp-lazy-loading
            rationale: Відкладене зображення, видиме одразу при відкритті, починає вантажитися пізно, що затримує основний вміст і робить сторінку повільною на вигляд. Оцінюються лише сторінки, відтворені в браузері.
          - id: images/minification/missing
            title: Таблицю стилів або скрипт віддано без мінімізації
            severity: warning
            score: "4.2"
            scope: site
            rulesets:
              - images:assets
            references:
              - https://web.dev/articles/reduce-network-payloads-using-text-compression
            rationale: Пробіли й довгі назви в CSS та JavaScript додають байти, які кожен відвідувач завантажує, перш ніж сторінка зможе відобразитися. Позначаються лише файли, де мінімізація дає помітну економію.
          - id: images/rendered-size/large
            title: Зображення містять набагато більше пікселів, ніж показує сторінка
            severity: warning
            score: "4.4"
            scope: page
            rulesets:
              - images:live
            references:
              - https://web.dev/articles/serve-responsive-images
            rationale: Зображення, значно ширше за свій блок, марнує трафік і сповільнює завантаження, особливо на телефонах. Векторні зображення виняток, оцінюються лише сторінки, відтворені в браузері.
          - id: images/srcset/large
            title: Зображення без srcset набагато ширші, ніж показуються
            severity: warning
            score: "4.6"
            scope: page
            rulesets:
              - images
            references:
              - https://web.dev/articles/serve-responsive-images
            rationale: Один великий файл надсилається на всі екрани, тож телефони завантажують пікселі, яких ніколи не показують. Порівнюються лише зображення з числовим атрибутом width і без srcset.
          - id: images/weight/large
            title: Зображення важче за ліміт ваги
            severity: warning
            score: "5.6"
            scope: site
            rulesets:
              - images
            references:
              - https://developer.mozilla.org/docs/Learn_web_development/Extensions/Performance/Multimedia
            rationale: Дуже великий файл зображення сповільнює сторінку для всіх відвідувачів і витрачає мобільний трафік. Ліміт задається налаштуванням, за замовчуванням 200 кБ.
          - id: insight/number/outlier
            title: Кілька сторінок значно важчі чи повільніші за решту сайту
            severity: info
            score: "3.0"
            scope: site
            rulesets:
              - insights
            references:
              - https://www.itl.nist.gov/div898/handbook/eda/section3/eda35h.htm
            rationale: Сторінки, розмір, кількість запитів, час завантаження чи оцінка CO2 яких значно перевищує медіану, повільні для відвідувачів і дорогі за мобільним трафіком. За замовчуванням для порівняння потрібно щонайменше 20 сторінок.
          - id: insight/value/inconsistent
            title: Кілька сторінок віддаються інакше, ніж решта сайту
            severity: info
            score: "2.0"
            scope: site
            rulesets:
              - insights
            rationale: Коли майже всі сторінки мають однакову версію HTTP, кодування вмісту чи політику кешу, а кілька відрізняються, ці винятки зазвичай — хибно налаштований маршрут чи забуте правило, і відвідувачі отримують їх повільніше або без кешу. За замовчуванням потрібно щонайменше 20 сторінок, і одне значення має бути на 80 % із них.
          - id: keyboard/focus-outline/missing
            title: Елементи у фокусі не мають видимого індикатора фокуса
            severity: warning
            score: "6.0"
            scope: page
            rulesets:
              - keyboard
            references:
              - https://www.w3.org/WAI/WCAG22/Understanding/focus-visible.html
            rationale: Користувачі клавіатури не можуть зрозуміти, який елемент активний, коли фокус нічого не змінює на екрані. Оцінюються лише сторінки вибірки, пройдені клавішею Tab у браузері.
          - id: keyboard/focus/inaccessible
            title: Елемент у фокусі прихований під закріпленим вмістом
            severity: warning
            score: "5.8"
            scope: page
            rulesets:
              - keyboard
            references:
              - https://www.w3.org/WAI/WCAG22/Understanding/focus-not-obscured-minimum.html
            rationale: Користувачі клавіатури переходять Tab до елемента, якого не бачать, бо його закриває шапка чи банер. Оцінюються лише сторінки вибірки, пройдені клавішею Tab у браузері.
          - id: keyboard/forced-colors-focus/missing
            title: Індикатори фокуса зникають у режимі примусових кольорів
            severity: warning
            score: "5.4"
            scope: page
            rulesets:
              - keyboard
            references:
              - https://developer.mozilla.org/docs/Web/CSS/@media/forced-colors
            rationale: Кільце фокуса, намальоване лише через box-shadow, зникає в режимі високого контрасту Windows, і користувачі клавіатури втрачають фокус. Оцінюються лише сторінки вибірки, у браузері.
          - id: keyboard/skip-link/missing
            title: Перша зупинка Tab не є посиланням для переходу до основного вмісту
            severity: info
            score: "2.8"
            scope: page
            rulesets:
              - keyboard
