            scope: page
            rulesets:
              - security-headers
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Headers/X-Content-Type-Options
            rationale: Будь-яке інше значення не вимикає вгадування типу, тож захист не діє. Перевіряються лише відповіді, що надсилають заголовок.
            message: X-Content-Type-Options має бути nosniff
          - id: http/content-type-options/missing
            title: У відповіді немає X-Content-Type-Options
            severity: warning
            score: "5.7"
            scope: page
            rulesets:
              - security-headers
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Headers/X-Content-Type-Options
            rationale: Без nosniff браузер може вгадати тип файлу й виконати завантажений файл як скрипт, що відкриває шлях до атак на відвідувачів.
            message: немає X-Content-Type-Options
          - id: http/content-type/invalid
            title: Заголовок Content-Type має неправильний формат
            severity: warning
            score: "4.0"
            scope: page
            rulesets:
              - performance
