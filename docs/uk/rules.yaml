              - https://www.rfc-editor.org/rfc/rfc7208#section-6.1
            rationale: Повторювані механізми марнують ліміт у 10 запитів, а redirect, який all робить недосяжним, вводить в оману того, хто підтримує запис, тож його легше зламати. Перевіряється лише для імен із чинним записом SPF.
            message: SPF повторює механізм або містить redirect, який all робить недосяжним ({got})
          - id: mail/starttls-certificate/invalid
            title: Сертифікат STARTTLS поштового сервера недійсний для його імені
            severity: warning
            score: "6.0"
            scope: site
            rulesets:
              - mail
            references:
              - https://www.rfc-editor.org/rfc/rfc8461#section-4.2
            rationale: Відправники з MTA-STS або DANE відхиляють сертифікат, що не проходить перевірку, тож пошта на цей сервер затримується або повертається. Перевіряється лише коли ввімкнено перевірку STARTTLS.
            message: сертифікат STARTTLS обмінника не підтверджується для його імені, тому відправники з MTA-STS і DANE його відхиляють ({got})
          - id: mail/starttls/missing
            title: Поштовий сервер не пропонує STARTTLS на порту 25
            severity: warning
            score: "6.4"
            scope: site
            rulesets:
              - mail
            references:
              - https://www.rfc-editor.org/rfc/rfc3207
            rationale: Пошта до сервера без STARTTLS мандрує відкритим текстом, тож її може прочитати будь-хто на шляху. Перевіряється лише коли ввімкнено перевірку STARTTLS.
            message: обмінник не пропонує STARTTLS на порту 25, тому пошта до нього йде відкрито ({got})
          - id: mail/tls-rpt/invalid
            title: Запис TLS-RPT порушує синтаксис TLS-RPT
            severity: warning
            score: "4.6"
            scope: site
            rulesets:
              - mail
            references:
              - https://www.rfc-editor.org/rfc/rfc8460#section-3
            rationale: Відправники ігнорують некоректний запис, тож звіти про невдалі доставки через TLS не надходять. Перевіряється лише для імен, які приймають або надсилають пошту.
            message: запис TLS-RPT порушує граматику RFC 8460 ({got})
          - id: mail/tls-rpt/missing
            title: Ім’я не має запису TLS-RPT
            severity: info
            score: "1.8"
            scope: site
            rulesets:
              - mail
            references:
              - https://www.rfc-editor.org/rfc/rfc8460
            rationale: Без нього поштові сервери не можуть повідомляти про невдалі доставки через TLS, тож проблеми з шифруванням пошти імені лишаються непоміченими. Перевіряється лише для імен, які приймають або надсилають пошту.
            message: немає запису TLS-RPT, тому відправники не можуть повідомляти про невдалі доставки через TLS
          - id: manifest/document/invalid
            title: Маніфест веб-застосунку не розбирається
            severity: error
            score: "7.2"
            scope: site
            rulesets:
