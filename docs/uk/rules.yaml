              - recommended
            references:
              - https://developer.mozilla.org/docs/Web/Progressive_web_apps/Manifest
            rationale: Маніфест, що не є коректним JSON, браузери ігнорують, тож сайт не можна встановити як застосунок, а на домашньому екрані він втрачає назву та значки.
          - id: manifest/fields/missing
            title: У маніфесті веб-застосунку бракує полів, потрібних для встановлення
            severity: warning
            score: "5.0"
            scope: site
            rulesets:
              - manifest
            references:
              - https://developer.mozilla.org/docs/Web/Progressive_web_apps/Manifest
            rationale: Без name, start_url, display та icons браузери не пропонують встановити сайт, тож відвідувачі не отримують застосунок на домашньому екрані. Оцінюються лише маніфести, що розбираються.
          - id: manifest/icons/missing
            title: У значках маніфесту бракує потрібних розмірів або maskable-значка
            severity: warning
            score: "4.6"
            scope: site
            rulesets:
