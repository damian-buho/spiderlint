            rulesets:
              - performance
            references:
              - https://developer.mozilla.org/docs/Web/HTTP/Compression
            rationale: Браузери підтримують br, zstd і gzip; інші кодування можуть ігноруватися чи розпаковуватися повільно, тож відвідувачі можуть отримати повний нестиснений обсяг або помилку. Перевіряються лише текстові відповіді 2xx від 1 КБ, що вказують Content-Encoding.
