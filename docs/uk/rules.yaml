            rulesets:
              - recommended
            references:
              - https://www.rfc-editor.org/rfc/rfc9112#section-6.3
            rationale: Хибне обрамлення змушує браузери обрізати чи відхиляти відповідь, а проксі — по-різному визначати її кінець, чим користуються зловмисники для контрабанди запитів. Охоплює коротше тіло, Content-Length поряд із Transfer-Encoding або двічі та його наявність у 204.
          - id: http/content-type-options/invalid
