          - id: http/coep/invalid
            title: Заголовок Cross-Origin-Embedder-Policy має неправильний формат
            severity: warning
            score: "3.8"
            scope: page
            rulesets:
              - security-headers
            references:
              - https://html.spec.whatwg.org/multipage/browsers.html#the-coep-headers
